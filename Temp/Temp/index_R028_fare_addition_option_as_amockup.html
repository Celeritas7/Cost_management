      const addBtn = { flex: 1, padding: "8px 6px", borderRadius: 9, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 700, color: "#fff", fontFamily: "inherit", background: `linear-gradient(135deg,${theme.primary},${theme.accent})` };
      const skipBtn = { flex: 1, padding: "8px 6px", borderRadius: 9, cursor: "pointer", fontSize: 12, fontWeight: 600, color: theme.textMuted, background: "transparent", border: `1px solid ${theme.cardBorder}`, fontFamily: "inherit" };
      const snoozeBtn = { flex: 1, padding: "8px 6px", borderRadius: 9, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 600, color: theme.textDim, background: "transparent", fontFamily: "inherit" };

      return (
        <Modal sheet onClose={onClose}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
            <div>
              <div style={{ fontSize: 15, fontWeight: 700, color: "#fff", display: "flex", alignItems: "center", gap: 8 }}><Icon name="pin" size={16}/>Nearby payments</div>
              <div style={{ fontSize: 11.5, color: theme.textMuted, marginTop: 3 }}>{items.length} {items.length === 1 ? "trigger" : "triggers"} at this spot</div>
            </div>
            <button onClick={onClose} style={closeBtn}>×</button>
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {items.map((t) => {
              const busy = busyId === t.id;
              const fading = fadingId === t.id;
              const col = getCatColor(t.category);
              const needsAmount = t.amount == null;
              const rawAmt = amtInputs[t.id];
              const amtNum = parseInt(rawAmt, 10);
              const amtValid = rawAmt != null && String(rawAmt).trim() !== "" && Number.isInteger(amtNum) && amtNum > 0;
              const place = t._simulated ? "simulated here" : t._timeOnly ? "time window" : (t._distance != null ? `within ${t._distance}m` : "nearby");
              const win = (t.startTime && t.endTime) ? `${t.startTime}–${t.endTime}` : "any time";
              return (
                <div key={t.id} className={fading ? "cm-fade-out" : undefined} style={{ borderRadius: 12, background: theme.inputBg, boxShadow: `inset 0 0 0 1px ${theme.cardBorder}`, padding: "11px 12px", opacity: busy && !fading ? 0.6 : 1 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 9 }}>
                    <span style={{ width: 30, height: 30, borderRadius: 9, background: `${col}22`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0 }}>{getCatIcon(t.category)}</span>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 13.5, fontWeight: 600, color: "#fff", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.name}</div>
                      <div style={{ fontSize: 10.5, color: theme.textDim, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.shop} · {place} · {win}</div>
                    </div>
                    <span style={{ fontSize: 14, fontWeight: 700, color: "#fff", whiteSpace: "nowrap" }}>{needsAmount ? "—" : fmt(t.amount)}</span>
                  </div>
                  {needsAmount && (
                    <input type="number" inputMode="numeric" autoFocus value={rawAmt ?? ""} onChange={(e) => setAmt(t.id, e.target.value)} placeholder={CUR.symbol + " Enter amount"} disabled={busy} style={{ ...inputStyle, fontSize: 14, fontWeight: 600, marginBottom: 6 }} />
                  )}
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={() => doAdd(t, needsAmount ? amtNum : undefined)} disabled={busy || (needsAmount && !amtValid)} style={{ ...addBtn, opacity: (needsAmount && !amtValid) ? 0.5 : 1, cursor: (needsAmount && !amtValid) ? "not-allowed" : "pointer" }}>Add</button>
                    <button onClick={() => doSkip(t)} disabled={busy} style={skipBtn}>Skip</button>
                    <button onClick={() => doSnooze(t)} disabled={busy} style={snoozeBtn}>Snooze</button>
                  </div>
                </div>
              );
            })}
          </div>

          <button onClick={onClose} style={{ width: "100%", marginTop: 14, padding: "11px", borderRadius: 11, border: `1px solid ${theme.cardBorder}`, background: theme.inputBg, color: theme.textMuted, fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>
            Close / Later
          </button>
        </Modal>
      );
    }

    // ═══════════════════════════════════════════
    //  LOCATION TRIGGERS SETTINGS  (manage geofence + time-window rules)
    // ═══════════════════════════════════════════
    //  PURCHASE REQUESTS INBOX  (buy-requests from companion apps)
    // ╔══ kept under the historical component name ══
    function SukkiriRequestsView({ requests, reload }) {
      const { theme, inputStyle, supabase, fetchData, categories, shops } = useTheme();
      const [pasteOpen, setPasteOpen] = useState(false);
      const [pasteVal, setPasteVal] = useState("");
      const [busyId, setBusyId] = useState(null);
      const [toast, setToast] = useState(null);
      // approve confirm step: pick shop/date, adjust prices before inserting
      const [confirmId, setConfirmId] = useState(null);
      const [confShop, setConfShop] = useState("");
      const [confDate, setConfDate] = useState(ymdToday());
      const [confAmts, setConfAmts] = useState({});
      const flash = (m) => { setToast(m); setTimeout(() => setToast(null), 2400); };
      useEffect(() => { reload(); }, []);

      const pending = requests.filter((r) => !r.status || r.status === "pending");
      const handled = requests.filter((r) => r.status && r.status !== "pending");

      const setStatus = (id, status) => {
        const list = getPurchaseRequests().map((r) => r.id === id ? { ...r, status, resolvedAt: new Date().toISOString() } : r);
        setPurchaseRequests(list); reload();
      };

      const ensureCategory = async (name) => {
        if (categories.some((c) => c.name === name)) return true;
        const { error } = await supabase.from("cost_management_categories").insert({ name, icon: "🛒", color: "#10b981", sort_order: categories.length + 1 });
        if (error && !/duplicate/i.test(error.message)) { flash(`Couldn't create ${name} category`); return false; }
        return true;
      };


      const startApprove = (req) => {
        setConfirmId(req.id);
        setConfShop(req.source || "");
        setConfDate(ymdToday());
        const amts = {};
        (req.items || []).forEach((it, i) => { amts[i] = it.priceYen != null ? it.priceYen : (it.price != null ? it.price : ""); });
        setConfAmts(amts);
      };
      const approve = async (req) => {
        setBusyId(req.id);
        try {
          const region = (req.currency && CURRENCIES[req.currency]) ? req.currency : "JPY";
          const catNames = [...new Set((req.items || []).map((it) => it.category || "Other"))];
          for (const c of catNames) { if (!(await ensureCategory(c))) return; }
          const rows = (req.items || []).map((it, i) => ({
            region, date: confDate || ymdToday(), category: it.category || "Other", shop: (confShop || req.source || "Request").trim(),
            amount: Number(confAmts[i]) || 0,
            notes: [it.name, it.reason].filter(Boolean).join(" — "),
            expense_type: "normal", tags: "",
          })).filter((r) => r.amount > 0);
          if (!rows.length) { flash("Set at least one price above zero"); return; }
          const { error } = await supabase.from("cost_management_expenses").insert(rows);
          if (error) { flash("Insert failed: " + error.message); return; }
          setStatus(req.id, "approved");
          setConfirmId(null);
          await fetchData();
          flash(`Approved — ${rows.length} expense${rows.length === 1 ? "" : "s"} added`);
        } finally { setBusyId(null); }
      };
      const reject = (req) => { setStatus(req.id, "rejected"); flash("Request rejected"); };

      const importPaste = () => {
        let parsed;
        try { parsed = JSON.parse(pasteVal); } catch (e) { flash("That's not valid JSON"); return; }
        const { added } = mergePurchaseRequests(parsed);
        reload();
        if (added) { setPasteVal(""); setPasteOpen(false); flash(`Imported ${added} request${added === 1 ? "" : "s"}`); }
        else flash("No new requests found (already imported or wrong format)");
      };

      const reqDate = (r) => { try { const d = new Date(r.requestedAt); return `${MONTHS_SHORT[d.getMonth() + 1]} ${d.getDate()}, ${d.getFullYear()}`; } catch (e) { return ""; } };
      const total = (r) => r.totalYen != null ? r.totalYen : (r.items || []).reduce((s, it) => s + (Number(it.priceYen != null ? it.priceYen : it.price) || 0), 0);
      const curSym = (r) => (r.currency && CURRENCIES[r.currency]) ? CURRENCIES[r.currency].symbol : "¥";
      const miniBtn = (bg, fg) => ({ padding: "7px 13px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 600, fontFamily: "inherit", background: bg, color: fg });

      const card = (req, done) => (
        <div key={req.id} style={{ background: theme.inputBg, borderRadius: 12, padding: "13px 14px", marginBottom: 10, opacity: done ? 0.55 : 1 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8, flexWrap: "wrap" }}>
            <span style={{ fontSize: 12, color: theme.textMuted }}><span style={{ background: `${theme.primary}22`, color: theme.primary, borderRadius: 6, padding: "2px 7px", fontSize: 10, fontWeight: 700, textTransform: "capitalize", marginRight: 7 }}>{req.source || "app"}</span>{reqDate(req)}</span>
            <span style={{ fontSize: 15, fontWeight: 700, color: "#fff" }}>{curSym(req)}{Number(total(req)).toLocaleString()}</span>
          </div>
          <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 6 }}>
            {(req.items || []).map((it, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", gap: 10, fontSize: 12.5 }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ color: "#fff", fontWeight: 600 }}>{it.name}{it.link ? <> · <a href={it.link} target="_blank" rel="noreferrer" style={{ color: theme.primary, fontSize: 11 }}>link</a></> : null}</div>
                  {it.reason && <div style={{ color: theme.textDim, fontSize: 11, marginTop: 1 }}>{it.reason}</div>}
                </div>
                <span style={{ color: theme.textMuted, whiteSpace: "nowrap", fontWeight: 600 }}>{curSym(req)}{Number(it.priceYen != null ? it.priceYen : it.price || 0).toLocaleString()}</span>
              </div>
            ))}
          </div>
          {done ? (
            <div style={{ marginTop: 9, fontSize: 11, fontWeight: 700, color: req.status === "approved" ? theme.success || "#10b981" : theme.danger }}>{req.status === "approved" ? "✓ Approved — logged as expenses" : "✕ Rejected"}</div>
          ) : confirmId === req.id ? (
            <div style={{ marginTop: 11, background: theme.cardBg, borderRadius: 10, padding: "11px 12px", boxShadow: `inset 0 0 0 1px ${theme.primary}44` }}>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 9 }}>
                <div style={{ flex: "1 1 160px" }}>
                  <label style={{ fontSize: 10, fontWeight: 600, letterSpacing: 0.6, textTransform: "uppercase", color: theme.textDim, display: "block", marginBottom: 4 }}>Bought at</label>
                  <input list={`req-shops-${req.id}`} value={confShop} onChange={(e) => setConfShop(e.target.value)} placeholder="Shop name…" style={{ ...inputStyle, width: "100%", boxSizing: "border-box" }} />
                  <datalist id={`req-shops-${req.id}`}>{shops.map((s) => <option key={s.id} value={s.name} />)}{req.source && <option value={req.source} />}</datalist>
                </div>
                <div>
                  <label style={{ fontSize: 10, fontWeight: 600, letterSpacing: 0.6, textTransform: "uppercase", color: theme.textDim, display: "block", marginBottom: 4 }}>Date</label>
                  <input type="date" value={confDate} max={ymdToday()} onChange={(e) => setConfDate(e.target.value)} style={{ ...inputStyle, boxSizing: "border-box" }} />
                </div>
              </div>
              {(req.items || []).map((it, i) => (
                <div key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginBottom: 6 }}>
                  <span style={{ fontSize: 12, color: "#fff", minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{it.name}</span>
                  <input inputMode="numeric" value={confAmts[i] ?? ""} onChange={(e) => setConfAmts((a) => ({ ...a, [i]: e.target.value.replace(/[^0-9.]/g, "") }))} placeholder={curSym(req)} style={{ ...inputStyle, width: 96, textAlign: "right", boxSizing: "border-box" }} />
                </div>
              ))}
              <div style={{ fontSize: 10.5, color: theme.textDim, margin: "2px 0 9px" }}>Items priced 0 are skipped. Real prices from the till beat the app's estimates.</div>
              <div style={{ display: "flex", gap: 8 }}>
                <button disabled={busyId === req.id} onClick={() => approve(req)} style={{ ...miniBtn(theme.primary, "#fff"), flex: 1, padding: "10px", opacity: busyId === req.id ? 0.6 : 1 }}>{busyId === req.id ? "Adding…" : "Confirm — add expenses"}</button>
                <button onClick={() => setConfirmId(null)} style={{ ...miniBtn(theme.inputBg, theme.text), padding: "10px 14px" }}>Back</button>
              </div>
            </div>
          ) : (
            <div style={{ display: "flex", gap: 8, marginTop: 11 }}>
              <button onClick={() => startApprove(req)} style={{ ...miniBtn(theme.primary, "#fff"), flex: 1, padding: "10px" }}>Approve…</button>
              <button onClick={() => reject(req)} style={{ ...miniBtn(`${theme.danger}22`, theme.danger), padding: "10px 16px" }}>Reject</button>
            </div>
          )}
        </div>
      );

      return (
        <div style={{ background: theme.cardBg, border: `1px solid ${theme.cardBorder}`, borderRadius: 14, padding: 16 }}>
          {toast && <div style={{ position: "fixed", top: 16, left: "50%", transform: "translateX(-50%)", zIndex: 1000, padding: "9px 16px", borderRadius: 9, fontSize: 12, fontWeight: 600, background: theme.primary, color: "#fff" }}>{toast}</div>}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
            <div>
              <h3 style={{ fontSize: 15, fontWeight: 700, color: "#fff", margin: 0 }}>🛒 Purchase Requests</h3>
              <p style={{ fontSize: 11, color: theme.textDim, margin: "4px 0 0" }}>Buy-requests sent by companion apps (Sukkiri, etc.). Approving logs each item as an expense, dated today, under the item's category.</p>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => { reload(); flash("Refreshed"); }} style={miniBtn(theme.inputBg, theme.text)}>Refresh</button>
              <button onClick={() => setPasteOpen((o) => !o)} style={miniBtn(pasteOpen ? theme.primary : theme.inputBg, pasteOpen ? "#fff" : theme.text)}>Paste request</button>
            </div>
          </div>
          {pasteOpen && (
            <div style={{ marginTop: 12 }}>
              <textarea value={pasteVal} onChange={(e) => setPasteVal(e.target.value)} placeholder='Paste the request JSON copied from the sending app…' rows={5} style={{ ...inputStyle, fontFamily: "monospace", fontSize: 11.5, resize: "vertical", width: "100%", boxSizing: "border-box" }} />
              <button onClick={importPaste} style={{ ...miniBtn(theme.primary, "#fff"), marginTop: 8 }}>Import</button>
            </div>
          )}
          <div style={{ marginTop: 14 }}>
            {pending.length === 0 && <div style={{ textAlign: "center", padding: "26px 10px", color: theme.textDim, fontSize: 12 }}>No pending requests — they appear here when a companion app sends one.</div>}
            {pending.map((r) => card(r, false))}
          </div>
          {handled.length > 0 && (
            <div style={{ marginTop: 18 }}>
              <div style={{ fontSize: 10, fontWeight: 600, letterSpacing: 0.6, textTransform: "uppercase", color: theme.textDim, marginBottom: 8 }}>Handled</div>
              {handled.slice(-6).reverse().map((r) => card(r, true))}
            </div>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════
    function LocationTriggersView() {
      const { theme, inputStyle, categories, shops, getCatIcon, getCatColor, locTriggers, reloadTriggers, checkLocation, locStatus, supabase } = useTheme();
      const [editing, setEditing] = useState(null);
      const [showForm, setShowForm] = useState(false);
      const [capturing, setCapturing] = useState(false);
      const [coordRaw, setCoordRaw] = useState("");
      const [toast, setToast] = useState(null);
      const flash = (m) => { setToast(m); setTimeout(() => setToast(null), 2200); };

      const newId = () => "lt_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const blank = () => ({ id: newId(), name: "", category: categories[0]?.name || "", shop: "", amount: "", cond: "both", freq: "daily", monthDay: new Date().getDate(), radius: 150, dwellMinutes: 2, startTime: "08:00", endTime: "10:00", lat: null, lng: null, expense_type: "normal", tags: "", is_active: true });
      const startNew = () => { setEditing(blank()); setCoordRaw(""); setShowForm(true); };
      const startEdit = (t) => { setEditing({ ...t, amount: t.amount == null ? "" : String(t.amount), cond: t.cond || (t.lat != null && t.startTime ? "both" : t.lat != null ? "location" : "time"), dwellMinutes: t.dwellMinutes != null ? t.dwellMinutes : 0, freq: t.freq || "daily", monthDay: t.monthDay || new Date().getDate() }); setCoordRaw(t.lat != null ? `${t.lat}, ${t.lng}` : ""); setShowForm(true); };
      const cancel = () => { setShowForm(false); setEditing(null); };
      const set = (k, v) => setEditing((e) => ({ ...e, [k]: v }));

      const captureGPS = () => {
        if (!("geolocation" in navigator)) { flash("Location not available here"); return; }
        setCapturing(true);
        navigator.geolocation.getCurrentPosition(
          (p) => { setEditing((e) => ({ ...e, lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6) })); setCoordRaw(`${+p.coords.latitude.toFixed(6)}, ${+p.coords.longitude.toFixed(6)}`); setCapturing(false); flash("Pinned your location"); },
          (err) => { setCapturing(false); flash(err.code === 1 ? "Permission denied — use sample spot" : "Couldn't locate — use sample spot"); },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      };
      const useSample = () => { setEditing((e) => ({ ...e, lat: 35.6762, lng: 139.6503 })); setCoordRaw("35.6762, 139.6503"); flash("Sample spot pinned (Tokyo)"); };

      const save = () => {
        const e = editing;
        if (!e.name.trim()) { flash("Name required"); return; }
        if (!e.category || !e.shop.trim()) { flash("Category + shop required"); return; }
        const wantTime = e.cond === "time" || e.cond === "both";
        const wantLoc = e.cond === "location" || e.cond === "both";
        if (wantTime && (!e.startTime || !e.endTime)) { flash("Set a time window"); return; }
        if (wantLoc && (e.lat == null || e.lng == null)) { flash("Pin a location first"); return; }
        const rec = { ...e, region: e.region || CUR.code, name: e.name.trim(), shop: e.shop.trim(), amount: e.amount === "" ? null : Number(e.amount), radius: Number(e.radius) || 150, dwellMinutes: Math.max(0, Number(e.dwellMinutes) || 0), startTime: wantTime ? e.startTime : null, endTime: wantTime ? e.endTime : null, lat: wantLoc ? e.lat : null, lng: wantLoc ? e.lng : null };
        const list = getStoredTriggers();
        const i = list.findIndex((x) => x.id === rec.id);
        if (i >= 0) list[i] = rec; else list.push(rec);
        setStoredTriggers(list); upsertTriggerDB(supabase, rec); reloadTriggers(); cancel(); flash("Saved");
      };
      const remove = (id) => { setStoredTriggers(getStoredTriggers().filter((x) => x.id !== id)); deleteTriggerDB(supabase, id); reloadTriggers(); };
      const toggle = (t) => { const next = getStoredTriggers().map((x) => x.id === t.id ? { ...x, is_active: !x.is_active } : x); setStoredTriggers(next); const u = next.find((x) => x.id === t.id); if (u) upsertTriggerDB(supabase, u); reloadTriggers(); };

      const formShops = editing ? shops.filter((s) => s.category === editing.category) : [];
      const card = { background: theme.inputBg, borderRadius: 10, padding: "11px 12px", marginBottom: 8 };
      const lbl = { fontSize: 10, fontWeight: 600, letterSpacing: 0.6, textTransform: "uppercase", color: theme.textDim, display: "block", marginBottom: 5 };
      const miniBtn = (bg, fg) => ({ padding: "7px 11px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 600, fontFamily: "inherit", background: bg, color: fg });

      return (
        <div style={{ background: theme.cardBg, border: `1px solid ${theme.cardBorder}`, borderRadius: 14, padding: 16 }}>
          {toast && <div style={{ position: "fixed", top: 16, left: "50%", transform: "translateX(-50%)", zIndex: 1000, padding: "9px 16px", borderRadius: 9, fontSize: 12, fontWeight: 600, background: theme.primary, color: "#fff" }}>{toast}</div>}

          <p style={{ fontSize: 11.5, color: theme.textDim, margin: "0 0 12px", lineHeight: 1.5 }}>
            Fire a payment prompt by time of day, by staying at a place, or both. For a place you must stay inside the radius for the set minutes — not just pass by. Matches pile up; enter them one by one.
          </p>

          <div style={{ display: "flex", gap: 8, marginBottom: 6, flexWrap: "wrap" }}>
            <button onClick={() => checkLocation()} style={{ ...miniBtn(theme.primary, "#fff"), display: "inline-flex", alignItems: "center", gap: 6 }}><Icon name="pin" size={14}/>Check in now</button>
            <button onClick={startNew} style={miniBtn(theme.inputBg, theme.text)}>+ New trigger</button>
          </div>
          {locStatus && <div style={{ fontSize: 11, color: theme.textMuted, marginBottom: 10 }}>{locStatus}</div>}

          {showForm && editing && (
            <div style={{ ...card, padding: 14, marginTop: 6, marginBottom: 14, boxShadow: `inset 0 0 0 1px ${theme.primary}55` }}>
              <label style={lbl}>Name</label>
              <input value={editing.name} onChange={(e) => set("name", e.target.value)} placeholder="e.g. Morning konbini run" style={{ ...inputStyle, marginBottom: 10 }} />
              <label style={lbl}>Repeat on</label>
              <div style={{ display: "flex", gap: 6, marginBottom: 10, flexWrap: "wrap" }}>
                {[["daily", "Daily"], ["weekdays", "Weekdays"], ["weekend", "Weekend"], ["monthly", "Day of month"]].map(([val, lt]) => (
                  <button key={val} onClick={() => set("freq", val)} style={{ flex: "1 1 auto", minWidth: 72, padding: "8px 6px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 11.5, fontWeight: 600, fontFamily: "inherit", background: (editing.freq || "daily") === val ? theme.primary : theme.inputBg, color: (editing.freq || "daily") === val ? "#fff" : theme.textMuted }}>{lt}</button>
                ))}
              </div>
              {editing.freq === "monthly" && (
                <div style={{ marginBottom: 10 }}>
                  <label style={lbl}>Day of month (1–31)</label>
                  <input type="number" min="1" max="31" value={editing.monthDay || 1} onChange={(e) => set("monthDay", Math.max(1, Math.min(31, Number(e.target.value) || 1)))} style={{ ...inputStyle, width: 120 }} />
                </div>
              )}
              <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                <div style={{ flex: 1 }}>
                  <label style={lbl}>Category</label>
                  <select value={editing.category} onChange={(e) => { set("category", e.target.value); set("shop", ""); }} style={{ ...inputStyle, cursor: "pointer" }}>
                    {categories.map((c) => <option key={c.name} value={c.name}>{c.icon} {c.name}</option>)}
                  </select>
                </div>
                <div style={{ flex: 1 }}>
                  <label style={lbl}>Amount (optional)</label>
                  <input type="number" inputMode="numeric" value={editing.amount} onChange={(e) => set("amount", e.target.value)} placeholder="ask each time" style={inputStyle} />
                </div>
              </div>
              <label style={lbl}>Shop</label>
              {formShops.length > 0 && (
                <select value={formShops.some((s) => s.name === editing.shop) ? editing.shop : ""} onChange={(e) => e.target.value && set("shop", e.target.value)} style={{ ...inputStyle, cursor: "pointer", marginBottom: 6 }}>
                  <option value="">Pick a shop…</option>
                  {formShops.map((s) => <option key={s.id} value={s.name}>{s.is_favorite ? "⭐ " : ""}{s.name}</option>)}
                </select>
              )}
              <input value={editing.shop} onChange={(e) => set("shop", e.target.value)} placeholder="Or type a shop name" style={{ ...inputStyle, marginBottom: 10 }} />
              <label style={lbl}>Trigger when</label>
              <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
                {[["time", "Time of day"], ["location", "At a place"], ["both", "Both"]].map(([val, lt]) => (
                  <button key={val} onClick={() => set("cond", val)} style={{ flex: 1, padding: "8px 6px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 11.5, fontWeight: 600, fontFamily: "inherit", background: editing.cond === val ? theme.primary : theme.inputBg, color: editing.cond === val ? "#fff" : theme.textMuted }}>{lt}</button>
                ))}
              </div>
              {(editing.cond === "time" || editing.cond === "both") && (
                <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                  <div style={{ flex: 1 }}>
                    <label style={lbl}>From</label>
                    <input type="time" value={editing.startTime || ""} onChange={(e) => set("startTime", e.target.value)} style={{ ...inputStyle, cursor: "pointer" }} />
                  </div>
                  <div style={{ flex: 1 }}>
                    <label style={lbl}>To</label>
                    <input type="time" value={editing.endTime || ""} onChange={(e) => set("endTime", e.target.value)} style={{ ...inputStyle, cursor: "pointer" }} />
                  </div>
                </div>
              )}
              {(editing.cond === "location" || editing.cond === "both") && (
                <>
                  <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                    <div style={{ flex: 1 }}>
                      <label style={lbl}>Radius m</label>
                      <input type="number" value={editing.radius} onChange={(e) => set("radius", e.target.value)} style={inputStyle} />
                    </div>
                    <div style={{ flex: 1 }}>
                      <label style={lbl}>Stay for (min)</label>
                      <input type="number" value={editing.dwellMinutes} onChange={(e) => set("dwellMinutes", e.target.value)} style={inputStyle} />
                    </div>
                  </div>
                  <label style={lbl}>Location</label>
                  <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginBottom: 12 }}>
                    <button onClick={captureGPS} disabled={capturing} style={{ ...miniBtn(theme.primary, "#fff"), display: "inline-flex", alignItems: "center", gap: 6 }}>{capturing ? "Locating…" : <><Icon name="pin" size={14}/>Use my location</>}</button>
                    <button onClick={useSample} style={miniBtn(theme.inputBg, theme.text)}>Use sample spot</button>
                    <input value={coordRaw} onChange={(e) => { const v = e.target.value; setCoordRaw(v); const m = v.split(/[ ,]+/).map((s) => parseFloat(s.trim())).filter((n) => !isNaN(n)); if (m.length === 2 && Math.abs(m[0]) <= 90 && Math.abs(m[1]) <= 180) { set("lat", m[0]); set("lng", m[1]); } else if (v.trim() === "") { set("lat", null); set("lng", null); } }} placeholder="or paste from a map: 35.6762, 139.6503" style={{ ...inputStyle, flex: 1, minWidth: 160, fontSize: 12, color: editing.lat != null ? theme.success : theme.text }} />
                  </div>
                </>
              )}
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={save} style={{ ...miniBtn(theme.primary, "#fff"), flex: 1, padding: "10px" }}>Save trigger</button>
                <button onClick={cancel} style={{ ...miniBtn("transparent", theme.textMuted), flex: 1, padding: "10px", boxShadow: `inset 0 0 0 1px ${theme.cardBorder}` }}>Cancel</button>
              </div>
            </div>
          )}

          {locTriggers.length === 0 && !showForm && (
            <div style={{ textAlign: "center", padding: "26px 10px", color: theme.textDim, fontSize: 12 }}>No location triggers yet — tap "+ New trigger".</div>
          )}

          {locTriggers.map((t) => {
            const col = getCatColor(t.category);
            const hasTime = !!(t.startTime && t.endTime), hasLoc = t.lat != null;
            const bits = []; bits.push(t.freq === "monthly" ? `Day ${t.monthDay || 1}` : ({ weekdays: "Weekdays", weekend: "Weekend" }[t.freq] || "Daily"));
            if (hasTime) bits.push(`${t.startTime}–${t.endTime}`);
            if (hasLoc) bits.push(`${t.radius || 150}m` + (Number(t.dwellMinutes) > 0 ? ` · stay ${t.dwellMinutes}m` : ""));
            return (
              <div key={t.id} style={{ ...card, display: "flex", alignItems: "center", gap: 8, opacity: t.is_active ? 1 : 0.5 }}>
                <span style={{ width: 30, height: 30, borderRadius: 9, background: `${col}22`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0 }}>{getCatIcon(t.category)}</span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: "#fff", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.name || "Untitled"}</div>
                  <div style={{ fontSize: 10.5, color: theme.textDim, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.shop}{bits.length ? " · " + bits.join(" · ") : ""}{t.amount != null ? ` · ${fmt(t.amount)}` : ""}</div>
                </div>
                <button onClick={() => checkLocation({ simTriggerId: t.id })} title="Simulate being here" style={miniBtn(`${theme.primary}22`, theme.primary)}>Test</button>
                <button onClick={() => toggle(t)} style={{ ...miniBtn(t.is_active ? `${theme.success}22` : theme.inputBg, t.is_active ? theme.success : theme.textDim), minWidth: 42 }}>{t.is_active ? "On" : "Off"}</button>
                <button onClick={() => startEdit(t)} style={{ background: "none", border: "none", cursor: "pointer", padding: "3px 5px", color: theme.textMuted, display: "inline-flex" }}><Icon name="pencil" size={15}/></button>
                <button onClick={() => remove(t.id)} style={{ background: "none", border: "none", cursor: "pointer", padding: "3px 5px", color: theme.danger, opacity: 0.85, display: "inline-flex" }}><Icon name="trash" size={15}/></button>
              </div>
            );
          })}
        </div>
      );
    }

    // ═══════════════════════════════════════════
    //  OUTSTANDING INBOX  (missed obligations waiting to be logged or dismissed)
    // ═══════════════════════════════════════════
    function OutstandingView({ pending, recurring, refresh }) {
      const { theme, supabase, getCatIcon, getCatColor, inputStyle } = useTheme();
      const [busyId, setBusyId] = useState(null);
      const [amtInputs, setAmtInputs] = useState({});
      const setAmt = (id, v) => setAmtInputs((p) => ({ ...p, [id]: v }));
      const ruleOf = (rid) => recurring.find((r) => r.id === rid) || {};

      const doLog = async (p, amount) => {
        if (busyId) return; setBusyId(p.id);
        const r = ruleOf(p.rule_id);
        const amt = amount != null ? amount : (p.amount != null ? p.amount : r.amount);
        if (amt == null || !(Number(amt) > 0)) { setBusyId(null); return; }
        const { error } = await supabase.from("cost_management_expenses").insert({ region: regionOf(r), date: p.due_date, category: r.category, shop: r.shop, amount: Number(amt), notes: r.notes || "", expense_type: r.expense_type || "normal", tags: r.tags || "" });
        if (!error) await supabase.from("cost_management_pending").update({ status: "logged", amount: Number(amt), resolved_at: new Date().toISOString() }).eq("id", p.id);
        await refresh(); setBusyId(null); vibrate(10);
      };
      const doDismiss = async (p) => {
        if (busyId) return; setBusyId(p.id);
        await supabase.from("cost_management_pending").update({ status: "dismissed", resolved_at: new Date().toISOString() }).eq("id", p.id);
        await refresh(); setBusyId(null);
      };

      const sorted = [...pending].sort((a, b) => (a.due_date < b.due_date ? 1 : -1));
      const total = sorted.reduce((s, p) => s + (p.amount != null ? p.amount : (ruleOf(p.rule_id).amount || 0)), 0);

      return (
        <div style={{ maxWidth: 680, margin: "0 auto", paddingBottom: 40 }}>
          <div style={{ marginTop: 8, marginBottom: 14 }}>
            <h3 style={{ fontSize: 16, fontWeight: 700, color: "#fff", margin: 0, display: "flex", alignItems: "center", gap: 8 }}><Icon name="inbox" size={17}/>Outstanding</h3>
            <p style={{ fontSize: 11.5, color: theme.textDim, margin: "4px 0 0" }}>Expected entries you have not logged yet. Log or dismiss each whenever you are ready — they wait here until you do.</p>
          </div>
          {sorted.length === 0 ? (
            <div style={{ textAlign: "center", padding: "60px 20px", color: theme.textDim }}>
              <div style={{ display: "inline-flex", marginBottom: 10, opacity: 0.5 }}><Icon name="check" size={34}/></div>
              <div style={{ fontSize: 13 }}>All caught up — nothing outstanding.</div>
            </div>
          ) : (
            <>
              <div style={{ fontSize: 11.5, color: theme.textMuted, marginBottom: 10 }}>{sorted.length} waiting · {fmt(total)} est.</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {sorted.map((p) => {
                  const r = ruleOf(p.rule_id);
                  const col = getCatColor(r.category);
                  const busy = busyId === p.id;
                  const known = p.amount != null ? p.amount : r.amount;
                  const needsAmount = known == null;
                  const raw = amtInputs[p.id];
                  const amtNum = parseInt(raw, 10);
                  const amtValid = raw != null && String(raw).trim() !== "" && Number.isInteger(amtNum) && amtNum > 0;
                  return (
                    <div key={p.id} style={{ borderRadius: 12, background: theme.inputBg, boxShadow: `inset 0 0 0 1px ${theme.cardBorder}`, padding: "11px 12px", opacity: busy ? 0.6 : 1 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 9 }}>
                        <span style={{ width: 30, height: 30, borderRadius: 9, background: `${col}22`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0 }}>{getCatIcon(r.category)}</span>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: 13.5, fontWeight: 600, color: "#fff", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.name || "Rule"}</div>
                          <div style={{ fontSize: 10.5, color: theme.textDim, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.shop} · {dueDateLabel(p.due_date)}</div>
                        </div>
                        <span style={{ fontSize: 14, fontWeight: 700, color: "#fff", whiteSpace: "nowrap" }}>{needsAmount ? "—" : fmt(known)}</span>
                      </div>
                      {needsAmount && (
                        <input type="number" inputMode="numeric" value={raw ?? ""} onChange={(e) => setAmt(p.id, e.target.value)} placeholder={CUR.symbol + " Enter amount"} disabled={busy} style={{ ...inputStyle, fontSize: 14, fontWeight: 600, marginBottom: 6 }} />
                      )}
                      <div style={{ display: "flex", gap: 6 }}>
                        <button onClick={() => doLog(p, needsAmount ? amtNum : undefined)} disabled={busy || (needsAmount && !amtValid)} style={{ flex: 1, padding: "8px 6px", borderRadius: 9, border: "none", cursor: (needsAmount && !amtValid) ? "not-allowed" : "pointer", fontSize: 12, fontWeight: 700, color: "#fff", fontFamily: "inherit", background: `linear-gradient(135deg,${theme.primary},${theme.accent})`, opacity: (needsAmount && !amtValid) ? 0.5 : 1 }}>Log it</button>
                        <button onClick={() => doDismiss(p)} disabled={busy} style={{ flex: 1, padding: "8px 6px", borderRadius: 9, cursor: "pointer", fontSize: 12, fontWeight: 600, color: theme.textMuted, background: "transparent", border: `1px solid ${theme.cardBorder}`, fontFamily: "inherit" }}>Dismiss</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
