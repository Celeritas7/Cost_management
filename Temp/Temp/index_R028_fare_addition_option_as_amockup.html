    // ═══ PHASE A — Transit fare: multi-leg journey builder ═══
    // A trip is a sequence of stops (A → B → C …); each consecutive pair is a leg
    // looked up separately, because transfers are priced per operator, not end-to-end.
    function FareCalcView({ allExpenses, dueAdd }) {
      const { theme, inputStyle, labelStyle, supabase, fetchData, currency } = useTheme();
      const { insertExpense, modals } = useExpenseMutations({ onChange: fetchData });
      const [stops, setStops] = useState(["", ""]);
      const [legs, setLegs] = useState([]);
      const [manual, setManual] = useState({});
      const [busy, setBusy] = useState(false);
      const [date, setDate] = useState(ymdToday());
      const [card, setCard] = useState(null);
      const [round, setRound] = useState(false); // return trip: same legs priced again in reverse
      const [sugg, setSugg] = useState(null);      // route suggestion: {vias, summary, transfers} | {error}
      const [suggBusy, setSuggBusy] = useState(false);

      const stations = useMemo(() => {
        const s = new Set(SEED_STATIONS);
        allExpenses.forEach((e) => { if (e.category === "Transportation" && e.shop && e.shop.includes("→")) e.shop.split("→").forEach((p) => { const x = p.trim(); if (x) s.add(x); }); });
        return [...s].sort();
      }, [allExpenses]);
      const recentTrips = useMemo(() => {
        const seen = new Set(), out = [];
        for (const e of allExpenses) {
          if (e.category !== "Transportation" || !e.shop || !e.shop.includes("→")) continue;
          if (seen.has(e.shop)) continue;
          seen.add(e.shop); out.push(e);
          if (out.length === 4) break;
        }
        return out;
      }, [allExpenses]);

      const reset = () => { setLegs([]); setManual({}); setSugg(null); };
      const setStop = (i, v) => { setStops((s) => s.map((x, j) => (j === i ? v : x))); reset(); };
      const addStop = () => { setStops((s) => [...s, ""]); reset(); };
      const removeStop = (i) => { setStops((s) => (s.length <= 2 ? s : s.filter((_, j) => j !== i))); reset(); };
      const reverse = () => { setStops((s) => [...s].reverse()); reset(); };

      const clean = stops.map((s) => s.trim());
      const legPairs = clean.slice(0, -1).map((f, i) => [f, clean[i + 1]]).filter(([f, to]) => f && to);
      const canCalc = legPairs.length === stops.length - 1 && legPairs.every(([f, to]) => f !== to);

      const endA = clean[0], endB = clean[clean.length - 1];
      const canSuggest = !!endA && !!endB && endA !== endB;
      const suggest = async () => {
        if (!canSuggest || suggBusy) return;
        setSuggBusy(true); setSugg(null);
        let res = null, err = null;
        try { const r = await supabase.functions.invoke("fare-lookup", { body: { from_station: endA, to_station: endB } }); res = r.data; err = r.error; }
        catch (e) { err = e; }
        setSuggBusy(false);
        if (err || !res || res.error) { setSugg({ error: (res && res.reason) || (err && err.message) || "Lookup failed" }); return; }
        setSugg({ vias: res.via_stations || [], summary: res.route_summary || "", transfers: res.transfers });
      };
      const applySugg = () => {
        if (!sugg || sugg.error) return;
        setStops([endA, ...sugg.vias, endB]);
        setLegs([]); setManual({}); setSugg(null);
      };

      const calc = async () => {
        if (!canCalc || busy) return;
        setBusy(true); setLegs([]); setManual({}); setCard(null);
        const out = [];
        for (const [f, to] of legPairs) out.push(await fareLookup(supabase, f, to)); // sequential: shared cache table
        setLegs(out); setBusy(false);
      };

      const amounts = legs.map((r, i) => (r && !r.error ? r.fare_ic : parseInt(manual[i], 10)));
      const allPriced = legs.length > 0 && amounts.every((a) => Number.isInteger(a) && a > 0);
      const oneWay = allPriced ? amounts.reduce((a, b) => a + b, 0) : null;
      const total = oneWay == null ? null : round ? oneWay * 2 : oneWay;

      const save = async () => {
        if (!allPriced || busy) return;
        const route = round ? clean.join(" → ") + " → " + clean[0] : clean.join(" → ");
        const legNotes = legs.map((r, i) => `${legPairs[i][0]}→${legPairs[i][1]} ${fmt(amounts[i])}${r && !r.error ? "" : " (manual)"}`).join(" · ");
        const notes = round ? `Round trip · out ${legNotes} · return same fares` : legNotes;
        const res = await insertExpense({ region: currency, date, category: "Transportation", shop: route, amount: total, notes, expense_type: "normal", tags: "" });
        const out = legs.map((r, i) => ({ from: legPairs[i][0], to: legPairs[i][1], amount: amounts[i], source: r && !r.error ? r.source : "manual", km: r && !r.error ? r.distance_km : null }));
        const back = round ? [...out].reverse().map((l) => ({ ...l, from: l.to, to: l.from })) : [];
        if (res.ok) setCard({ route, legs: out, back, oneWay, total, date, round });
      };
      const startNew = () => { setCard(null); setStops(["", ""]); reset(); };

      if (card) return (
        <div className="cm-fade" style={{ maxWidth: 560, margin: "0 auto" }}>
          <div style={{ background: theme.cardBg, border: `1px solid ${theme.success}55`, borderRadius: 12, padding: 16 }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 12 }}>
              <span style={{ fontSize: 13.5, fontWeight: 700, color: "#fff", display: "inline-flex", alignItems: "center", gap: 8 }}><Icon name="train" size={15}/>Journey saved</span>
              <span style={{ fontSize: 10.5, color: theme.textMuted }}>{card.date}</span>
            </div>
            {[["Outbound", card.legs, theme.primary], ["Return", card.back || [], theme.accent]].map(([label, list, dot]) => list.length === 0 ? null : (
              <div key={label} style={{ marginBottom: 12 }}>
                {card.round && <div style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.6, color: theme.textDim, marginBottom: 2 }}>{label}</div>}
                {list.map((l, i) => (
                  <div key={i} style={{ display: "grid", gridTemplateColumns: "14px 1fr auto", gap: 10, alignItems: "center", padding: "9px 0", borderBottom: i < list.length - 1 ? `1px solid ${theme.cardBorder}` : "none" }}>
                    <span style={{ display: "flex", justifyContent: "center" }}><span style={{ width: 8, height: 8, borderRadius: 8, background: dot, display: "block" }}/></span>
                    <span style={{ minWidth: 0 }}>
                      <span style={{ display: "block", fontSize: 12.5, fontWeight: 600, color: "#fff", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{l.from} → {l.to}</span>
                      <span style={{ display: "block", fontSize: 10.5, color: theme.textDim }}>Leg {i + 1}{l.km != null ? ` · ${l.km} km` : ""}{l.source === "manual" ? " · manual" : l.source === "cache" ? " · cached" : " · live"}</span>
                    </span>
                    <span style={{ fontSize: 13, fontWeight: 700, color: "#fff", whiteSpace: "nowrap" }}>{fmt(l.amount)}</span>
                  </div>
                ))}
              </div>
            ))}
            <div style={{ background: theme.inputBg, borderRadius: 10, padding: "11px 13px" }}>
              {card.round && (
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: theme.textMuted, marginBottom: 6 }}><span>Each way</span><span>{fmt(card.oneWay)} × 2</span></div>
              )}
              <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
                <span style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 0.5, fontWeight: 600, color: theme.textMuted }}>Total · {card.legs.length + (card.back ? card.back.length : 0)} leg{card.legs.length + (card.back ? card.back.length : 0) === 1 ? "" : "s"}</span>
                <span style={{ fontSize: 21, fontWeight: 700, color: "#fff" }}>{fmt(card.total)}</span>
              </div>
            </div>
            <div style={{ fontSize: 11.5, color: theme.success, fontWeight: 600, marginTop: 10 }}>✓ Added to expenses as one Transportation entry</div>
            <button onClick={startNew} style={{ width: "100%", marginTop: 12, padding: "11px", borderRadius: 10, border: `1px solid ${theme.cardBorder}`, background: theme.inputBg, color: theme.text, cursor: "pointer", fontFamily: "inherit", fontSize: 12.5, fontWeight: 700 }}>Plan another journey</button>
          </div>
          {modals}
        </div>
      );

      return (
        <div className="cm-fade" style={{ maxWidth: 560, margin: "0 auto" }}>
          <datalist id="cm-stations">{stations.map((s) => <option key={s} value={s}/>)}</datalist>
          <div style={{ background: theme.cardBg, border: `1px solid ${theme.cardBorder}`, borderRadius: 12, padding: 16 }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, flexWrap: "wrap", marginBottom: 4 }}>
              <span style={{ fontSize: 13.5, fontWeight: 700, color: "#fff", display: "inline-flex", alignItems: "center", gap: 8, whiteSpace: "nowrap" }}><Icon name="train" size={15}/>Transit journey</span>
              <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
              <button onClick={() => setRound((r) => !r)} title="Price the trip back as well" style={{ border: `1px solid ${round ? theme.primary : theme.cardBorder}`, background: round ? theme.primaryGlow : theme.inputBg, color: round ? "#fff" : theme.textMuted, borderRadius: 9, padding: "5px 9px", cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 5, fontFamily: "inherit", fontSize: 11, fontWeight: 600, whiteSpace: "nowrap", flexShrink: 0 }}><Icon name="repeat" size={13}/>Round trip</button>
              <button onClick={reverse} title="Reverse the whole journey" style={{ border: `1px solid ${theme.cardBorder}`, background: theme.inputBg, color: theme.textMuted, borderRadius: 9, padding: "5px 9px", cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 5, fontFamily: "inherit", fontSize: 11, fontWeight: 600, whiteSpace: "nowrap", flexShrink: 0 }}><Icon name="swap" size={13}/>Reverse</button>
              </div>
            </div>
            <div style={{ fontSize: 11, color: theme.textDim, marginBottom: 12 }}>Add every station you change at — each hop is priced separately and summed.</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 10 }}>
              {stops.map((s, i) => (
                <div key={i} style={{ display: "grid", gridTemplateColumns: "58px 1fr auto", gap: 8, alignItems: "center" }}>
                  <span style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.5, color: i === 0 ? theme.primary : i === stops.length - 1 ? theme.accent : theme.textMuted }}>{i === 0 ? "From" : i === stops.length - 1 ? "To" : "Via " + i}</span>
                  <input list="cm-stations" value={s} onChange={(e) => setStop(i, e.target.value)} placeholder={i === 0 ? "Nishi-Funabashi" : i === stops.length - 1 ? "Shinjuku" : "Transfer station"} style={inputStyle}/>
                  <button onClick={() => removeStop(i)} disabled={stops.length <= 2} title="Remove stop" style={{ border: `1px solid ${theme.cardBorder}`, background: theme.inputBg, color: theme.textMuted, width: 36, height: 41, borderRadius: 10, cursor: stops.length <= 2 ? "not-allowed" : "pointer", opacity: stops.length <= 2 ? 0.35 : 1, fontFamily: "inherit", fontSize: 16, lineHeight: 1 }}>×</button>
                </div>
              ))}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10 }}>
              <button onClick={addStop} style={{ padding: "9px", borderRadius: 10, border: `1px dashed ${theme.cardBorder}`, background: "transparent", color: theme.textMuted, cursor: "pointer", fontFamily: "inherit", fontSize: 12, fontWeight: 600, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6 }}><Icon name="add" size={13}/>Add transfer stop</button>
              <button onClick={suggest} disabled={!canSuggest || suggBusy} title="Look up where you change trains between From and To" style={{ padding: "9px", borderRadius: 10, border: `1px dashed ${canSuggest ? theme.primary + "88" : theme.cardBorder}`, background: "transparent", color: canSuggest ? theme.primary : theme.textMuted, cursor: canSuggest && !suggBusy ? "pointer" : "not-allowed", opacity: canSuggest ? 1 : 0.5, fontFamily: "inherit", fontSize: 12, fontWeight: 600, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6 }}><Icon name="zap" size={13}/>{suggBusy ? "Finding route…" : "Suggest transfers"}</button>
            </div>
            {sugg && (
              <div className="cm-slide-in" style={{ borderRadius: 10, background: theme.inputBg, boxShadow: `inset 0 0 0 1px ${sugg.error ? theme.warning + "55" : theme.primary + "55"}`, padding: "11px 13px", marginBottom: 10 }}>
                {sugg.error ? (
                  <div style={{ fontSize: 11.5, color: theme.textDim }}>Couldn't fetch a route — {sugg.error}. Add your transfer stops manually.</div>
                ) : sugg.vias.length === 0 ? (
                  <div style={{ fontSize: 12, color: "#fff", fontWeight: 600 }}>Direct — no transfer needed <span style={{ fontWeight: 400, color: theme.textDim, fontSize: 11 }}>{sugg.summary && `· ${sugg.summary}`}</span></div>
                ) : (
                  <div>
                    <div style={{ fontSize: 10.5, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.5, color: theme.textMuted, marginBottom: 6 }}>Suggested route · {sugg.vias.length} transfer{sugg.vias.length === 1 ? "" : "s"}</div>
                    <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap: 5, marginBottom: 4 }}>
                      {[endA, ...sugg.vias, endB].map((s, i, arr) => (
                        <React.Fragment key={i}>
                          <span style={{ fontSize: 11.5, fontWeight: 600, color: i === 0 || i === arr.length - 1 ? "#fff" : theme.primary, background: i === 0 || i === arr.length - 1 ? "transparent" : theme.primary + "22", border: i === 0 || i === arr.length - 1 ? "none" : `1px solid ${theme.primary}44`, borderRadius: 7, padding: i === 0 || i === arr.length - 1 ? 0 : "2px 7px" }}>{s}</span>
                          {i < arr.length - 1 && <span style={{ color: theme.textDim, fontSize: 10 }}>→</span>}
                        </React.Fragment>
                      ))}
                    </div>
                    {sugg.summary && <div style={{ fontSize: 10.5, color: theme.textDim, marginBottom: 8 }}>{sugg.summary}</div>}
                    <button onClick={applySugg} style={{ width: "100%", padding: "8px", borderRadius: 9, border: "none", background: theme.primaryGlow, color: "#fff", cursor: "pointer", fontFamily: "inherit", fontSize: 12, fontWeight: 700 }}>Use this route — fill {sugg.vias.length} via stop{sugg.vias.length === 1 ? "" : "s"}</button>
                  </div>
                )}
              </div>
            )}
            <button onClick={calc} disabled={!canCalc || busy} style={{ width: "100%", padding: "11px", borderRadius: 10, border: "none", cursor: canCalc && !busy ? "pointer" : "not-allowed", fontSize: 13, fontWeight: 700, color: "#fff", fontFamily: "inherit", background: `linear-gradient(135deg,${theme.primary},${theme.accent})`, opacity: canCalc && !busy ? 1 : 0.5 }}>{busy ? "Looking up legs…" : `Calculate ${Math.max(stops.length - 1, 1)} leg${stops.length - 1 === 1 ? "" : "s"}`}</button>

            {legs.length > 0 && (
              <div className="cm-slide-in" style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 8 }}>
                {legs.map((r, i) => (
                  <div key={i} style={{ borderRadius: 10, background: theme.inputBg, boxShadow: `inset 0 0 0 1px ${r && r.error ? theme.warning + "55" : theme.cardBorder}`, padding: "11px 13px" }}>
                    <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 8, flexWrap: "wrap" }}>
                      <span style={{ fontSize: 12, fontWeight: 600, color: "#fff" }}>{legPairs[i][0]} → {legPairs[i][1]}</span>
                      {r && !r.error ? (
                        <span style={{ fontSize: 10, fontWeight: 700, color: r.source === "cache" ? theme.warning : theme.success, background: `${r.source === "cache" ? theme.warning : theme.success}18`, border: `1px solid ${r.source === "cache" ? theme.warning : theme.success}44`, borderRadius: 8, padding: "2px 7px" }}>{r.source === "cache" ? "CACHED" : "LIVE"} · {String(r.looked_up_at).slice(0, 10)}</span>
                      ) : (
                        <span style={{ fontSize: 10, fontWeight: 700, color: theme.warning }}>MANUAL</span>
                      )}
                    </div>
                    {r && !r.error ? (
                      <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginTop: 4, flexWrap: "wrap" }}>
                        <span style={{ fontSize: 18, fontWeight: 700, color: "#fff" }}>{fmt(r.fare_ic)}</span>
                        <span style={{ fontSize: 10.5, color: theme.textMuted }}>{r.fare_ticket != null && `Ticket ${fmt(r.fare_ticket)} · `}{r.distance_km != null && `${r.distance_km} km`}</span>
                      </div>
                    ) : (
                      <React.Fragment>
                        <div style={{ fontSize: 10.5, color: theme.textDim, marginTop: 3 }}>{(r && r.reason) || "Lookup unavailable"} — enter this leg's fare</div>
                        <input type="number" inputMode="numeric" value={manual[i] || ""} onChange={(e) => setManual((m) => ({ ...m, [i]: e.target.value }))} placeholder={CUR.symbol + " IC fare"} style={{ ...inputStyle, fontSize: 13.5, fontWeight: 600, marginTop: 6 }}/>
                      </React.Fragment>
                    )}
                  </div>
                ))}
                <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", padding: "4px 2px" }}>
                  <span style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 0.5, fontWeight: 600, color: theme.textMuted }}>Journey total{round ? " · round trip" : ""}</span>
                  <span style={{ fontSize: 20, fontWeight: 700, color: total != null ? "#fff" : theme.textDim }}>{total != null ? fmt(total) : "—"}{round && oneWay != null ? <span style={{ fontSize: 11, fontWeight: 600, color: theme.textMuted }}> ({fmt(oneWay)} × 2)</span> : null}</span>
                </div>
                <div>
                  <label style={labelStyle}>Date</label>
                  <input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={{ ...inputStyle, colorScheme: "dark", marginBottom: 8 }}/>
                  <button onClick={save} disabled={!allPriced} style={{ width: "100%", padding: "11px", borderRadius: 10, border: "none", cursor: allPriced ? "pointer" : "not-allowed", fontSize: 13, fontWeight: 700, color: "#fff", fontFamily: "inherit", background: `linear-gradient(135deg,${theme.primary},${theme.accent})`, opacity: allPriced ? 1 : 0.5 }}>Add {round ? "round trip" : "journey"} as expense{total != null ? ` · ${fmt(total)}` : ""}</button>
                </div>
              </div>
            )}
          </div>

          {recentTrips.length > 0 && legs.length === 0 && (
            <div style={{ marginTop: 14 }}>
              <div style={{ fontSize: 10.5, color: theme.textDim, textTransform: "uppercase", letterSpacing: 0.5, fontWeight: 600, marginBottom: 6 }}>Recent journeys · tap to reload</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                {recentTrips.map((e) => (
                  <button key={e.id} onClick={() => { setStops(e.shop.split("→").map((p) => p.trim())); reset(); }} style={{ display: "flex", alignItems: "center", gap: 10, textAlign: "left", width: "100%", padding: "10px 12px", borderRadius: 10, border: `1px solid ${theme.cardBorder}`, background: theme.cardBg, cursor: "pointer", fontFamily: "inherit" }}>
                    <Icon name="train" size={14} style={{ color: theme.textMuted, flexShrink: 0 }}/>
                    <span style={{ flex: 1, minWidth: 0, fontSize: 12.5, fontWeight: 600, color: "#fff", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.shop}</span>
                    <span style={{ fontSize: 11.5, color: theme.textMuted, whiteSpace: "nowrap" }}>{fmt(e.amount)}</span>
                  </button>
                ))}
              </div>
            </div>
          )}
          {modals}
        </div>
      );
    }

    // ═══ PHASE C — Location-based Shop Capture + category inference ═══
    function ShopCaptureView({ allExpenses }) {
      const { theme, inputStyle, labelStyle, supabase, fetchData, categories, currency, getCatIcon } = useTheme();
      const { insertExpense, modals } = useExpenseMutations({ onChange: fetchData });
      const [locState, setLocState] = useState("idle"); // idle | locating | picked
      const [cands, setCands] = useState(null);
      const [locErr, setLocErr] = useState("");
      const [manualName, setManualName] = useState("");
      const [form, setForm] = useState(null);
      const [infer, setInfer] = useState(null);
      const [saved, setSaved] = useState(false);
      const validCats = useMemo(() => categories.map((c) => c.name), [categories]);
      const startForm = (name, placeTypes) => {
        const inf = inferCategory(name, allExpenses, placeTypes, validCats);
        // instrument the cascade: which step produced this suggestion
        console.log(`[capture] cascade step ${inf.step} (${CASCADE_LABELS[inf.step]})`, { shop: name, ...inf });
        setInfer(inf); setSaved(false);
        setForm({ shop: name, category: inf.category, amount: "", date: ymdToday(), notes: "" });
      };
      const locate = () => {
        setLocErr(""); setCands(null); setForm(null);
        if (!("geolocation" in navigator)) { setLocErr("Location isn't available here — type the shop name instead."); return; }
        setLocState("locating");
        navigator.geolocation.getCurrentPosition(async (p) => {
          let res = null, err = null;
          try { const r = await supabase.functions.invoke("places-nearby", { body: { lat: p.coords.latitude, lng: p.coords.longitude } }); res = r.data; err = r.error; }
          catch (e) { err = e; }
          setLocState("idle");
          if (err || !res || res.error || !Array.isArray(res.candidates)) { setLocErr((res && res.reason) || (err && err.message) || "Shop lookup failed — type the name instead."); return; }
          if (!res.candidates.length) { setLocErr("No shops found nearby — type the name instead."); return; }
          setCands(res.candidates); // pick-list, never auto-select (GPS drift indoors)
        }, (e) => { setLocState("idle"); setLocErr(e.code === 1 ? "Location permission denied — type the shop name instead." : "Couldn't get your location — type the shop name instead."); }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
      };
      const confirm = async () => {
        const amt = parseInt(form.amount, 10);
        if (!(amt > 0) || !form.shop.trim() || !form.category) return;
        // Whatever I confirm is written back, so cascade step 1 covers this shop next time.
        const res = await insertExpense({ region: currency, date: form.date, category: form.category, shop: form.shop.trim(), amount: amt, notes: form.notes || "", expense_type: "normal", tags: "" });
        if (res.ok) { setSaved(true); setForm(null); setCands(null); setInfer(null); setManualName(""); }
      };
      const amtNum = form ? parseInt(form.amount, 10) : NaN;
      const canConfirm = form && amtNum > 0 && form.shop.trim() && form.category;
      const stepBadge = infer && (
        <span style={{ fontSize: 10, fontWeight: 700, color: infer.step === 4 ? theme.warning : theme.success, background: `${infer.step === 4 ? theme.warning : theme.success}16`, border: `1px solid ${infer.step === 4 ? theme.warning : theme.success}44`, borderRadius: 8, padding: "2px 7px", whiteSpace: "nowrap" }}>
          step {infer.step} · {infer.step === 3 ? `like “${infer.matchedShop}”` : CASCADE_LABELS[infer.step]}
        </span>
      );
      return (
        <div className="cm-fade" style={{ maxWidth: 560, margin: "0 auto" }}>
          <div style={{ background: theme.cardBg, border: `1px solid ${theme.cardBorder}`, borderRadius: 12, padding: 16 }}>
            <div style={{ fontSize: 13.5, fontWeight: 700, color: "#fff", display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}><Icon name="crosshair" size={15}/>Capture this shop</div>
            <div style={{ fontSize: 11, color: theme.textDim, marginBottom: 12 }}>One tap resolves where you are, infers the category, and pre-fills the entry for you to confirm.</div>
            <button onClick={locate} disabled={locState === "locating"} style={{ width: "100%", padding: "12px", borderRadius: 10, border: "none", cursor: locState === "locating" ? "wait" : "pointer", fontSize: 13, fontWeight: 700, color: "#fff", fontFamily: "inherit", background: `linear-gradient(135deg,${theme.primary},${theme.accent})`, opacity: locState === "locating" ? 0.6 : 1 }}>{locState === "locating" ? "Finding shops near you…" : "📍 Find shops near me"}</button>
            {locErr && <div style={{ fontSize: 11.5, color: theme.warning, marginTop: 8 }}>{locErr}</div>}
            {cands && !form && (
              <div className="cm-slide-in" style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 12 }}>

    //  SVG CHARTS (dependency-free — replaces Recharts, which fails to paint)
    // ═══════════════════════════════════════════
    function SvgAreaChart({ data, height = 220, color, gridColor, labelColor, labelStep = 1, peakColor }) {
      if (!data || data.length === 0) return <div style={{ height, display: "flex", alignItems: "center", justifyContent: "center", color: labelColor, fontSize: 12 }}>No data for this range</div>;
      const W = 540, H = height, padL = 42, padR = 10, padT = 14, padB = 22;
      const innerW = W - padL - padR, innerH = H - padT - padB;
      const max = Math.max(...data.map(d => d.total), 1) * 1.12;
      const n = data.length;
      const x = i => padL + (n === 1 ? innerW / 2 : (i / (n - 1)) * innerW);
      const y = v => padT + innerH * (1 - v / max);
      const pts = data.map((d, i) => [x(i), y(d.total)]);
      let line = `M ${pts[0][0]} ${pts[0][1]}`;
      for (let i = 1; i < n; i++) { const mx = (pts[i-1][0] + pts[i][0]) / 2; line += ` C ${mx} ${pts[i-1][1]}, ${mx} ${pts[i][1]}, ${pts[i][0]} ${pts[i][1]}`; }
      const area = `${line} L ${pts[n-1][0]} ${padT + innerH} L ${pts[0][0]} ${padT + innerH} Z`;
      const peakIdx = data.reduce((bi, d, i, a) => (d.total > a[bi].total ? i : bi), 0);
      const gridVals = [0, 0.5, 1].map(t => (max / 1.12) * t);
      const uid = useMemo(() => Math.random().toString(36).slice(2, 8), []);
      return (
        <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block", overflow: "visible" }}>
          <defs><linearGradient id={`ag-${uid}`} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.3" /><stop offset="100%" stopColor={color} stopOpacity="0.02" /></linearGradient></defs>
          {gridVals.map((gv, i) => (
            <g key={i}>
              <line x1={padL} y1={y(gv)} x2={W - padR} y2={y(gv)} stroke={gridColor} strokeDasharray="3 3" strokeWidth="1" />
              <text x={padL - 6} y={y(gv) + 3} textAnchor="end" fontSize="9" fill={labelColor} fontFamily="inherit">{`${CUR.symbol}${Math.round(gv / 1000)}k`}</text>
            </g>
          ))}
          <path d={area} fill={`url(#ag-${uid})`} />
          <path d={line} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
          {pts.map(([cx, cy], i) => (
            <circle key={i} cx={cx} cy={cy} r={i === peakIdx ? 4 : (n > 40 ? 0 : 2.2)} fill={i === peakIdx ? (peakColor || color) : color} stroke="rgba(0,0,0,0.4)" strokeWidth="1">
              <title>{data[i].label}: {fmt(data[i].total)}</title>
            </circle>
          ))}
          {data.map((d, i) => (i % labelStep === 0 ? <text key={`l${i}`} x={x(i)} y={H - 6} textAnchor="middle" fontSize={n > 20 ? 7.5 : 9} fill={i === peakIdx ? (peakColor || color) : labelColor} fontWeight={i === peakIdx ? 700 : 400} fontFamily="inherit">{d.label}</text> : null))}
        </svg>
      );
    }
    function SvgBarChart({ data, height = 180, color, gridColor, labelColor, labelStep = 1, peakColor }) {
      if (!data || data.length === 0) return <div style={{ height, display: "flex", alignItems: "center", justifyContent: "center", color: labelColor, fontSize: 12 }}>No data for this range</div>;
      const W = 540, H = height, padL = 42, padR = 10, padT = 12, padB = 22;
      const innerW = W - padL - padR, innerH = H - padT - padB;
      const max = Math.max(...data.map(d => d.total), 1) * 1.1;
      const n = data.length, slot = innerW / n, bw = Math.min(24, slot * 0.62);
      const y = v => padT + innerH * (1 - v / max);
      const peakIdx = data.reduce((bi, d, i, a) => (d.total > a[bi].total ? i : bi), 0);
      const gridVals = [0, 0.5, 1].map(t => (max / 1.1) * t);
      return (
        <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block", overflow: "visible" }}>
          {gridVals.map((gv, i) => (
            <g key={i}>
              <line x1={padL} y1={y(gv)} x2={W - padR} y2={y(gv)} stroke={gridColor} strokeDasharray="3 3" strokeWidth="1" />
              <text x={padL - 6} y={y(gv) + 3} textAnchor="end" fontSize="9" fill={labelColor} fontFamily="inherit">{`${CUR.symbol}${Math.round(gv / 1000)}k`}</text>
            </g>
          ))}
          {data.map((d, i) => {
            const bx = padL + slot * i + (slot - bw) / 2;
            const by = y(d.total);
            return (
              <g key={i}>
                <rect x={bx} y={by} width={bw} height={Math.max(0, padT + innerH - by)} rx="2" fill={i === peakIdx ? (peakColor || color) : color} opacity={i === peakIdx ? 1 : 0.85}>
                  <title>{d.label}: {fmt(d.total)}</title>
                </rect>
                {i % labelStep === 0 && <text x={bx + bw / 2} y={H - 6} textAnchor="middle" fontSize={n > 20 ? 7 : 8.5} fill={labelColor} fontFamily="inherit">{d.label}</text>}
              </g>
            );
          })}
        </svg>
      );
    }
    function SvgDonut({ data, getColor, height = 140 }) {
      const total = (data || []).reduce((s, d) => s + d.value, 0);
      if (!data || data.length === 0 || total <= 0) return <div style={{ height, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, opacity: 0.5 }}>No data</div>;
      const size = height, th = 20, r = (size - th) / 2 - 2, c = size / 2, circ = 2 * Math.PI * r;
      let acc = 0;
      return (
        <div style={{ display: "flex", justifyContent: "center" }}>
          <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size} style={{ display: "block" }}>
            {data.map((s, i) => {
              const frac = s.value / total, dash = Math.max(frac * circ - 1.5, 0.5);
              const el = (
                <circle key={i} cx={c} cy={c} r={r} fill="none" stroke={getColor(s.name)} strokeWidth={th}
                  strokeDasharray={`${dash} ${circ - dash}`} strokeDashoffset={-acc * circ} transform={`rotate(-90 ${c} ${c})`}>
                  <title>{s.name}: {fmt(s.value)} ({Math.round(frac * 100)}%)</title>
                </circle>
              );
              acc += frac;
              return el;
            })}
            <text x={c} y={c + 4} textAnchor="middle" fontSize="13" fontWeight="700" fill="#fff" fontFamily="inherit">{`${CUR.symbol}${Math.round(total / 1000)}k`}</text>
          </svg>
        </div>
      );
    }
    function OverviewView({ filtered, totalSpend, monthlyAvg, dailyAvg, monthlyData, catData, topShops, allExpenses }) {
      const { theme, getCatIcon, getCatColor, categories, shops, tags } = useTheme();
      const [timeRange, setTimeRange] = useState("monthly"); // monthly, weekly, daily
      const [filters, setFilters] = useState(getStoredGraphFilters);
      const [filterOpen, setFilterOpen] = useState(false); const [moreFiltersOpen, setMoreFiltersOpen] = useState(false);
      const [filterToast, setFilterToast] = useState(null);

      useEffect(() => { setStoredGraphFilters(filters); }, [filters]);
      useEffect(() => {
        if (!filterToast) return;
        const t = setTimeout(() => setFilterToast(null), 2000);
        return () => clearTimeout(t);
      }, [filterToast]);

      const hasActiveFilters = filters.excludeOutliers || filters.excludeFixed ||
        filters.categories.length > 0 || filters.shops.length > 0 || filters.tags.length > 0 ||
        !!filters.dateFrom || !!filters.dateTo;

      const toggleField = (field) => { vibrate(10); setFilters(f => ({ ...f, [field]: !f[field] })); };
      const toggleInArray = (field, val) => { vibrate(10); setFilters(f => ({
        ...f, [field]: f[field].includes(val) ? f[field].filter(x => x !== val) : [...f[field], val],
      })); };
      const setDate = (field, val) => setFilters(f => ({ ...f, [field]: val }));
      const resetFilters = () => { vibrate(10); setFilters({ ...DEFAULT_GRAPH_FILTERS, categories: [], shops: [], tags: [] }); setFilterToast("Filters reset"); };

      const chipStyle = (active, color) => ({
        padding: "5px 10px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 11,
        display: "flex", alignItems: "center", gap: 4,
        background: active ? `${color}30` : theme.cardBg,
        color: active ? color : theme.textMuted,
        outline: active ? `2px solid ${color}` : `1px solid ${theme.cardBorder}`,
      });
      const filterLabelStyle = { fontSize: 10, color: theme.textMuted, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 6, display: "block" };
      const dateInputStyle = { background: theme.inputBg, border: `1px solid ${theme.inputBorder}`, color: theme.text, padding: "6px 10px", borderRadius: 8, fontSize: 12, fontFamily: "inherit" };

      // Calculate data for different time ranges
      // Graph-filtered dataset (filters applied on top of the raw expenses).
      const graphFiltered = useMemo(() => applyGraphFilters(allExpenses, filters), [allExpenses, filters]);

      const chartData = useMemo(() => {
        const fd = graphFiltered;
        const now = new Date();
        const custom = filters.dateFrom || filters.dateTo;
        const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
        const sortedDates = fd.map(e => e.date).sort();
        // When a custom range is partially set, fall back to the data extent for the open side.
        const fromD = filters.dateFrom ? parse(filters.dateFrom) : (sortedDates.length ? parse(sortedDates[0]) : now);
        const toD = filters.dateTo ? parse(filters.dateTo) : (sortedDates.length ? parse(sortedDates[sortedDates.length - 1]) : now);
        const dayKey = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
        const mondayOf = (dt) => { const x = new Date(dt); const day = x.getDay(); x.setDate(x.getDate() - (day === 0 ? 6 : day - 1)); x.setHours(0, 0, 0, 0); return x; };

        if (timeRange === "monthly") {
          const months = [];
          const startM = custom ? new Date(fromD.getFullYear(), fromD.getMonth(), 1) : new Date(now.getFullYear(), now.getMonth() - 11, 1);
          const endM = custom ? new Date(toD.getFullYear(), toD.getMonth(), 1) : new Date(now.getFullYear(), now.getMonth(), 1);
          let d = new Date(startM);
          while (d <= endM) {
            const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
            months.push({ key, label: `${MONTHS_SHORT[d.getMonth() + 1]} ${String(d.getFullYear()).slice(2)}`, total: 0 });
            d = new Date(d.getFullYear(), d.getMonth() + 1, 1);
          }
          fd.forEach(e => {
            const d2 = new Date(e.date);
            const key = `${d2.getFullYear()}-${String(d2.getMonth() + 1).padStart(2, "0")}`;
            const month = months.find(m => m.key === key);
            if (month) month.total += e.amount;
          });
          return months;
        }

        if (timeRange === "weekly") {
          const weeks = [];
          const lastStart = custom ? mondayOf(toD) : mondayOf(now);
          let cursor = custom ? mondayOf(fromD) : (() => { const c = new Date(lastStart); c.setDate(c.getDate() - 11 * 7); return c; })();
          while (cursor <= lastStart) {
            const weekStart = new Date(cursor);
            const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6); weekEnd.setHours(23, 59, 59, 999);
            weeks.push({ key: dayKey(weekStart), start: weekStart, end: weekEnd, label: `${weekStart.getMonth() + 1}/${weekStart.getDate()}`, total: 0 });
            cursor = new Date(cursor); cursor.setDate(cursor.getDate() + 7);
          }
          fd.forEach(e => {
            const d2 = new Date(e.date);
            const week = weeks.find(w => d2 >= w.start && d2 <= w.end);
            if (week) week.total += e.amount;
          });
          return weeks.map(w => ({ key: w.key, label: w.label, total: w.total }));
        }

        if (timeRange === "daily") {
          const days = [];
          let cursor = custom ? new Date(fromD) : (() => { const c = new Date(now); c.setDate(c.getDate() - 59); return c; })();
          const endD = custom ? new Date(toD) : new Date(now);
          cursor.setHours(0, 0, 0, 0); endD.setHours(0, 0, 0, 0);
          while (cursor <= endD) {
            const key = dayKey(cursor);
            days.push({ key, label: `${cursor.getMonth() + 1}/${cursor.getDate()}`, total: 0 });
            cursor = new Date(cursor); cursor.setDate(cursor.getDate() + 1);
          }
          fd.forEach(e => {
            const day = days.find(d => d.key === e.date);
            if (day) day.total += e.amount;
          });
          return days;
        }

        return [];
      }, [graphFiltered, timeRange, filters.dateFrom, filters.dateTo]);

      // Date span the chart currently covers (for the exclusion summary).
      const windowRange = useMemo(() => {
        const now = new Date();
        const fmtLocal = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
        if (filters.dateFrom || filters.dateTo) {
          return { start: filters.dateFrom || "0000-01-01", end: filters.dateTo || "9999-12-31" };
        }
        let start;
        if (timeRange === "monthly") start = new Date(now.getFullYear(), now.getMonth() - 11, 1);
        else if (timeRange === "weekly") { start = new Date(now); const day = now.getDay(); start.setDate(now.getDate() - (day === 0 ? 6 : day - 1) - 11 * 7); }
        else { start = new Date(now); start.setDate(now.getDate() - 59); }
        return { start: fmtLocal(start), end: fmtLocal(now) };
      }, [filters.dateFrom, filters.dateTo, timeRange]);

      // Summary of what the active filters removed from the current window.
      const exclusionSummary = useMemo(() => {
        if (!hasActiveFilters) return null;
        const windowRaw = allExpenses.filter(e => e.date >= windowRange.start && e.date <= windowRange.end);
        const kept = new Set(applyGraphFilters(windowRaw, filters).map(e => e.id));
        const excluded = windowRaw.filter(e => !kept.has(e.id));
        if (!excluded.length) return null;
        const sumOf = (rows) => rows.reduce((s, r) => s + r.amount, 0);
        const segs = [];
        const counted = new Set();
        if (filters.excludeOutliers) {
          const o = excluded.filter(e => e.expense_type === "outlier");
          o.forEach(e => counted.add(e.id));
          if (o.length) segs.push(`${o.length} outlier${o.length > 1 ? "s" : ""} (${fmt(sumOf(o))})`);
        }
        if (filters.excludeFixed) {
          const fx = excluded.filter(e => e.expense_type === "fixed");
          fx.forEach(e => counted.add(e.id));
          if (fx.length) segs.push(`${fx.length} fixed (${fmt(sumOf(fx))})`);
        }
        const narrowed = excluded.filter(e => !counted.has(e.id));
        if (narrowed.length) segs.push(`${narrowed.length} filtered out (${fmt(sumOf(narrowed))})`);
        return segs.length ? "Excluded: " + segs.join(", ") : null;
      }, [allExpenses, filters, windowRange, hasActiveFilters]);

      // Calculate stats for the selected time range
      const rangeStats = useMemo(() => {
        const nonZeroPeriods = chartData.filter(d => d.total > 0);
        const total = chartData.reduce((s, d) => s + d.total, 0);
        const avg = nonZeroPeriods.length > 0 ? Math.round(total / nonZeroPeriods.length) : 0;
        const max = Math.max(...chartData.map(d => d.total), 0);
        const maxPeriod = chartData.find(d => d.total === max);
        return { total, avg, max, maxPeriod };
      }, [chartData]);

      const CustomTooltip = ({ active, payload, label }) => {
        if (!active || !payload?.length) return null;

    // ═══════════════════════════════════════════
    //  RECURRING FORM (shared add / edit)
    // ═══════════════════════════════════════════
    function RecurringForm({ initial, saving, onSave, onCancel, onDelete }) {
      const { theme, inputStyle, categories, shops } = useTheme();
      const [form, setForm] = useState(initial);
      const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

      const categoryShops = useMemo(() => {
        if (!form.category) return [];
        return shops.filter(s => s.category === form.category).sort(favSort);
      }, [shops, form.category]);

      const changeFreq = (freq) => setForm(f => ({
        ...f, frequency: freq,
        day_value: freq === "monthly"
          ? (f.day_value >= 1 && f.day_value <= 31 ? f.day_value : 1)
          : freq === "weekly"
          ? (f.day_value != null && f.day_value >= 0 && f.day_value <= 6 ? f.day_value : null)
          : null,
      }));

      const dayOk = form.frequency === "monthly"
        ? (Number(form.day_value) >= 1 && Number(form.day_value) <= 31)
        : form.frequency === "weekly"
        ? (form.day_value != null && form.day_value !== "")
        : true;
      // Amount is optional: blank → "ask me each time it's due". If provided, must be > 0.
      const amountStr = String(form.amount ?? "").trim();
      const amountOk = amountStr === "" || Number(amountStr) > 0;
      const valid = form.name.trim() && amountOk && form.category && form.shop.trim() && dayOk;

      const labelS = { fontSize: 11, color: theme.textMuted, marginBottom: 6, display: "block" };
      const segBtn = (on, color) => ({
        flex: 1, padding: "8px 6px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 11,
        background: on ? (color && color !== "transparent" ? `${color}30` : theme.primaryGlow) : theme.inputBg,
        color: on ? (color && color !== "transparent" ? color : "#fff") : theme.textMuted,
        outline: on ? `2px solid ${color && color !== "transparent" ? color : theme.primary}` : `1px solid ${theme.cardBorder}`,
      });

      return (
        <div style={{ maxHeight: "72vh", overflowY: "auto", paddingRight: 2 }}>
          {/* Name */}
          <div style={{ marginBottom: 12 }}>
            <label style={labelS}>NAME</label>
            <input type="text" value={form.name} onChange={e => set("name", e.target.value)} placeholder="e.g. Rent, Konbini" style={{ ...inputStyle, fontSize: 13 }} />
          </div>
          {/* Amount */}
          <div style={{ marginBottom: 12 }}>
            <label style={labelS}>AMOUNT</label>
            <input type="number" inputMode="numeric" value={form.amount ?? ""} onChange={e => set("amount", e.target.value)} placeholder={CUR.symbol} style={{ ...inputStyle, fontSize: 14, fontWeight: 600 }} />
            <div style={{ fontSize: 10.5, color: theme.textDim, marginTop: 5 }}>Leave blank to be asked each time it's due.</div>
          </div>
          {/* Category */}
          <div style={{ marginBottom: 12 }}>
            <label style={labelS}>CATEGORY</label>
            <select value={form.category} onChange={e => { set("category", e.target.value); set("shop", ""); }} style={{ ...inputStyle, fontSize: 13, cursor: "pointer" }}>
              <option value="">Select…</option>
              {categories.map(c => <option key={c.name} value={c.name}>{c.icon} {c.name}</option>)}
            </select>
          </div>
          {/* Shop */}
          <div style={{ marginBottom: 12 }}>
            <label style={labelS}>SHOP</label>
            {form.category ? (
              <>
                {categoryShops.length > 0 && (
                  <select value={categoryShops.some(s => s.name === form.shop) ? form.shop : ""} onChange={e => e.target.value && set("shop", e.target.value)} style={{ ...inputStyle, fontSize: 13, cursor: "pointer", marginBottom: 6 }}>
                    <option value="">Pick a shop…</option>
                    {categoryShops.map(s => <option key={s.id} value={s.name}>{s.is_favorite ? "⭐ " : ""}{s.name}</option>)}
                  </select>
                )}
                <input type="text" value={form.shop} onChange={e => set("shop", e.target.value)} placeholder="Or type a shop name" style={{ ...inputStyle, fontSize: 13 }} />
              </>
            ) : (
              <div style={{ fontSize: 11, color: theme.textDim }}>Choose a category first.</div>
            )}
          </div>
          {/* Frequency */}
          <div style={{ marginBottom: 12 }}>
            <label style={labelS}>FREQUENCY</label>
            <div style={{ display: "flex", gap: 6 }}>
              {FREQ_ORDER.map(f => (
                <button key={f} onClick={() => changeFreq(f)} style={segBtn(form.frequency === f)}>{FREQ_LABELS[f]}</button>
              ))}
            </div>
          </div>
          {/* Day value (conditional) */}
          {form.frequency === "weekly" && (
            <div style={{ marginBottom: 12 }}>
              <label style={labelS}>DAY OF WEEK</label>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {DOW_SHORT.map((d, i) => (
                  <button key={d} onClick={() => set("day_value", i)} style={{
                    padding: "6px 10px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 11,
                    background: form.day_value === i ? theme.primaryGlow : theme.inputBg,
                    color: form.day_value === i ? "#fff" : theme.textMuted,
                    outline: form.day_value === i ? `2px solid ${theme.primary}` : `1px solid ${theme.cardBorder}`,
                  }}>{d}</button>
                ))}
              </div>
            </div>
          )}
          {form.frequency === "monthly" && (
            <div style={{ marginBottom: 12 }}>
              <label style={labelS}>DAY OF MONTH (1–31)</label>
              <input type="number" inputMode="numeric" min="1" max="31" value={form.day_value ?? ""} onChange={e => set("day_value", e.target.value === "" ? "" : Number(e.target.value))} style={{ ...inputStyle, fontSize: 13 }} />
            </div>
          )}
          {/* Show after (optional time gate) */}
          <div style={{ marginBottom: 12 }}>
            <label style={labelS}>SHOW AFTER</label>
            <input type="time" value={form.show_after_time ?? ""} onChange={e => set("show_after_time", e.target.value)} style={{ ...inputStyle, fontSize: 13 }} />
            <div style={{ fontSize: 10.5, color: theme.textDim, marginTop: 5 }}>Optional — only surface this reminder after this local time. Leave blank to show anytime.</div>
          </div>
          {/* Expense type */}
          <div style={{ marginBottom: 12 }}>
            <label style={labelS}>TYPE</label>
            <div style={{ display: "flex", gap: 6 }}>
              {Object.entries(EXPENSE_TYPES).map(([key, cfg]) => (
                <button key={key} onClick={() => set("expense_type", key)} style={segBtn(form.expense_type === key, cfg.color)}>{cfg.icon} {cfg.label}</button>
              ))}
            </div>
          </div>
          {/* Tags */}
          <div style={{ marginBottom: 12 }}>
            <label style={labelS}>TAGS</label>
            <TagSelector selectedTags={form.tags} onChange={t => set("tags", t)} />
          </div>
          {/* Active */}
          <label style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12, fontSize: 12, color: theme.textMuted, cursor: "pointer" }}>
            <input type="checkbox" checked={form.is_active} onChange={e => set("is_active", e.target.checked)} />
            Active
          </label>
          {/* Notes */}
          <div style={{ marginBottom: 14 }}>
            <label style={labelS}>NOTES</label>
            <textarea value={form.notes} onChange={e => set("notes", e.target.value)} rows={2} placeholder="Optional" style={{ ...inputStyle, fontSize: 12, resize: "vertical", fontFamily: "inherit" }} />
          </div>

          <div style={{ display: "flex", gap: 6 }}>
            <button onClick={onCancel} style={{ flex: 1, padding: "10px", borderRadius: 8, border: `1px solid ${theme.cardBorder}`, background: "transparent", color: theme.textMuted, cursor: "pointer", fontSize: 12 }}>Cancel</button>
            <button onClick={() => onSave(form)} disabled={!valid || saving} style={{
              flex: 2, padding: "10px", borderRadius: 8, border: "none", fontWeight: 600, fontSize: 12, color: "#fff",
              cursor: (!valid || saving) ? "not-allowed" : "pointer",
              background: (!valid || saving) ? theme.textDim : `linear-gradient(135deg,${theme.primary},${theme.accent})`,
              opacity: (!valid || saving) ? 0.5 : 1,
            }}>{saving ? "Saving…" : "Save"}</button>
          </div>
          {onDelete && (
            <button onClick={onDelete} style={{ width: "100%", marginTop: 10, padding: "9px", borderRadius: 8, border: `1px solid ${theme.danger}40`, background: "transparent", color: theme.danger, cursor: "pointer", fontSize: 12, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6 }}><Icon name="trash" size={14}/>Delete this recurring entry</button>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════
    //  RECURRING VIEW (templates — CRUD only)
    // ═══════════════════════════════════════════
    function RecurringView() {
      const { theme, supabase, getCatIcon, getCatColor, currency } = useTheme();
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [toast, setToast] = useState(null);
      const [showAdd, setShowAdd] = useState(false);
      const [editing, setEditing] = useState(null);
      const [deleting, setDeleting] = useState(null);
      const [saving, setSaving] = useState(false);
      const [newId, setNewId] = useState(null);
      const [removingId, setRemovingId] = useState(null);
      const dragItemRef = useRef(null);
      const [dragId, setDragId] = useState(null);
      const [overId, setOverId] = useState(null);
      const [dragEnabledId, setDragEnabledId] = useState(null);

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2500); };

      const blankForm = { name: "", amount: "", category: "", shop: "", frequency: "monthly", day_value: 1, expense_type: "normal", tags: [], is_active: true, notes: "", show_after_time: "" };
      // Blank time → null ("surface anytime"); else normalize "HH:MM" → "HH:MM:SS"
      // to match the Postgres TIME round-trip (Supabase returns "09:00:00").
      const normTime = (t) => {
        const s = String(t ?? "").trim();
        return s === "" ? null : (s.length === 5 ? s + ":00" : s);
      };
      const buildRecord = (form) => ({
        name: form.name.trim(),
        category: form.category,
        shop: form.shop.trim(),
        // Blank amount → null ("ask at due time"); otherwise a fixed integer.
        amount: String(form.amount ?? "").trim() === "" ? null : parseInt(form.amount, 10),
        expense_type: form.expense_type,
        tags: (form.tags || []).join(","),
        frequency: form.frequency,
        day_value: (form.frequency === "weekly" || form.frequency === "monthly") ? Number(form.day_value) : null,
        notes: (form.notes || "").trim(),
        is_active: form.is_active,
        // Optional time gate: blank → null (no gate), else "HH:MM:SS".
        show_after_time: normTime(form.show_after_time),
      });

      const fetchList = useCallback(async () => {
        const { data, error } = await supabase.from("cost_management_recurring")
          .select("*").order("frequency").order("sort_order");
        if (!error && data) setItems(data.filter((r) => regionOf(r) === CUR.code));
        setLoading(false);
      }, []);
      useEffect(() => { fetchList(); }, [fetchList, currency]);

      const grouped = useMemo(() => {
        const g = { daily: [], weekdays: [], weekly: [], monthly: [] };
        items.forEach(r => { if (g[r.frequency]) g[r.frequency].push(r); });
        FREQ_ORDER.forEach(f => g[f].sort((a, b) => a.sort_order - b.sort_order));
        return g;
      }, [items]);

      const handleToggle = async (item) => {
        vibrate(10);
        setItems(prev => prev.map(i => i.id === item.id ? { ...i, is_active: !i.is_active } : i));
        const { error } = await supabase.from("cost_management_recurring")
          .update({ is_active: !item.is_active }).eq("id", item.id);
        if (error) { showToast("Update failed"); fetchList(); }
      };

      const handleAdd = async (form) => {
        setSaving(true);
        const maxSort = grouped[form.frequency].reduce((m, i) => Math.max(m, i.sort_order ?? 0), -1);
        const rec = { ...buildRecord(form), sort_order: maxSort + 1, region: CUR.code };
        const { data, error } = await supabase.from("cost_management_recurring").insert(rec).select().single();
        setSaving(false);
        if (error) { showToast(error.message); return; }
        setShowAdd(false);
        setNewId(data?.id ?? null);
        showToast("Recurring entry added");
        vibrate(10);
        await fetchList();
        setTimeout(() => setNewId(null), 1000);
      };

      const openEdit = (item) => setEditing({
        id: item.id, name: item.name, amount: item.amount ?? "", category: item.category, shop: item.shop,
        frequency: item.frequency, day_value: item.day_value, expense_type: item.expense_type || "normal",
        tags: (item.tags || "").split(",").filter(Boolean), is_active: item.is_active, notes: item.notes || "",
        show_after_time: item.show_after_time ?? "",
        _origFreq: item.frequency,
      });

      const handleEdit = async (form) => {
        setSaving(true);
        const rec = buildRecord(form);
        // If the frequency group changed, re-append at the end of the new group.
        if (form.frequency !== form._origFreq) {
          const maxSort = grouped[form.frequency].reduce((m, i) => Math.max(m, i.sort_order ?? 0), -1);
          rec.sort_order = maxSort + 1;
        }
        const { error } = await supabase.from("cost_management_recurring").update(rec).eq("id", form.id);
        setSaving(false);
        if (error) { showToast(error.message); return; }
        setEditing(null);
        showToast("Updated");
        vibrate(10);
        await fetchList();
      };

      const handleDelete = async () => {
        const id = deleting.id;
        setDeleting(null);
        setRemovingId(id);
        vibrate(10);
        setTimeout(async () => {
          const { error } = await supabase.from("cost_management_recurring").delete().eq("id", id);
          if (error) { showToast(error.message); setRemovingId(null); return; }
          setItems(prev => prev.filter(i => i.id !== id));
          setRemovingId(null);
          showToast("Deleted");
        }, 300);
      };

      // ── Drag-to-reorder (within a frequency group) ──
      const clearDrag = () => { dragItemRef.current = null; setDragId(null); setOverId(null); setDragEnabledId(null); };
      const persistOrder = (rows) => Promise.all(rows.map(it =>
        supabase.from("cost_management_recurring").update({ sort_order: it.sort_order }).eq("id", it.id)
      ));
      const onRowDrop = (target) => {
        const dragged = dragItemRef.current;
        if (!dragged || dragged.id === target.id || dragged.frequency !== target.frequency) { clearDrag(); return; }
        const freq = dragged.frequency;
        const group = grouped[freq];
        const fromIdx = group.findIndex(i => i.id === dragged.id);
        const toIdx = group.findIndex(i => i.id === target.id);
        if (fromIdx < 0 || toIdx < 0) { clearDrag(); return; }
        const reordered = [...group];
        const [moved] = reordered.splice(fromIdx, 1);
        reordered.splice(toIdx, 0, moved);
        const renumbered = reordered.map((it, idx) => ({ ...it, sort_order: idx }));
        setItems(prev => [...prev.filter(i => i.frequency !== freq), ...renumbered]);
        vibrate(10);
        persistOrder(renumbered).catch(() => { showToast("Reorder failed"); fetchList(); });
        clearDrag();
      };

      const togglePill = (on) => ({
        padding: "4px 10px", borderRadius: 14, border: "none", cursor: "pointer", fontSize: 10, fontWeight: 600,
        background: on ? `${theme.success}25` : theme.inputBg,
        color: on ? theme.success : theme.textDim,
        outline: on ? `1px solid ${theme.success}` : `1px solid ${theme.cardBorder}`,
      });

      const RecurringRow = ({ item }) => (
        <div
          draggable={dragEnabledId === item.id}
          onDragStart={(e) => { dragItemRef.current = item; setDragId(item.id); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", String(item.id)); } catch (err) {} }}
          onDragOver={(e) => { if (dragItemRef.current && dragItemRef.current.frequency === item.frequency) { e.preventDefault(); setOverId(item.id); } }}
          onDragLeave={() => setOverId(o => (o === item.id ? null : o))}
          onDrop={(e) => { e.preventDefault(); onRowDrop(item); }}
          onDragEnd={clearDrag}
          className={[dragId === item.id ? "cm-dragging" : "", newId === item.id ? "cm-slide-in" : "", removingId === item.id ? "cm-fade-out" : ""].filter(Boolean).join(" ")}
          style={{
            display: "flex", alignItems: "center", gap: 10, padding: "12px 14px",
            background: theme.inputBg, borderRadius: 10, marginBottom: 8,
            opacity: item.is_active ? 1 : 0.5,
            borderTop: overId === item.id ? `2px solid ${theme.primary}` : "2px solid transparent",
            transition: "box-shadow 0.15s ease, transform 0.15s ease",
          }}>
          <div onClick={() => openEdit(item)} style={{ display: "flex", alignItems: "center", gap: 10, flex: 1, minWidth: 0, cursor: "pointer" }}>
            <span style={{ fontSize: 20 }}>{getCatIcon(item.category)}</span>
            <div style={{ minWidth: 0 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                {EXPENSE_TYPES[item.expense_type]?.icon && <span style={{ fontSize: 11 }}>{EXPENSE_TYPES[item.expense_type].icon}</span>}
                <span style={{ fontSize: 14, fontWeight: 600, color: "#fff", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.name}</span>
              </div>
              <div style={{ fontSize: 11, color: theme.textDim, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                {item.shop} · {freqSummary(item)}
              </div>
            </div>
          </div>
          <span onClick={() => openEdit(item)} style={{ fontSize: 14, fontWeight: 700, color: "#fff", whiteSpace: "nowrap", cursor: "pointer" }}>{fmt(item.amount)}</span>
          <button onClick={(e) => { e.stopPropagation(); handleToggle(item); }} style={togglePill(item.is_active)}>{item.is_active ? "On" : "Off"}</button>
          <span
            onMouseDown={() => setDragEnabledId(item.id)}
            onMouseUp={() => setDragEnabledId(d => (d === item.id ? null : d))}
            onTouchStart={() => setDragEnabledId(item.id)}
            title="Drag to reorder"
            style={{ cursor: "grab", color: theme.textDim, fontSize: 16, padding: "0 2px", userSelect: "none", touchAction: "none" }}
          ><Icon name="grip" size={16}/></span>
        </div>
      );

      return (
        <div style={{ maxWidth: 680, margin: "0 auto", paddingBottom: 80 }}>
          {toast && (
            <div className="cm-toast" style={{ position: "fixed", top: 16, right: 16, zIndex: 999, padding: "10px 16px", borderRadius: 10, fontSize: 13, fontWeight: 500, background: theme.primary, color: "#fff", boxShadow: "0 4px 16px rgba(0,0,0,0.3)" }}>
              {toast}
            </div>
          )}

          <div style={{ marginTop: 8, marginBottom: 12 }}>
            <h3 style={{ fontSize: 15, fontWeight: 700, color: "#fff", margin: 0, display: "flex", alignItems: "center", gap: 8 }}><Icon name="repeat" size={16}/>Recurring</h3>
            <p style={{ fontSize: 11, color: theme.textDim, margin: "4px 0 0" }}>Templates for expenses you log regularly.</p>
          </div>

          {loading ? (
            <div style={{ textAlign: "center", padding: 40, color: theme.textMuted }}>Loading…</div>
          ) : (
            FREQ_ORDER.map(freq => (
              <div key={freq} style={{ marginBottom: 18 }}>
                <div style={{ fontSize: 11, fontWeight: 600, color: theme.textMuted, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 8 }}>
                  {FREQ_LABELS[freq]} <span style={{ color: theme.textDim }}>({grouped[freq].length})</span>
                </div>
                {grouped[freq].length === 0 ? (
                  <div style={{ fontSize: 12, color: theme.textDim, fontStyle: "italic", padding: "10px 14px", background: theme.cardBg, border: `1px dashed ${theme.cardBorder}`, borderRadius: 10 }}>
                    No {FREQ_LABELS[freq].toLowerCase()} recurring entries yet
                  </div>
                ) : (
                  grouped[freq].map(item => <RecurringRow key={item.id} item={item} />)
                )}
              </div>
            ))
          )}

          {/* Floating add button */}
          <button onClick={() => { vibrate(10); setShowAdd(true); }} title="Add recurring entry" style={{
            position: "fixed", right: 20, bottom: (typeof window !== "undefined" && window.innerWidth <= 720) ? 92 : 20, zIndex: 80, width: 54, height: 54, borderRadius: "50%",
            border: "none", cursor: "pointer", color: "#fff", lineHeight: 1, display: "flex", alignItems: "center", justifyContent: "center",
            background: `linear-gradient(135deg,${theme.primary},${theme.accent})`,
            boxShadow: `0 6px 20px ${theme.primaryGlow}`,
          }}><Icon name="add" size={26} sw={2.2}/></button>

          {/* Add modal */}
          {showAdd && (
            <Modal onClose={() => setShowAdd(false)}>
              <h4 style={{ color: "#fff", fontSize: 14, margin: "0 0 12px 0" }}>🔁 New Recurring Entry</h4>
              <RecurringForm initial={blankForm} saving={saving} onSave={handleAdd} onCancel={() => setShowAdd(false)} />
            </Modal>
          )}

          {/* Edit modal */}
          {editing && (
            <Modal onClose={() => setEditing(null)}>
              <h4 style={{ color: "#fff", fontSize: 14, margin: "0 0 12px 0", display: "flex", alignItems: "center", gap: 7 }}><Icon name="pencil" size={15}/>Edit Recurring Entry</h4>
              <RecurringForm
                initial={editing}
                saving={saving}
                onSave={handleEdit}
                onCancel={() => setEditing(null)}
                onDelete={() => setDeleting(editing)}
              />
            </Modal>
          )}

          {/* Delete confirm */}
          {deleting && (
            <Modal onClose={() => setDeleting(null)}>
              <h4 style={{ color: theme.danger, fontSize: 14, margin: "0 0 8px 0" }}>Delete this recurring entry?</h4>
              <div style={{ background: theme.inputBg, borderRadius: 6, padding: 10, marginBottom: 10, display: "flex", justifyContent: "space-between" }}>
                <span style={{ color: theme.text, fontSize: 12 }}>{getCatIcon(deleting.category)} {deleting.name}</span>
                <span style={{ color: "#fff", fontWeight: 600, fontSize: 12 }}>{fmt(deleting.amount)}</span>
              </div>
              <div style={{ display: "flex", gap: 6 }}>
                <button onClick={() => setDeleting(null)} style={{ flex: 1, padding: "8px", borderRadius: 6, border: `1px solid ${theme.cardBorder}`, background: "transparent", color: theme.textMuted, cursor: "pointer", fontSize: 11 }}>Cancel</button>
                <button onClick={handleDelete} style={{ flex: 1, padding: "8px", borderRadius: 6, border: "none", background: theme.danger, color: "#fff", cursor: "pointer", fontWeight: 600, fontSize: 11 }}>Delete</button>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════
    //  RECURRING DUE MODAL (app-launch suggestions)
    // ═══════════════════════════════════════════
    function RecurringDueModal({ items, onAdd, onSkip, onSnooze, onResolve, onClose }) {
      const { theme, getCatIcon, getCatColor, inputStyle } = useTheme();
      const [busyId, setBusyId] = useState(null);
      const [fadingId, setFadingId] = useState(null);
      // per-row inline amount entry for variable (null-amount) rules, keyed by rec.id
      const [amtInputs, setAmtInputs] = useState({});
      const setAmt = (id, v) => setAmtInputs((p) => ({ ...p, [id]: v }));
      const today = new Date();

      const finish = (id) => { setBusyId(null); onResolve(id); };
      // fade the row out (.cm-fade-out) before it leaves the list
      const fadeThenFinish = (id) => { setFadingId(id); setTimeout(() => { setFadingId(null); finish(id); }, 300); };
      const doAdd = async (rec, due, amountOverride) => {
        if (busyId) return; setBusyId(rec.id);
        const res = await onAdd(rec, due, amountOverride);
        if (!res || !res.ok) { setBusyId(null); return; }
        fadeThenFinish(rec.id);
      };
      const doSkip = async (rec, due) => {
        if (busyId) return; setBusyId(rec.id);
        const res = await onSkip(rec, due);
        if (!res || !res.ok) { setBusyId(null); return; }
        fadeThenFinish(rec.id);
      };
      const doSnooze = (rec) => { if (busyId) return; onSnooze(rec); finish(rec.id); };

      const closeBtn = { border: "none", background: theme.inputBg, color: theme.textMuted, width: 30, height: 30, borderRadius: 15, fontSize: 17, cursor: "pointer", boxShadow: `inset 0 0 0 1px ${theme.cardBorder}`, flexShrink: 0 };
      const addBtn = { flex: 1, padding: "8px 6px", borderRadius: 9, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 700, color: "#fff", fontFamily: "inherit", background: `linear-gradient(135deg,${theme.primary},${theme.accent})` };
      const skipBtn = { flex: 1, padding: "8px 6px", borderRadius: 9, cursor: "pointer", fontSize: 12, fontWeight: 600, color: theme.textMuted, background: "transparent", border: `1px solid ${theme.cardBorder}`, fontFamily: "inherit" };
      const snoozeBtn = { flex: 1, padding: "8px 6px", borderRadius: 9, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 600, color: theme.textDim, background: "transparent", fontFamily: "inherit" };

      return (
        <Modal sheet onClose={onClose}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
            <div>
              <div style={{ fontSize: 15, fontWeight: 700, color: "#fff", display: "flex", alignItems: "center", gap: 8 }}><Icon name="repeat" size={16}/>Recurring payments due</div>
              <div style={{ fontSize: 11.5, color: theme.textMuted, marginTop: 3 }}>{items.length} entries waiting</div>
            </div>
            <button onClick={onClose} style={closeBtn}>×</button>
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {items.map((rec) => {
              const due = computeDueDate(rec, today);
              const busy = busyId === rec.id;
              const fading = fadingId === rec.id;
              const col = getCatColor(rec.category);
              // Variable-amount rule: prompt inline. Confirm stays blocked until a
              // valid integer > 0 is entered (expenses.amount is NOT NULL).
              const needsAmount = rec.amount == null;
              const rawAmt = amtInputs[rec.id];
              const amtNum = parseInt(rawAmt, 10);
              const amtValid = rawAmt != null && String(rawAmt).trim() !== "" && Number.isInteger(amtNum) && amtNum > 0;
              return (
                <div key={rec.id} className={fading ? "cm-fade-out" : undefined} style={{ borderRadius: 12, background: theme.inputBg, boxShadow: `inset 0 0 0 1px ${theme.cardBorder}`, padding: "11px 12px", opacity: busy && !fading ? 0.6 : 1 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 9 }}>
                    <span style={{ width: 30, height: 30, borderRadius: 9, background: `${col}22`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0 }}>{getCatIcon(rec.category)}</span>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                        {EXPENSE_TYPES[rec.expense_type]?.icon && <span style={{ fontSize: 11 }}>{EXPENSE_TYPES[rec.expense_type].icon}</span>}
                        <span style={{ fontSize: 13.5, fontWeight: 600, color: "#fff", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{rec.name}</span>
                      </div>
                      <div style={{ fontSize: 10.5, color: theme.textDim, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{freqSummary(rec)} · {due ? dueDateLabel(due) : "—"}</div>
                    </div>
                    <span style={{ fontSize: 14, fontWeight: 700, color: "#fff", whiteSpace: "nowrap" }}>{needsAmount ? "—" : fmt(rec.amount)}</span>
                  </div>
                  {needsAmount && (
                    <input
                      type="number" inputMode="numeric" autoFocus
                      value={rawAmt ?? ""}
                      onChange={(e) => setAmt(rec.id, e.target.value)}
                      placeholder={CUR.symbol + " Enter amount"}
                      disabled={busy}
                      style={{ ...inputStyle, fontSize: 14, fontWeight: 600, marginBottom: 6 }}
                    />
                  )}
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={() => doAdd(rec, due, needsAmount ? amtNum : undefined)} disabled={busy || (needsAmount && !amtValid)} style={{ ...addBtn, opacity: (needsAmount && !amtValid) ? 0.5 : 1, cursor: (needsAmount && !amtValid) ? "not-allowed" : "pointer" }}>Add</button>
                    <button onClick={() => doSkip(rec, due)} disabled={busy} style={skipBtn}>Skip</button>
                    <button onClick={() => doSnooze(rec)} disabled={busy} style={snoozeBtn}>Snooze</button>
                  </div>
                </div>
              );
            })}
          </div>

          <button onClick={onClose} style={{ width: "100%", marginTop: 14, padding: "11px", borderRadius: 11, border: `1px solid ${theme.cardBorder}`, background: theme.inputBg, color: theme.textMuted, fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>
            Close / Later
          </button>
        </Modal>
      );
    }

    // ═══════════════════════════════════════════
    //  LOCATION DUE MODAL  (geofence triggers — piled up, entered one by one)
    // ═══════════════════════════════════════════
    function LocationDueModal({ items, onAdd, onSkip, onSnooze, onResolve, onClose }) {

      const finish = (id) => { setBusyId(null); onResolve(id); };
      const fadeThenFinish = (id) => { setFadingId(id); setTimeout(() => { setFadingId(null); finish(id); }, 300); };
      const doAdd = async (t, amountOverride) => {

        const res = await onAdd(t, amountOverride);

        fadeThenFinish(t.id);
