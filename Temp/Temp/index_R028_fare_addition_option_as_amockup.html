    const pad2 = (n) => String(n).padStart(2, "0");

    // ── Outstanding reconciler: enumerate a rule's PAST-due occurrences (date < today) ──
    function enumerateDue(rule, today, capDays) {
      const out = [];
      const todayY = ymdLocal(today);
      const startD = new Date(today); startD.setDate(startD.getDate() - capDays);
      const lower = (rule.last_added_date && rule.last_added_date > ymdLocal(startD)) ? rule.last_added_date : ymdLocal(startD);
      if (rule.frequency === "monthly") {
        for (let k = 0; k <= 3; k++) {
          const d = new Date(today.getFullYear(), today.getMonth() - k, 1);
          const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
          const day = Math.min(rule.day_value || 1, dim);
          const ymd = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(day)}`;
          if (ymd < todayY && ymd > lower) out.push(ymd);
        }
      } else {
        const d = new Date(startD);
        for (let i = 0; i < capDays + 1; i++) {
          d.setDate(d.getDate() + 1);
          const ymd = ymdLocal(d);
          if (ymd >= todayY) break;
          if (ymd <= lower) continue;
          const dow = d.getDay();
          if (rule.frequency === "daily") out.push(ymd);
          else if (rule.frequency === "weekdays") { if (dow >= 1 && dow <= 5) out.push(ymd); }
          else if (rule.frequency === "weekly") { if (dow === (rule.day_value ?? 0)) out.push(ymd); }
        }
      }
      return out;
    }
    function periodMatch(freq, expDate, dueYmd) {
      return freq === "monthly" ? expDate.slice(0, 7) === dueYmd.slice(0, 7) : expDate === dueYmd;
    }
    const freqSummary = (r) => {

      if (r.frequency === "weekly") return `Weekly · ${DOW_SHORT[r.day_value] ?? "?"}`;

    };
    const favSort = (a, b) => (a.is_favorite === b.is_favorite ? a.name.localeCompare(b.name) : a.is_favorite ? -1 : 1);

    // ── Recurring due-date logic (timezone-safe: local date components only) ──
    // `today` is a Date (pass `new Date()` — local). Returns 'YYYY-MM-DD' or null.
    function computeDueDate(rec, today) {
      const y = today.getFullYear(), m = today.getMonth(), dom = today.getDate(), dow = today.getDay();
      const pad = n => String(n).padStart(2, '0');
      const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      switch (rec.frequency) {
        case 'daily':    return ymd(today);
        case 'weekdays': return (dow >= 1 && dow <= 5) ? ymd(today) : null;
        case 'weekly':   return ymd(new Date(y, m, dom - ((dow - rec.day_value + 7) % 7)));
        case 'monthly': {
          const daysInMonth = new Date(y, m + 1, 0).getDate();
          const clampedDay = Math.min(rec.day_value, daysInMonth);
          return dom < clampedDay ? null : ymd(new Date(y, m, clampedDay));
        }
        default: return null;

    function isRecurringDue(rec, today, sessionSnoozed) {
      if (!rec.is_active) return false;
      if (sessionSnoozed.includes(rec.id)) return false;
      const due = computeDueDate(rec, today);
      if (due === null) return false;
      // Time gate: a rule with show_after_time only *surfaces now* once the LOCAL
      // clock has passed that time-of-day. Null = no gate (surface anytime). This
      // gates surfacing only — it does not change the computed due date above.
      // Compare seconds-since-midnight from local components (never a UTC path).
      if (rec.show_after_time != null) {
        const nowSecs = today.getHours() * 3600 + today.getMinutes() * 60 + today.getSeconds();
        const [gh, gm, gs] = String(rec.show_after_time).split(":").map(Number);
        const gateSecs = (gh || 0) * 3600 + (gm || 0) * 60 + (gs || 0);
        if (nowSecs < gateSecs) return false;
      }
      return rec.last_added_date == null || rec.last_added_date < due; // YYYY-MM-DD compares chronologically
    }

    // ═════════════════════════════════════════════════════════════
    //  LOCATION-BASED PAYMENT TRIGGERS  (geofence + time-of-day window)
    //  Stored in cost_management_triggers (DB) with localStorage as cache.
    //  A trigger fires when you are within
    //  `radius` metres of (lat,lng) AND the local clock is inside its
    //  [startTime,endTime] window — then it surfaces in a pile-up panel.
    // ═════════════════════════════════════════════════════════════
    // ── PURCHASE REQUESTS INBOX ── any companion app (Sukkiri, etc.) can send

    const REQUESTS_KEY = "cost_management_purchase_requests";
    const LEGACY_REQUEST_KEYS = ["sukkiri_cost_requests"]; // older per-app keys, absorbed on read

        try {

            v.forEach((r) => { if (r && r.id && !list.some((x) => x.id === r.id)) list.push(r); });
            localStorage.removeItem(k);

        } catch (e) {}
      });

    }

    }
    function mergePurchaseRequests(incoming) {
      const arr = Array.isArray(incoming) ? incoming : [incoming];
      const valid = arr.filter((r) => r && r.type === "purchase_request" && r.id && Array.isArray(r.items));
      if (!valid.length) return { list: getPurchaseRequests(), added: 0 };
      const list = getPurchaseRequests();
      let added = 0;
      valid.forEach((r) => { if (!list.some((x) => x.id === r.id)) { list.push({ source: "unknown", ...r }); added++; } });
      setPurchaseRequests(list);
      return { list, added };
    }

    // ═════════════════════════════════════════════════════════════
    //  WEEKLY FOCUS TASKS — tasks authored in the Weekly Focus app arrive
    //  here (shared localStorage key, or pasted JSON) and render on the
    //  Calendar, which doubles as the printable weekly sheet. The reader is
    //  deliberately tolerant: arrays, {tasks:[…]}, {days:{mon:[…]}}, bare
    //  strings and most common field spellings all normalise to one shape.
    // ═════════════════════════════════════════════════════════════
    const FOCUS_TASKS_KEY = "weekly_focus_tasks";
    const LEGACY_TASK_KEYS = ["weeklyFocusTasks", "weekly_focus_app_tasks", "focus_tasks", "weeklyfocus_tasks"];
    const DAY_ALIAS = { mon:1, monday:1, tue:2, tues:2, tuesday:2, wed:3, weds:3, wednesday:3, thu:4, thur:4, thurs:4, thursday:4, fri:5, friday:5, sat:6, saturday:6, sun:7, sunday:7 };
    const mondayOfDate = (d) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const j = x.getDay(); x.setDate(x.getDate() - (j === 0 ? 6 : j - 1)); return x; };
    const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
    const dateOfIso = (iso) => new Date(iso + "T00:00:00");
    function normTaskDate(v, weekStart) {
      if (v == null || v === "") return null;
      if (v instanceof Date) return isNaN(v) ? null : ymdLocal(v);
      const str = String(v).trim();
      if (!str) return null;
      const iso = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (iso) return iso[1] + "-" + iso[2] + "-" + iso[3];
      const slash = str.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
      if (slash) return slash[1] + "-" + pad2(+slash[2]) + "-" + pad2(+slash[3]);
      const alias = DAY_ALIAS[str.toLowerCase()];
      if (alias) return ymdLocal(addDays(weekStart || mondayOfDate(new Date()), alias - 1));
      const d = new Date(str);
      return isNaN(d) ? null : ymdLocal(d);
    }
    const pickField = (o, keys) => { for (const k of keys) { const v = o[k]; if (v != null && v !== "") return v; } return ""; };
    function normalizeTask(raw, i, weekStart, fallbackDate) {
      const t = typeof raw === "string" ? { title: raw } : (raw && typeof raw === "object" && !Array.isArray(raw) ? raw : null);
      if (!t) return null;
      const title = String(pickField(t, ["title", "name", "text", "task", "label", "todo", "summary"])).trim();
      if (!title) return null;
      const date = normTaskDate(pickField(t, ["date", "due", "dueDate", "due_date", "day", "scheduled_for", "scheduledFor", "on"]), weekStart) || fallbackDate || null;
      const doneRaw = t.done ?? t.completed ?? t.isDone ?? t.is_done ?? t.checked ?? t.complete;
      const timeRaw = String(pickField(t, ["time", "start", "start_time", "slot", "when"]) || "").trim();
      const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 32);
      return {
        id: String(t.id || t.uid || t.key || ("wf-" + (date || "any") + "-" + slug + "-" + i)),
        title, date,
        done: !!doneRaw,
        time: timeRaw.length <= 12 ? timeRaw : "",
        category: String(pickField(t, ["category", "area", "focus", "project", "bucket", "tag", "list"]) || "").trim(),
        priority: String(pickField(t, ["priority", "prio", "importance"]) || "").trim(),
        notes: String(pickField(t, ["notes", "note", "detail", "details", "description"]) || "").trim(),
        source: String(t.source || "weekly-focus"),
      };
    }
    function flattenFocusInput(input) {
      const out = [];
      const weekStartOf = (o, fallback) => {
        const w = o && (o.week || o.week_start || o.weekStart || o.weekOf);
        const d = w ? normTaskDate(w, null) : null;
        return d ? mondayOfDate(dateOfIso(d)) : fallback;
      };
      const walk = (node, weekStart, fallbackDate) => {
        if (!node) return;
        if (Array.isArray(node)) {
          node.forEach((n) => {
            const nested = n && typeof n === "object" && (n.tasks || n.items || n.todos || n.days);
            if (nested) walk(n, weekStart, fallbackDate);
            else { const t = normalizeTask(n, out.length, weekStart, fallbackDate); if (t) out.push(t); }
          });
          return;
        }
        if (typeof node === "object") {
          const ws = weekStartOf(node, weekStart);
          const list = node.tasks || node.items || node.todos || node.entries;
          const days = node.days || node.byDay || node.schedule;
          if (list) walk(list, ws, fallbackDate);
          if (days && typeof days === "object" && !Array.isArray(days)) {
            Object.keys(days).forEach((k) => walk(days[k], ws, normTaskDate(k, ws) || fallbackDate));
          }
          if (!list && !days) { const t = normalizeTask(node, out.length, ws, fallbackDate); if (t) out.push(t); }
        }
      };
      walk(input, mondayOfDate(new Date()), null);
      return out;
    }
    function setFocusTasks(list) { try { localStorage.setItem(FOCUS_TASKS_KEY, JSON.stringify(list)); } catch (e) {} }
    function getFocusTasks() {
      let list = [];
      try { list = flattenFocusInput(JSON.parse(localStorage.getItem(FOCUS_TASKS_KEY))); } catch (e) { list = []; }
      let absorbed = false;
      LEGACY_TASK_KEYS.forEach((k) => {
        try {
          const extra = flattenFocusInput(JSON.parse(localStorage.getItem(k)));
          extra.forEach((t) => { if (!list.some((x) => x.id === t.id)) { list.push(t); absorbed = true; } });
        } catch (e) {}
      });
      if (absorbed) setFocusTasks(list);
      return list;
    }
    function mergeFocusTasks(incoming) {
      const add = flattenFocusInput(incoming);
      const list = getFocusTasks();
      if (!add.length) return { list, added: 0 };
      let added = 0;
      add.forEach((t) => {
        const i = list.findIndex((x) => x.id === t.id);
        if (i < 0) { list.push(t); added++; } else { list[i] = { ...t, done: list[i].done || t.done }; }
      });
      setFocusTasks(list);
      return { list, added };
    }
    const groupTasksByDate = (list) => {
      const map = {};
      list.forEach((t) => { if (t.date) (map[t.date] = map[t.date] || []).push(t); });
      Object.keys(map).forEach((k) => map[k].sort((a, b) => (a.time || "zz").localeCompare(b.time || "zz")));
      return map;
    };

    const LOC_TRIGGER_KEY = "cost_management_location_triggers";
    function getStoredTriggers() {
      try { const v = JSON.parse(localStorage.getItem(LOC_TRIGGER_KEY)); return Array.isArray(v) ? v : []; }
      catch (e) { return []; }
    }
    function setStoredTriggers(list) {
      try { localStorage.setItem(LOC_TRIGGER_KEY, JSON.stringify(list)); } catch (e) {}
    }
    // ── DB sync: cost_management_triggers is the source of truth; localStorage
    //    stays as the synchronous cache the geofence checks read from. ──
    const trigRow = (t) => ({ id: t.id, region: t.region || "JPY", is_active: t.is_active !== false, last_fired_date: t.last_fired_date || null, data: t, updated_at: new Date().toISOString() });
    async function pullTriggersFromDB(sb) {
      const { data, error } = await sb.from("cost_management_triggers").select("*");
      if (error) { console.warn("trigger pull failed", error.message); return null; }
      const list = (data || []).map((r) => ({ ...r.data, id: r.id, region: r.region, is_active: r.is_active, last_fired_date: r.last_fired_date }));
      setStoredTriggers(list);

    async function upsertTriggerDB(sb, t) {

    async function deleteTriggerDB(sb, id) {

      if (error) console.warn("trigger delete failed", error.message);
    }
    // metres between two {lat,lng} points (haversine)
    function distanceMeters(a, b) {
      if (!a || !b || a.lat == null || b.lat == null) return Infinity;
      const R = 6371000, toRad = (d) => (d * Math.PI) / 180;
      const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
      const s = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));

    // is the local clock within [start,end] "HH:MM"? (supports overnight wrap)
    function inTimeWindow(now, start, end) {
      if (!start || !end) return true;
      const mins = now.getHours() * 60 + now.getMinutes();
      const [sh, sm] = start.split(":").map(Number), [eh, em] = end.split(":").map(Number);
      const s = sh * 60 + sm, e = eh * 60 + em;
      return s <= e ? (mins >= s && mins <= e) : (mins >= s || mins <= e);
    }
    const ymdToday = () => { const d = new Date(), p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
    // A trigger is "due now" when active, in range, in its time window, not
    // dismissed this session, and not already logged/skipped today.
    function dayMatches(freq, monthDay, date) {
      const dow = date.getDay();
      switch (freq) {
        case "weekdays": return dow >= 1 && dow <= 5;
        case "weekend": return dow === 0 || dow === 6;
        case "monthly": return date.getDate() === Number(monthDay || 1);
        default: return true; // daily / unset
      }
    }
    function isLocationDue(t, pos, now, sessionDismissed, opts = {}) {
      if (!t.is_active) return false;
      if (sessionDismissed.includes(t.id)) return false;
      if (!opts.ignoreDay && t.last_fired_date === ymdToday()) return false;
      if (!opts.ignoreTime && !dayMatches(t.freq, t.monthDay, now)) return false;
      const hasTime = !!(t.startTime && t.endTime);
      const hasLoc = t.lat != null && t.lng != null;
      if (!hasTime && !hasLoc) return false;
      if (hasTime && !opts.ignoreTime && !inTimeWindow(now, t.startTime, t.endTime)) return false;
      if (hasLoc && !opts.ignoreDistance && distanceMeters(pos, { lat: t.lat, lng: t.lng }) > (t.radius || 150)) return false;
      return true;
    }

    const dueDateLabel = (ymd) => {

    // ── Graph filters (overview charts) ──
    const GRAPH_FILTER_KEY = "cost_management_graph_filters";
    const DEFAULT_GRAPH_FILTERS = { excludeOutliers: false, excludeFixed: false, categories: [], shops: [], tags: [], dateFrom: "", dateTo: "" };
    function getStoredGraphFilters() {

    function setStoredGraphFilters(f) { try { localStorage.setItem(GRAPH_FILTER_KEY, JSON.stringify(f)); } catch (e) {} }
    function applyGraphFilters(rows, f) {

    // ═══════════════════════════════════════════

        const order = (r) => FREQ_ORDER.indexOf(r.frequency);
        const due = recurring
          .filter((r) => regionOf(r) === currency && isRecurringDue(r, today, sessionSnoozed)) // snoozed ids excluded here
          .sort((a, b) => order(a) - order(b) || (a.sort_order ?? 0) - (b.sort_order ?? 0));
        console.log(`[recurring] due: ${due.length}`, due.map((r) => `${r.name} → ${computeDueDate(r, today)}`));
        if (dueShownRef.current) return; // modal opens at most once per session — never reopen
        if (due.length) { dueShownRef.current = true; setDueList(due); setDueModalOpen(true); }
      }, [loading, sessionSnoozed]); // eslint-disable-line react-hooks/exhaustive-deps

      // drop a resolved entry from the due list; the modal auto-closes once it empties
      const resolveDue = (id) => setDueList((prev) => prev.filter((r) => r.id !== id));
      useEffect(() => { if (dueModalOpen && dueList.length === 0) setDueModalOpen(false); }, [dueList, dueModalOpen]);

      // per-row handlers — DB wiring lands in later commits; scaffold no-ops for now
      // (c) Add: insert the expense at its due date, then stamp the recurring row's
      // last_added_date so it won't re-suggest this period; refetch to refresh views.
      const dueAdd = async (rec, due, amountOverride) => {
        if (!due) return { ok: false };
        // Variable-amount rules (rec.amount == null) supply the amount at due time via
        // the modal's inline input; fixed rules use the stored rec.amount.
        const amount = amountOverride != null ? amountOverride : rec.amount;
        const record = { region: regionOf(rec), date: due, category: rec.category, shop: rec.shop, amount: Number(amount), notes: rec.notes || "", expense_type: rec.expense_type || "normal", tags: rec.tags || "" };
        const { error: insErr } = await supabase.from("cost_management_expenses").insert(record);
        if (insErr) return { ok: false };
        const { error: updErr } = await supabase.from("cost_management_recurring").update({ last_added_date: due }).eq("id", rec.id);
        if (updErr) return { ok: false };
        await fetchData();
        flashDue(`Added ${rec.name}`);
        return { ok: true };
      };
      // (d) Skip: stamp last_added_date with the COMPUTED due date (not today) so it
      // won't re-suggest this period; no expense insert; refetch to refresh views.
      const dueSkip = async (rec, due) => {
        if (!due) return { ok: false };
        const { error: updErr } = await supabase.from("cost_management_recurring").update({ last_added_date: due }).eq("id", rec.id);
        if (updErr) return { ok: false };
        await fetchData();
        flashDue(`Skipped ${rec.name}`);
        return { ok: true };
      };
      // (e) Snooze: hide for this session only (no DB write). The row leaves the
      // visible list via onResolve; the id in sessionSnoozed keeps the due-set
      // effect from re-suggesting it until reload.
      const dueSnooze = (rec) => setSessionSnoozed((prev) => prev.includes(rec.id) ? prev : [...prev, rec.id]);
      // Close: dismiss + snooze whatever's still visible so it won't reopen this session.
      const dueClose = () => {
        setSessionSnoozed((prev) => [...new Set([...prev, ...dueList.map((r) => r.id)])]);
        setDueModalOpen(false);
      };

      // ── Location triggers: detect which fire for the current / simulated spot ──
      const resolveLoc = (id) => setLocDueList((prev) => prev.filter((t) => t.id !== id));
      const stampLocFired = (id) => {
        const next = getStoredTriggers().map((x) => x.id === id ? { ...x, last_fired_date: ymdToday() } : x);
        setStoredTriggers(next); setLocTriggers(next);
        const t = next.find((x) => x.id === id); if (t) upsertTriggerDB(supabase, t);
      };
      // simTriggerId: pretend you're standing at that trigger's pin (ignores GPS,
      // day-stamp and time window) so it can be demoed without moving / real GPS.
      const checkLocation = useCallback((opts = {}) => {
        const { simTriggerId = null, silent = false } = opts;
        const now = new Date();
        const fresh = getStoredTriggers(); setLocTriggers(fresh);
        const run = (pos, simMode) => {
          const matched = fresh
            .filter((t) => regionOf(t) === currency)
            .filter((t) => isLocationDue(t, pos, now, locDismissed, { ignoreDistance: simMode, ignoreDay: simMode, ignoreTime: simMode }))
            .map((t) => simMode ? { ...t, _simulated: true } : (t.lat != null ? { ...t, _distance: Math.round(distanceMeters(pos, { lat: t.lat, lng: t.lng })) } : { ...t, _timeOnly: true }));
          if (matched.length) { setLocStatus(""); setLocDueList(matched); setLocDueOpen(true); }
          else { const m = "No payment triggers here right now."; setLocStatus(m); if (!silent) flashDue(m); }
        };
        if (simTriggerId) { const t = fresh.find((x) => x.id === simTriggerId); run(t ? { lat: t.lat, lng: t.lng } : null, true); return; }
        if (!("geolocation" in navigator)) { const m = "Location isn't available here — use a trigger's Test button."; setLocStatus(m); if (!silent) flashDue(m); return; }
        setLocStatus("Locating…");
        navigator.geolocation.getCurrentPosition(
          (p) => run({ lat: p.coords.latitude, lng: p.coords.longitude }, false),
          (err) => { const m = err.code === 1 ? "Location permission denied — use a trigger's Test button." : "Couldn't get your location."; setLocStatus(m); if (!silent) flashDue(m); },
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
        );
      }, [locDismissed, currency]); // eslint-disable-line react-hooks/exhaustive-deps
      useEffect(() => { if (locDueOpen && locDueList.length === 0) setLocDueOpen(false); }, [locDueList, locDueOpen]);
      // Continuous location watch + dwell evaluator. A location rule fires only
      // after the configured dwell time INSIDE its radius (not just passing by);
      // a time rule fires when the clock enters its window. GPS is usually blocked
      // in embedded previews — use a trigger Test button to simulate there.
      const posRef = useRef(null);
      const dwellRef = useRef({});
      useEffect(() => {
        if (loading) return;
        let watchId = null;
        if ("geolocation" in navigator) {
          watchId = navigator.geolocation.watchPosition(
            (p) => { posRef.current = { lat: p.coords.latitude, lng: p.coords.longitude }; },
            () => {}, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 }
          );
        }
        const tick = () => {
          const now = new Date();
          const pos = posRef.current;
          const fire = [];
          getStoredTriggers().forEach((tg) => {
            if (regionOf(tg) !== currency || !tg.is_active || locDismissed.includes(tg.id) || tg.last_fired_date === ymdToday()) return;
            const hasTime = !!(tg.startTime && tg.endTime);
            const hasLoc = tg.lat != null && tg.lng != null;
            if (!hasTime && !hasLoc) return;
            const timeOk = !hasTime || inTimeWindow(now, tg.startTime, tg.endTime);
            const dayOk = dayMatches(tg.freq, tg.monthDay, now);
            let locOk = true, dist = null;
            if (hasLoc) {
              if (!pos) { dwellRef.current[tg.id] = null; locOk = false; }
              else {
                dist = distanceMeters(pos, { lat: tg.lat, lng: tg.lng });
                if (dist <= (tg.radius || 150)) {
                  if (dwellRef.current[tg.id] == null) dwellRef.current[tg.id] = Date.now();
                  locOk = (Date.now() - dwellRef.current[tg.id]) >= (Number(tg.dwellMinutes) || 0) * 60000;
                } else { dwellRef.current[tg.id] = null; locOk = false; }
              }
            }
            if (timeOk && locOk && dayOk) fire.push(hasLoc ? { ...tg, _distance: Math.round(dist) } : { ...tg, _timeOnly: true });
          });
          if (fire.length) {
            setLocDueList((prev) => { const ids = new Set(prev.map((x) => x.id)); return [...prev, ...fire.filter((f) => !ids.has(f.id))]; });
            setLocDueOpen(true);
          }
        };
        tick();
        const iv = setInterval(tick, 15000);
        return () => { if (watchId != null) navigator.geolocation.clearWatch(watchId); clearInterval(iv); };
      }, [loading, locDismissed, currency]); // eslint-disable-line react-hooks/exhaustive-deps

      const locAdd = async (t, amountOverride) => {
        const amount = amountOverride != null ? amountOverride : t.amount;
        if (amount == null || !(Number(amount) > 0)) return { ok: false };
        const record = { region: regionOf(t), date: ymdToday(), category: t.category, shop: t.shop, amount: Number(amount), notes: t.notes || "", expense_type: t.expense_type || "normal", tags: t.tags || "" };
        const { error } = await supabase.from("cost_management_expenses").insert(record);
        if (error) return { ok: false };
        stampLocFired(t.id); await fetchData(); flashDue(`Added ${t.name}`); return { ok: true };
      };
      const locSkip = (t) => { stampLocFired(t.id); flashDue(`Skipped ${t.name}`); return { ok: true }; };
      const locSnooze = (t) => setLocDismissed((prev) => prev.includes(t.id) ? prev : [...prev, t.id]);
      const locClose = () => { setLocDismissed((prev) => [...new Set([...prev, ...locDueList.map((t) => t.id)])]); setLocDueOpen(false); };

      const RAW = useMemo(() => data.filter((r) => regionOf(r) === currency), [data, currency]);
      const catList = useMemo(() => [...new Set(RAW.map(r => r.category))].sort(), [RAW]);
      const years = useMemo(() => [...new Set(RAW.map(r => String(r.year)))].sort(), [RAW]);

      const filtered = useMemo(() => RAW.filter(r => {
        if (yearFilter !== "All" && String(r.year) !== yearFilter) return false;
        if (catFilter !== "All" && r.category !== catFilter) return false;
        if (typeFilter !== "All" && r.expense_type !== typeFilter) return false;
        if (tagFilter !== "All" && !(r.tags || "").split(",").includes(tagFilter)) return false;
        return true;
      }), [RAW, yearFilter, catFilter, typeFilter, tagFilter]);

      const totalSpend = useMemo(() => filtered.reduce((s,r) => s+r.amount, 0), [filtered]);
      const monthlyData = useMemo(() => {
        const map = {};
        filtered.forEach(r => {
          const key = `${r.year}-${String(r.month).padStart(2,"0")}`;
          const label = `${MONTHS_SHORT[r.month]} ${String(r.year).slice(2)}`;
          if (!map[key]) map[key] = { key, label, total: 0 };
          map[key].total += r.amount;

        return Object.values(map).sort((a,b) => a.key.localeCompare(b.key));
      }, [filtered]);
      const monthlyAvg = monthlyData.length ? Math.round(totalSpend / monthlyData.length) : 0;
      const dailyAvg = filtered.length ? Math.round(totalSpend / new Set(filtered.map(r => r.date)).size) : 0;
      const catData = useMemo(() => {
        const map = {};
        filtered.forEach(r => { map[r.category] = (map[r.category]||0) + r.amount; });
        return Object.entries(map).map(([name,value]) => ({name,value})).sort((a,b) => b.value-a.value);
      }, [filtered]);
      const topShops = useMemo(() => {
        const map = {};
        filtered.forEach(r => { map[r.shop] = (map[r.shop]||0) + r.amount; });
        return Object.entries(map).map(([name,value]) => ({name,value})).sort((a,b) => b.value-a.value).slice(0,6);
      }, [filtered]);

      const txSource = useMemo(() => allRegions ? data.filter(r => {
        if (yearFilter !== "All" && String(r.year) !== yearFilter) return false;
        if (catFilter !== "All" && r.category !== catFilter) return false;
        if (typeFilter !== "All" && r.expense_type !== typeFilter) return false;
        if (tagFilter !== "All" && !(r.tags || "").split(",").includes(tagFilter)) return false;
        return true;
      }) : filtered, [data, filtered, allRegions, yearFilter, catFilter, typeFilter, tagFilter]);
      const sortedTx = useMemo(() => [...txSource].sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id), [txSource]);
      const txPerPage = 15;
      const txPages = Math.ceil(sortedTx.length / txPerPage);
      const pageTx = sortedTx.slice(txPage * txPerPage, (txPage+1) * txPerPage);
      const recentEntries = useMemo(() => [...RAW].sort((a,b) => b.id - a.id).slice(0, 5), [RAW]);

      const getCatIcon = (n) => categories.find(c => c.name === n)?.icon || "📦";
      const getCatColor = (n) => categories.find(c => c.name === n)?.color || "#8b5cf6";
      const getTagIcon = (n) => tags.find(t => t.name === n)?.icon || "🏷️";
      const getTagColor = (n) => tags.find(t => t.name === n)?.color || "#6b7280";

      const pillStyle = (active) => ({
        padding:"6px 14px",fontSize:12,borderRadius:16,border:"none",cursor:"pointer",fontWeight:500,
        background: active ? theme.primaryGlow : theme.cardBg,
        color: active ? "#fff" : theme.textMuted,
        border: active ? `1px solid ${theme.primary}` : `1px solid ${theme.cardBorder}`,
      });
      const inputStyle = {
        width:"100%",padding:"10px 14px",borderRadius:10,border:`1px solid ${theme.inputBorder}`,
        background:theme.inputBg,color:theme.text,fontSize:14,outline:"none",fontFamily:"inherit",
      };
      const labelStyle = { fontSize:11,fontWeight:500,color:theme.textMuted,textTransform:"uppercase",letterSpacing:0.5,marginBottom:6,display:"block" };

      const navTabs = [
        { id: "add", label: "Add", icon: "add" },
        { id: "overview", label: "Overview", icon: "chart" },
        { id: "transactions", label: "History", icon: "list" },
        { id: "smart", label: "Smart", icon: "zap" },
        { id: "settings", label: "Settings", icon: "settings" },
      ];
      // On phones the primary tabs move to a thumb-reachable bottom bar;
      // Settings + the region/currency switch stay in the top-right corner.
      const [isMobile, setIsMobile] = useState(() => (typeof window !== "undefined" ? window.matchMedia("(max-width: 720px)").matches : false));
      useEffect(() => {
        const mq = window.matchMedia("(max-width: 720px)");
        const on = (e) => setIsMobile(e.matches);
        mq.addEventListener ? mq.addEventListener("change", on) : mq.addListener(on);
        return () => { mq.removeEventListener ? mq.removeEventListener("change", on) : mq.removeListener(on); };
      }, []);
      const tabById = (id) => navTabs.find((t) => t.id === id);
      const bottomTabs = [tabById("add"), tabById("transactions"), tabById("overview"), tabById("smart")];

      return (
        <ThemeContext.Provider value={{ theme, themeName, inputStyle, labelStyle, pillStyle, supabase, fetchData, categories, tags, getCatIcon, getCatColor, getTagIcon, getTagColor, shops: regionShops, recurring: regionRecurring, currency, changeTheme, setView, presetDate, setPresetDate, locTriggers: regionTriggers, reloadTriggers, checkLocation, locStatus }}>
          <div style={{minHeight:"100vh",background:theme.bg,color:theme.text,fontFamily:"'Noto Sans JP', system-ui, sans-serif"}}>
            {/* Header */}
            <div style={{background:theme.headerBg,borderBottom:`1px solid ${theme.cardBorder}`,padding:"14px 16px"}}>
             <div style={{maxWidth:1080,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
              <h1 style={{fontSize:18,fontWeight:700,color:"#fff",margin:0}}>Cost Management</h1>
              <div style={{display:"flex",gap:4,flexWrap:"wrap",alignItems:"center"}}>
                {(isMobile ? navTabs.filter(t => t.id === "settings") : navTabs).map(tab => (
                  <button key={tab.id} onClick={() => { setView(tab.id); setTxPage(0); }} style={{...pillStyle(view===tab.id || (tab.id==="transactions" && view==="calendar")),padding:"5px 11px",fontSize:11,display:"inline-flex",alignItems:"center",gap:6}}><Icon name={tab.icon} size={15}/>{isMobile && tab.id==="settings" ? "" : tab.label}</button>
                ))}
                {!isMobile && regionPending.length>0 && (
                  <button onClick={() => setView("outstanding")} title="Outstanding payments" style={{...pillStyle(view==="outstanding"),padding:"5px 9px",fontSize:11,display:"inline-flex",alignItems:"center",gap:5}}><Icon name="inbox" size={15}/><span style={{background:theme.danger,color:"#fff",fontSize:9,fontWeight:700,borderRadius:9,padding:"1px 5px",lineHeight:1.6}}>{regionPending.length}</span></button>
                )}
                {!isMobile && <button onClick={() => { reloadSukkiri(); setView("sukkiri"); }} title="Purchase requests from companion apps" style={{...pillStyle(view==="sukkiri"),padding:"5px 11px",fontSize:11,display:"inline-flex",alignItems:"center",gap:6}}>🛒 Requests{sukkiriPending.length>0 && <span style={{background:theme.danger,color:"#fff",fontSize:9,fontWeight:700,borderRadius:9,padding:"1px 5px",lineHeight:1.6}}>{sukkiriPending.length}</span>}</button>}
                <div style={{position:"relative"}}>
                  <button onClick={() => setShowCurrencyPicker(!showCurrencyPicker)} title="Region & currency" style={{...pillStyle(false),padding:"6px 10px",display:"inline-flex",alignItems:"center",justifyContent:"center",color:theme.primary,fontSize:14,fontWeight:700,minWidth:32,lineHeight:1}}>{CUR.symbol}</button>
                  {showCurrencyPicker && (
                    <>
                      <div style={{position:"fixed",inset:0,zIndex:90}} onClick={() => setShowCurrencyPicker(false)}/>
                      <div style={{position:"absolute",top:"100%",right:0,marginTop:6,background:"#1a1a2e",border:`1px solid ${theme.cardBorder}`,borderRadius:10,padding:6,zIndex:100,minWidth:180}}>
                        <div style={{fontSize:9.5,letterSpacing:1,textTransform:"uppercase",color:"#888",padding:"4px 8px 3px",fontWeight:700}}>Region profile</div>

                            <span style={{color:currency===key?theme.primary:"#ccc",fontSize:11}}>{key} · {CURRENCIES[key].name}</span>
                          </button>

                      </div>

                </div>
              </div>
             </div>
            </div>

            {/* Filters */}
            {(view === "overview" || view === "transactions" || view === "calendar") && (
              <div style={{padding:"10px 16px",maxWidth:1080,margin:"0 auto",boxSizing:"border-box",display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                {(view === "transactions" || view === "calendar") && (
                  <div style={{display:"flex",gap:3,padding:3,background:theme.cardBg,borderRadius:10,border:`1px solid ${theme.cardBorder}`}}>
                    <button onClick={() => setView("transactions")} style={{padding:"3px 12px",fontSize:11,fontWeight:600,borderRadius:7,border:"none",cursor:"pointer",fontFamily:"inherit",background:view==="transactions"?theme.primaryGlow:"transparent",color:view==="transactions"?"#fff":theme.textMuted}}>List</button>
                    <button onClick={() => setView("calendar")} style={{padding:"3px 12px",fontSize:11,fontWeight:600,borderRadius:7,border:"none",cursor:"pointer",fontFamily:"inherit",background:view==="calendar"?theme.primaryGlow:"transparent",color:view==="calendar"?"#fff":theme.textMuted}}>Calendar</button>
                  </div>
                )}
                {view !== "calendar" && <button onClick={() => setFiltersOpen((o) => !o)} style={{...pillStyle(filtersOpen),padding:"4px 10px",fontSize:11,display:"inline-flex",alignItems:"center",gap:5}}><Icon name="chevronDown" size={12} style={{transform:filtersOpen?"rotate(180deg)":"none",transition:"transform .15s"}}/>Filters{(() => { const n = [catFilter,typeFilter,tagFilter].filter(f=>f!=="All").length + (allRegions?1:0); return n ? ` · ${n}` : ""; })()}</button>}
                {filtersOpen && view === "transactions" && <button onClick={() => setAllRegions((a) => !a)} title="Include entries from every region" style={{...pillStyle(allRegions),padding:"4px 10px",fontSize:11,whiteSpace:"nowrap"}}>All regions</button>}
                {filtersOpen && view !== "calendar" && <>

                </select>
                <select value={typeFilter} onChange={e => setTypeFilter(e.target.value)} style={{background:theme.inputBg,border:`1px solid ${theme.inputBorder}`,color:theme.text,padding:"4px 8px",borderRadius:6,fontSize:11}}>
                  <option value="All">All Types</option>

                </select>
                <select value={tagFilter} onChange={e => setTagFilter(e.target.value)} style={{background:theme.inputBg,border:`1px solid ${theme.inputBorder}`,color:theme.text,padding:"4px 8px",borderRadius:6,fontSize:11}}>
                  <option value="All">All Tags</option>
                  {tags.map(t => <option key={t.name} value={t.name}>{t.icon} {t.name}</option>)}
                </select>
                </>}
              </div>
            )}

            <div style={{padding:isMobile?"0 16px 92px":"0 16px 20px",maxWidth:1080,margin:"0 auto",boxSizing:"border-box"}}>
              {loading ? (

              ) : view === "add" ? (
                <AddEntryView recentEntries={recentEntries} allExpenses={RAW} />
              ) : view === "overview" ? (
                <OverviewView {...{filtered,totalSpend,monthlyAvg,dailyAvg,monthlyData,catData,topShops}} allExpenses={RAW} />
              ) : view === "calendar" ? (
                <CalendarView allExpenses={RAW} />
              ) : view === "transactions" ? (
                <TransactionsView pageTx={pageTx} txPage={txPage} setTxPage={setTxPage} txPages={txPages} />
              ) : view === "smart" || view === "farecalc" || view === "capture" ? (
                <SmartEntryView allExpenses={RAW} dueAdd={dueAdd} />
              ) : view === "outstanding" ? (
                <OutstandingView pending={regionPending} recurring={recurring} refresh={async () => { const { data: p } = await supabase.from("cost_management_pending").select("*").eq("status", "pending").order("due_date"); setPending(p || []); await fetchData(); }} />
              ) : view === "sukkiri" ? (
                <SukkiriRequestsView requests={sukkiriReqs} reload={reloadSukkiri} />
              ) : (
                <SettingsView allExpenses={RAW} />
              )}
            </div>

            {/* Mobile bottom tab bar — thumb-reachable primary navigation */}
            {isMobile && (
              <nav style={{position:"fixed",left:0,right:0,bottom:0,zIndex:200,background:"rgba(10,10,18,0.94)",backdropFilter:"blur(14px) saturate(140%)",WebkitBackdropFilter:"blur(14px) saturate(140%)",borderTop:`1px solid ${theme.cardBorder}`,padding:"6px 6px calc(6px + env(safe-area-inset-bottom))",display:"grid",gridTemplateColumns:`repeat(${bottomTabs.length + 1 + (regionPending.length>0?1:0)}, 1fr)`,gap:2,boxShadow:"0 -6px 20px rgba(0,0,0,0.35)"}}>
                {bottomTabs.map(tab => {
                  const on = view===tab.id || (tab.id==="transactions" && view==="calendar");
                  return (
                    <button key={tab.id} onClick={() => { setView(tab.id); setTxPage(0); }} style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:3,minHeight:52,border:"none",borderRadius:12,cursor:"pointer",fontFamily:"inherit",fontSize:10,fontWeight:600,background:on?theme.primaryGlow:"transparent",color:on?"#fff":theme.textMuted}}>
                      <Icon name={tab.icon} size={19}/>{tab.label}
                    </button>
                  );
                })}
                {regionPending.length>0 && (
                  <button onClick={() => setView("outstanding")} style={{position:"relative",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:3,minHeight:52,border:"none",borderRadius:12,cursor:"pointer",fontFamily:"inherit",fontSize:10,fontWeight:600,background:view==="outstanding"?theme.primaryGlow:"transparent",color:view==="outstanding"?"#fff":theme.textMuted}}>
                    <Icon name="inbox" size={19}/>Due
                    <span style={{position:"absolute",top:4,right:"50%",marginRight:-20,background:theme.danger,color:"#fff",fontSize:9,fontWeight:700,borderRadius:9,padding:"1px 5px",lineHeight:1.6}}>{regionPending.length}</span>
                  </button>
                )}
                <button onClick={() => { reloadSukkiri(); setView("sukkiri"); }} style={{position:"relative",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:3,minHeight:52,border:"none",borderRadius:12,cursor:"pointer",fontFamily:"inherit",fontSize:10,fontWeight:600,background:view==="sukkiri"?theme.primaryGlow:"transparent",color:view==="sukkiri"?"#fff":theme.textMuted}}>
                  <span style={{fontSize:17,lineHeight:1.1}}>🛒</span>Requests
                  {sukkiriPending.length>0 && <span style={{position:"absolute",top:4,right:"50%",marginRight:-22,background:theme.danger,color:"#fff",fontSize:9,fontWeight:700,borderRadius:9,padding:"1px 5px",lineHeight:1.6}}>{sukkiriPending.length}</span>}
                </button>
              </nav>
            )}

            {/* Purchase-requests reminder — floats on every screen while requests are pending */}
            {sukkiriPending.length > 0 && !reqReminderHidden && view !== "sukkiri" && (
              <div style={{ position: "fixed", bottom: isMobile ? 84 : 18, left: "50%", transform: "translateX(-50%)", zIndex: 80, display: "flex", alignItems: "center", gap: 10, background: theme.headerBg, border: `1px solid ${theme.primary}55`, borderRadius: 14, padding: "10px 14px", boxShadow: `0 8px 30px rgba(0,0,0,0.45)`, maxWidth: "92vw" }}>
                <span style={{ fontSize: 16 }}>🛒</span>
                <span style={{ fontSize: 12.5, color: "#fff" }}><b>{sukkiriPending.reduce((s, r) => s + (r.items ? r.items.length : 0), 0)} item{sukkiriPending.reduce((s, r) => s + (r.items ? r.items.length : 0), 0) === 1 ? "" : "s"} to buy</b> · {sukkiriPending.length} request{sukkiriPending.length === 1 ? "" : "s"} waiting</span>
                <button onClick={() => { setView("sukkiri"); setReqReminderHidden(true); }} style={{ border: "none", borderRadius: 8, background: theme.primary, color: "#fff", fontSize: 11.5, fontWeight: 700, padding: "6px 12px", cursor: "pointer", fontFamily: "inherit" }}>Review</button>
                <button onClick={() => setReqReminderHidden(true)} title="Remind me later" style={{ border: "none", background: "none", color: theme.textMuted, fontSize: 14, cursor: "pointer", padding: "2px 4px" }}>✕</button>
              </div>
            )}

            {dueModalOpen && dueList.length > 0 && (
              <RecurringDueModal items={dueList} onAdd={dueAdd} onSkip={dueSkip} onSnooze={dueSnooze} onResolve={resolveDue} onClose={dueClose} />
            )}

            {locDueOpen && locDueList.length > 0 && (
              <LocationDueModal items={locDueList} onAdd={locAdd} onSkip={locSkip} onSnooze={locSnooze} onResolve={resolveLoc} onClose={locClose} />
            )}

            {dueToast && (
              <div className="cm-toast" style={{ position: "fixed", top: 16, right: 16, zIndex: 1000, padding: "10px 16px", borderRadius: 10, fontSize: 13, fontWeight: 500, background: theme.primary, color: "#fff", boxShadow: "0 4px 16px rgba(0,0,0,0.3)" }}>
                {dueToast}
              </div>
            )}
          </div>
        </ThemeContext.Provider>
      );
    }

    // ═══════════════════════════════════════════
    //  CALENDAR VIEW (read-only dot calendar + day panel)
    // ═══════════════════════════════════════════
    const pillish = (on, theme) => ({
      padding: "4px 10px", fontSize: 11, fontWeight: 600, borderRadius: 8, cursor: "pointer", fontFamily: "inherit", whiteSpace: "nowrap", lineHeight: 1.6,
      background: on ? "rgba(96,165,250,0.16)" : theme.inputBg,
      color: on ? "#60a5fa" : theme.textMuted,
      border: "1px solid " + (on ? "rgba(96,165,250,0.45)" : theme.cardBorder),
    });

    // ═══════════════════════════════════════════
    //  PRINTABLE FOCUS SHEET — light ink, A4. The screen preview is the same
    //  markup the printer gets; the toolbar drops out under @media print.
    // ═══════════════════════════════════════════
    function PrintSheet({ tasks = [], anchorDate, onClose }) {
      const [mode, setMode] = useState("week");
      const [offset, setOffset] = useState(0);
      const base = anchorDate ? dateOfIso(anchorDate) : new Date();
      const byDate = groupTasksByDate(tasks);
      const loose = tasks.filter((t) => !t.date);
      const DAY_NAMES = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      const ink = { head: "#111827", body: "#1f2937", soft: "#6b7280", rule: "#d1d5db", faint: "#eef0f3" };

      const weekStart = addDays(mondayOfDate(base), offset * 7);
      const weekDays = Array.from({ length: 7 }).map((_, i) => addDays(weekStart, i));
      const monthAnchor = new Date(base.getFullYear(), base.getMonth() + offset, 1);
      const rangeLabel = mode === "week"
        ? MONTHS_FULL[weekStart.getMonth()].slice(0, 3) + " " + weekStart.getDate() + " – " + MONTHS_FULL[weekDays[6].getMonth()].slice(0, 3) + " " + weekDays[6].getDate() + ", " + weekDays[6].getFullYear()
        : MONTHS_FULL[monthAnchor.getMonth()] + " " + monthAnchor.getFullYear();

      const TaskLine = ({ t, size = 10.5 }) => (
        <div style={{ display: "flex", gap: 5, alignItems: "flex-start", padding: "2.5px 0", borderBottom: "1px dotted " + ink.faint }}>
          <span style={{ width: 9, height: 9, minWidth: 9, marginTop: 3, border: "1px solid " + ink.soft, borderRadius: 2, background: t.done ? ink.soft : "#fff" }}></span>
          <span style={{ fontSize: size, lineHeight: 1.3, color: t.done ? ink.soft : ink.body, textDecoration: t.done ? "line-through" : "none" }}>
            {t.time ? <b style={{ color: ink.soft, fontWeight: 700 }}>{t.time} </b> : null}
            {t.title}
            {t.category ? <span style={{ color: ink.soft }}> · {t.category}</span> : null}
          </span>
        </div>
      );
      const BlankLines = ({ n }) => (
        <React.Fragment>
          {Array.from({ length: Math.max(0, n) }).map((_, i) => (
            <div key={"b" + i} style={{ display: "flex", gap: 5, alignItems: "flex-start", padding: "2.5px 0", borderBottom: "1px dotted " + ink.faint }}>
              <span style={{ width: 9, height: 9, minWidth: 9, marginTop: 3, border: "1px solid " + ink.rule, borderRadius: 2 }}></span>
              <span style={{ fontSize: 10.5, lineHeight: 1.3, color: "transparent" }}>·</span>
            </div>
          ))}
        </React.Fragment>
      );

      const btn = { padding: "6px 12px", fontSize: 12, fontWeight: 600, borderRadius: 8, border: "1px solid #d1d5db", background: "#fff", color: "#111827", cursor: "pointer", fontFamily: "inherit" };
      const btnOn = { ...btn, background: "#111827", color: "#fff", borderColor: "#111827" };

      return ReactDOM.createPortal(
        <div className="cm-print-portal" style={{ position: "fixed", inset: 0, zIndex: 9000, background: "#e9ecef", overflow: "auto", padding: "16px 12px 40px" }}>
          <div className="cm-print-toolbar" style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", justifyContent: "center", marginBottom: 14 }}>
            <button onClick={() => setMode("week")} style={mode === "week" ? btnOn : btn}>Week</button>
            <button onClick={() => setMode("month")} style={mode === "month" ? btnOn : btn}>Month</button>
            <button onClick={() => setOffset((o) => o - 1)} style={btn}>‹</button>
            <button onClick={() => setOffset(0)} style={btn}>{rangeLabel}</button>
            <button onClick={() => setOffset((o) => o + 1)} style={btn}>›</button>
            <button onClick={() => window.print()} style={{ ...btnOn, background: "#2563eb", borderColor: "#2563eb" }}>Print</button>
            <button onClick={onClose} style={btn}>Close</button>
          </div>

          <div className="cm-print-sheet" style={{ width: "277mm", maxWidth: "100%", margin: "0 auto", background: "#fff", color: ink.body, padding: "8mm 9mm", boxShadow: "0 6px 24px rgba(0,0,0,0.18)" }}>
            <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", borderBottom: "2px solid " + ink.head, paddingBottom: 6, marginBottom: 10 }}>
              <div>
                <div style={{ fontSize: 19, fontWeight: 700, color: ink.head, letterSpacing: -0.2 }}>Weekly Focus</div>
                <div style={{ fontSize: 11, color: ink.soft, marginTop: 2, whiteSpace: "nowrap" }}>{mode === "week" ? "Week of " : ""}{rangeLabel}</div>
              </div>
              <div style={{ fontSize: 10, color: ink.soft, textAlign: "right", whiteSpace: "nowrap", paddingLeft: 16 }}>
                {tasks.filter((t) => !t.done).length} open · {tasks.length} total<br/>printed {todayStr()}
              </div>
            </div>

            {mode === "week" ? (
              <React.Fragment>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", border: "1px solid " + ink.rule, borderRight: "none" }}>
                  {weekDays.map((d, i) => {
                    const iso = ymdLocal(d);
                    const list = byDate[iso] || [];
                    const weekend = i >= 5;
                    return (
                      <div key={iso} style={{ borderRight: "1px solid " + ink.rule, minHeight: "128mm", display: "flex", flexDirection: "column" }}>
                        <div style={{ padding: "4px 6px", borderBottom: "1px solid " + ink.rule, background: weekend ? "#f6f7f9" : "#fff" }}>
                          <div style={{ fontSize: 10, fontWeight: 700, color: ink.head, textTransform: "uppercase", letterSpacing: 0.6 }}>{DAY_NAMES[i]}</div>
                          <div style={{ fontSize: 15, fontWeight: 700, color: weekend ? ink.soft : ink.head, lineHeight: 1.1 }}>{d.getDate()}</div>
                        </div>
                        <div style={{ padding: "3px 6px 6px", flex: 1 }}>
                          {list.map((t) => <TaskLine key={t.id} t={t}/>)}
                          <BlankLines n={Math.max(2, 14 - list.length)}/>
                        </div>
                      </div>
                    );
                  })}
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 14, marginTop: 9, border: "1px solid " + ink.rule, padding: "6px 8px" }}>
                  <div>
                    <div style={{ fontSize: 9.5, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.6, color: ink.head, marginBottom: 3 }}>Anytime this week</div>
                    {loose.length ? loose.slice(0, 6).map((t) => <TaskLine key={t.id} t={t} size={10}/>) : <BlankLines n={4}/>}
                  </div>
                  <div>
                    <div style={{ fontSize: 9.5, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.6, color: ink.head, marginBottom: 3 }}>Notes</div>
                    <BlankLines n={4}/>
                  </div>
                  <div>
                    <div style={{ fontSize: 9.5, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.6, color: ink.head, marginBottom: 3 }}>Carry over</div>
                    <BlankLines n={4}/>
                  </div>
                </div>
              </React.Fragment>
            ) : (() => {
                const y = monthAnchor.getFullYear(), mo = monthAnchor.getMonth();
                const dim = new Date(y, mo + 1, 0).getDate();
                const jsFirst = new Date(y, mo, 1).getDay();
                const lead = jsFirst === 0 ? 6 : jsFirst - 1;
                const cells = Array.from({ length: lead }).map(() => null).concat(Array.from({ length: dim }).map((_, i) => i + 1));
                while (cells.length % 7) cells.push(null);
                return (
                  <div style={{ border: "1px solid " + ink.rule, borderRight: "none", borderBottom: "none" }}>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)" }}>
                      {DAY_NAMES.map((d) => (
                        <div key={d} style={{ borderRight: "1px solid " + ink.rule, borderBottom: "1px solid " + ink.rule, padding: "3px 6px", fontSize: 9.5, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.6, color: ink.head, background: "#f6f7f9" }}>{d}</div>
                      ))}
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)" }}>
                      {cells.map((day, i) => {
                        const iso = day ? y + "-" + pad2(mo + 1) + "-" + pad2(day) : null;
                        const list = iso ? (byDate[iso] || []) : [];
                        return (
                          <div key={i} style={{ borderRight: "1px solid " + ink.rule, borderBottom: "1px solid " + ink.rule, minHeight: "27mm", padding: "3px 5px", background: day ? "#fff" : "#fafbfc" }}>
                            {day ? <div style={{ fontSize: 11, fontWeight: 700, color: ink.head, marginBottom: 2 }}>{day}</div> : null}
                            {list.slice(0, 4).map((t) => (
                              <div key={t.id} style={{ fontSize: 9.5, lineHeight: 1.3, color: t.done ? ink.soft : ink.body, textDecoration: t.done ? "line-through" : "none", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>▢ {t.title}</div>
                            ))}
                            {list.length > 4 ? <div style={{ fontSize: 9, color: ink.soft }}>+{list.length - 4} more</div> : null}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })()}
          </div>
        </div>,
        document.body
      );
    }

    function CalendarView({ allExpenses = [] }) {
      const { theme, fetchData, getCatIcon, getTagIcon, setView, setPresetDate } = useTheme();
      const { openEdit, requestDelete, modals } = useExpenseMutations({ onChange: fetchData });
      const [viewDate, setViewDate] = useState(() => {
        const d = new Date();
        return { year: d.getFullYear(), month: d.getMonth() };
      });
      const [panelDate, setPanelDate] = useState(null); // ISO date string of the open day panel, or null
      // ── Weekly Focus tasks: read from the shared localStorage key and kept
      //    in sync while the app is open, so edits made in the other app show
      //    up here without a reload.
      const [tasks, setTasks] = useState(() => getFocusTasks());
      const [showTasks, setShowTasks] = useState(true);
      const [importOpen, setImportOpen] = useState(false);
      const [importText, setImportText] = useState("");
      const [importMsg, setImportMsg] = useState("");
      const [printOpen, setPrintOpen] = useState(false);
      useEffect(() => {
        const sync = () => setTasks(getFocusTasks());
        const onStorage = (e) => { if (!e.key || e.key === FOCUS_TASKS_KEY || LEGACY_TASK_KEYS.indexOf(e.key) >= 0) sync(); };
        window.addEventListener("storage", onStorage);
        window.addEventListener("focus", sync);
        const iv = setInterval(sync, 15000);
        return () => { window.removeEventListener("storage", onStorage); window.removeEventListener("focus", sync); clearInterval(iv); };
      }, []);
      const tasksByDate = groupTasksByDate(tasks);
      const openTasks = tasks.filter((t) => !t.done).length;
      const toggleTask = (id) => {
        const next = getFocusTasks().map((t) => (t.id === id ? { ...t, done: !t.done } : t));
        setFocusTasks(next); setTasks(next);
      };
      const doImport = () => {
        let parsed;
        try { parsed = JSON.parse(importText); }
        catch (e) {
          const lines = importText.split("\n").map((l) => l.replace(/^[-*\u2022\s\[\]x]+/i, "").trim()).filter(Boolean);
          if (!lines.length) { setImportMsg("Couldn't read that — paste JSON, or one task per line."); return; }
          parsed = lines;
        }
        const res = mergeFocusTasks(parsed);
        setTasks(res.list); setImportText("");
        setImportMsg(res.added ? res.added + " task" + (res.added === 1 ? "" : "s") + " imported." : "Nothing new — those tasks were already here.");
      };

      const daysInMonth = new Date(viewDate.year, viewDate.month + 1, 0).getDate();
      const firstDayJS = new Date(viewDate.year, viewDate.month, 1).getDay();
      const firstDayOfWeek = firstDayJS === 0 ? 6 : firstDayJS - 1;

      const isoOf = (day) => `${viewDate.year}-${String(viewDate.month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const isToday = (day) => {
        const t = new Date();
        return viewDate.year === t.getFullYear() && viewDate.month === t.getMonth() && day === t.getDate();
      };

      // Expense-type indicators for a date
      const getDateIndicators = (day) => {
        const dateStr = isoOf(day);
        const dayExp = allExpenses.filter(e => e.date === dateStr);
        if (dayExp.length === 0) return null;
        const types = new Set(dayExp.map(e => e.expense_type || "normal"));
        const indicators = [];
        if (types.has("fixed")) indicators.push("📌");
        if (types.has("outlier")) indicators.push("⚡");
        if (types.has("normal")) indicators.push("●");
        return indicators;
      };

      // Entries for the currently open day panel
      const panelExpenses = panelDate ? allExpenses.filter(e => e.date === panelDate) : [];
      const panelTotal = panelExpenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);

      return (
        <div>
          <div style={{background:theme.cardBg,borderRadius:12,padding:16,border:`1px solid ${theme.cardBorder}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <button onClick={() => setViewDate(v => v.month===0?{year:v.year-1,month:11}:{...v,month:v.month-1})} style={{background:theme.inputBg,border:"none",borderRadius:6,width:30,height:30,cursor:"pointer",color:theme.textMuted,display:"inline-flex",alignItems:"center",justifyContent:"center"}}><Icon name="chevronLeft" size={16}/></button>
              <div style={{fontSize:14,fontWeight:600,color:"#fff"}}>{MONTHS_FULL[viewDate.month]} {viewDate.year}</div>
              <button onClick={() => setViewDate(v => v.month===11?{year:v.year+1,month:0}:{...v,month:v.month+1})} style={{background:theme.inputBg,border:"none",borderRadius:6,width:30,height:30,cursor:"pointer",color:theme.textMuted,display:"inline-flex",alignItems:"center",justifyContent:"center"}}><Icon name="chevronRight" size={16}/></button>
            </div>
            {/* Weekly Focus task controls */}
            <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center",justifyContent:"center",marginBottom:10}}>
              <button onClick={() => setShowTasks(s => !s)} style={pillish(showTasks, theme)}>{showTasks ? "☑" : "☐"} Focus tasks</button>
              <button onClick={() => { setTasks(getFocusTasks()); setImportMsg(""); setImportOpen(true); }} style={pillish(false, theme)}>Import</button>
              <button onClick={() => setPrintOpen(true)} style={pillish(false, theme)}>🖨 Print sheet</button>
              <span style={{fontSize:10,color:theme.textDim}}>{openTasks} open · {tasks.length} total</span>
            </div>
            {/* Legend */}
            <div style={{display:"flex",gap:12,justifyContent:"center",marginBottom:10,fontSize:10,color:theme.textDim}}>
              <span><span style={{color:"#22c55e"}}>●</span> Normal</span>
              <span>📌 Fixed</span>
              <span>⚡ Outlier</span>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7, 1fr)",gap:4,marginBottom:8}}>
              {["Mo","Tu","We","Th","Fr","Sa","Su"].map(d => <div key={d} style={{textAlign:"center",fontSize:10,color:theme.textDim,fontWeight:600,padding:4}}>{d}</div>)}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7, 1fr)",gap:4}}>
              {Array.from({length:firstDayOfWeek}).map((_,i) => <div key={`e-${i}`}/>)}
              {Array.from({length:daysInMonth}).map((_,i) => {
                const day = i+1;
                const tod = isToday(day);
                const indicators = getDateIndicators(day);
                const dayTasks = showTasks ? (tasksByDate[isoOf(day)] || []) : [];
                const dayOpen = dayTasks.filter(t => !t.done).length;
                return (
                  <button key={day} onClick={() => setPanelDate(isoOf(day))} style={{
                    aspectRatio:"1",borderRadius:8,border:"none",cursor:"pointer",fontSize:12,fontWeight:400,
                    background:tod?theme.inputBg:"transparent",
                    color:tod?theme.primary:theme.text,
                    position:"relative",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
                  }}>
                    <span>{day}</span>
                    {indicators && (
                      <span style={{fontSize:7,lineHeight:1,marginTop:1,display:"flex",gap:1}}>
                        {indicators.map((ind, idx) => (
                          <span key={idx} style={{color: ind === "●" ? "#22c55e" : undefined}}>{ind}</span>
                        ))}
                      </span>
                    )}
                    {dayTasks.length > 0 && (
                      <span title={dayTasks.map(t => t.title).join(", ")} style={{position:"absolute",top:3,right:4,fontSize:8,fontWeight:700,lineHeight:1,padding:"1px 4px",borderRadius:5,background:dayOpen?"rgba(96,165,250,0.18)":"transparent",color:dayOpen?"#60a5fa":theme.textDim}}>{dayOpen || "✓"}</span>
                    )}
                  </button>
                );
              })}
            </div>
          </div>

          {/* Day panel — bottom sheet (read-only) */}
          {panelDate && (
            <Modal sheet onClose={() => setPanelDate(null)}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <div>
                  <div style={{fontSize:15,fontWeight:700,color:"#fff"}}>{panelDate}</div>
                  <div style={{fontSize:11,color:theme.textMuted}}>{panelExpenses.length} {panelExpenses.length===1?"entry":"entries"} · {fmt(panelTotal)}</div>
                </div>
                <button onClick={() => setPanelDate(null)} style={{background:theme.inputBg,border:"none",borderRadius:8,width:30,height:30,cursor:"pointer",color:theme.textMuted,fontSize:16,lineHeight:1}}>×</button>
              </div>
              {(tasksByDate[panelDate] || []).length > 0 && (
                <div style={{marginBottom:14}}>
                  <div style={{fontSize:10,fontWeight:700,letterSpacing:0.5,textTransform:"uppercase",color:theme.textDim,marginBottom:6}}>Focus tasks</div>
                  <div style={{display:"flex",flexDirection:"column",gap:5}}>
                    {(tasksByDate[panelDate] || []).map(t => (
                      <button key={t.id} onClick={() => toggleTask(t.id)} style={{display:"flex",alignItems:"center",gap:9,background:theme.inputBg,border:"none",borderRadius:10,padding:"9px 12px",cursor:"pointer",textAlign:"left",fontFamily:"inherit"}}>
                        <span style={{width:16,height:16,flexShrink:0,borderRadius:5,border:`1.5px solid ${t.done ? "#22c55e" : theme.cardBorder}`,background:t.done?"#22c55e":"transparent",color:"#06210f",fontSize:11,display:"inline-flex",alignItems:"center",justifyContent:"center"}}>{t.done ? "✓" : ""}</span>
                        <span style={{flex:1,minWidth:0,fontSize:13,fontWeight:600,color:t.done?theme.textDim:"#fff",textDecoration:t.done?"line-through":"none"}}>{t.title}</span>
                        {t.time && <span style={{fontSize:11,color:theme.textMuted,flexShrink:0}}>{t.time}</span>}
                        {t.category && <span style={{fontSize:10,color:theme.textMuted,background:theme.cardBg,padding:"2px 7px",borderRadius:6,flexShrink:0}}>{t.category}</span>}
                      </button>
                    ))}
                  </div>
                </div>
              )}
              {panelExpenses.length === 0 ? (
                <div style={{textAlign:"center",padding:"24px 0",color:theme.textMuted,fontSize:13}}>No entries for this day.</div>
              ) : (
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  {panelExpenses.map(e => (
                    <div key={e.id} style={{display:"flex",alignItems:"center",gap:10,background:theme.inputBg,borderRadius:10,padding:"10px 12px"}}>
                      <span style={{fontSize:18}} title={e.category}>{getCatIcon(e.category)}</span>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{display:"flex",alignItems:"center",gap:6}}>
                          <span style={{fontSize:13,fontWeight:600,color:"#fff",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.shop}</span>
                          {EXPENSE_TYPES[e.expense_type]?.icon && <span style={{fontSize:11}}>{EXPENSE_TYPES[e.expense_type].icon}</span>}
                        </div>
                        {(e.tags||"").split(",").filter(Boolean).length > 0 && (
                          <div style={{display:"flex",gap:3,marginTop:2}}>
                            {(e.tags||"").split(",").filter(Boolean).map(t => (
                              <span key={t} title={t} style={{fontSize:11}}>{getTagIcon(t)}</span>
                            ))}
                          </div>
                        )}
                      </div>
                      <span style={{fontSize:14,fontWeight:700,color:"#fff",whiteSpace:"nowrap"}}>{fmt(e.amount)}</span>
                      <div style={{display:"flex",alignItems:"center",flexShrink:0}}>
                        <button title="Edit" onClick={() => openEdit(e)} style={{background:"none",border:"none",cursor:"pointer",opacity:0.85,padding:"3px 5px",color:theme.textMuted,display:"inline-flex"}}><Icon name="pencil" size={15}/></button>
                        <button title="Delete" onClick={() => requestDelete(e)} style={{background:"none",border:"none",cursor:"pointer",opacity:0.85,padding:"3px 5px",color:theme.danger,display:"inline-flex"}}><Icon name="trash" size={15}/></button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
              {/* Jump to the Add tab pre-dated to this day, for same-day stacking */}
              <button onClick={() => { setPresetDate(panelDate); setView("add"); setPanelDate(null); }}
                style={{marginTop:12,width:"100%",padding:"10px",borderRadius:10,border:`1px dashed ${theme.cardBorder}`,background:theme.inputBg,color:theme.primary,cursor:"pointer",fontWeight:600,fontSize:12}}>
                + Add entry
              </button>
            </Modal>
          )}

          {/* Import tasks from the Weekly Focus app */}
          {importOpen && (
            <Modal onClose={() => setImportOpen(false)}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                <div>
                  <div style={{fontSize:15,fontWeight:700,color:"#fff"}}>Weekly Focus tasks</div>
                  <div style={{fontSize:11,color:theme.textMuted,marginTop:2}}>Auto-read from <code style={{color:theme.primary}}>{FOCUS_TASKS_KEY}</code> · {tasks.length} loaded</div>
                </div>
                <button onClick={() => setImportOpen(false)} style={{background:theme.inputBg,border:"none",borderRadius:8,width:30,height:30,cursor:"pointer",color:theme.textMuted,fontSize:16,lineHeight:1}}>×</button>
              </div>
              <div style={{fontSize:11.5,color:theme.textMuted,lineHeight:1.5,marginBottom:8}}>
                Paste JSON from the Weekly Focus app — an array, {"{tasks:[…]}"} or {"{days:{mon:[…]}}"} — or just one task per line.
              </div>
              <textarea value={importText} onChange={(e) => { setImportText(e.target.value); setImportMsg(""); }} rows={7}
                placeholder={'[{"title":"Draft the report","date":"2026-08-31","time":"09:00","category":"Work"}]'}
                style={{width:"100%",background:theme.inputBg,border:`1px solid ${theme.inputBorder}`,borderRadius:10,color:theme.text,padding:"10px 12px",fontSize:12,fontFamily:"ui-monospace, SFMono-Regular, Menlo, monospace",resize:"vertical"}}/>
              {importMsg && <div style={{fontSize:11.5,color:theme.primary,marginTop:8}}>{importMsg}</div>}
              <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
                <button onClick={doImport} style={{flex:1,minWidth:120,padding:"10px",borderRadius:10,border:"none",background:theme.primary,color:"#fff",fontWeight:700,fontSize:12.5,cursor:"pointer",fontFamily:"inherit"}}>Import</button>
                <button onClick={() => { setTasks(getFocusTasks()); setImportMsg("Reloaded from the Weekly Focus app."); }} style={{padding:"10px 14px",borderRadius:10,border:`1px solid ${theme.cardBorder}`,background:theme.inputBg,color:theme.text,fontWeight:600,fontSize:12.5,cursor:"pointer",fontFamily:"inherit"}}>Reload</button>
                <button onClick={() => { if (tasks.length && confirm("Remove all " + tasks.length + " imported tasks?")) { setFocusTasks([]); setTasks([]); setImportMsg("Cleared."); } }} style={{padding:"10px 14px",borderRadius:10,border:`1px solid ${theme.cardBorder}`,background:"transparent",color:theme.danger,fontWeight:600,fontSize:12.5,cursor:"pointer",fontFamily:"inherit"}}>Clear</button>
              </div>
            </Modal>
          )}

          {printOpen && <PrintSheet tasks={tasks} anchorDate={panelDate || (new Date().getFullYear() === viewDate.year && new Date().getMonth() === viewDate.month ? todayStr() : isoOf(1))} onClose={() => setPrintOpen(false)}/>}

          {/* Edit/delete modals from the shared hook. Wrapped in a stacking
              context above the day-panel sheet (sheet zIndex=300) so they layer
              OVER the open panel; closing them returns to the still-open panel. */}
          <div style={{position:"relative",zIndex:400}}>{modals}</div>
        </div>
      );
    }

    // ═══════════════════════════════════════════
    //  TAG SELECTOR (Multi-select chips)
    // ═══════════════════════════════════════════
    function TagSelector({ selectedTags, onChange }) {
      const { theme, tags, getTagIcon, getTagColor } = useTheme();
      const toggle = (name) => {
        onChange(selectedTags.includes(name) ? selectedTags.filter(t => t !== name) : [...selectedTags, name]);
      };
      return (
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {tags.map(tag => {
            const sel = selectedTags.includes(tag.name);
            return (
              <button key={tag.name} onClick={() => toggle(tag.name)} style={{
                padding:"5px 10px",borderRadius:8,border:"none",cursor:"pointer",fontSize:11,
                display:"flex",alignItems:"center",gap:4,
                background:sel?`${tag.color}30`:theme.cardBg,
                color:sel?tag.color:theme.textMuted,
                outline:sel?`2px solid ${tag.color}`:`1px solid ${theme.cardBorder}`,
              }}>
                <span>{tag.icon}</span>{tag.name}
              </button>
            );
          })}
        </div>
      );
    }

    // ═══════════════════════════════════════════
    //  ADD ENTRY VIEW
    // ═══════════════════════════════════════════
    // ═══════════════════════════════════════════
    //  ADD ENTRY VIEW  (redesigned: Quick / Same shop / Different)
    // ═══════════════════════════════════════════
    let _rid = 0; // module-scoped so row ids stay stable across re-renders
    function AddEntryView({ recentEntries, allExpenses }) {
      const { theme, supabase, fetchData, categories, shops, tags, presetDate, setPresetDate } = useTheme();
      const C = {
        text: theme.text, muted: theme.textMuted, dim: theme.textDim,
        card: theme.cardBg, border: theme.cardBorder, input: theme.inputBg, primary: theme.primary,
      };
      const ADD_EMOJI = ["🛒","🏪","🍜","🌏","☕","🧹","🚗","🏠","📦","🍕","💊","🎮","📚","👕","💡","✈️","🎁","💰","🍎","🛍️"];
      const ADD_COLOR = ["#2563eb","#f59e0b","#10b981","#ef4444","#8b5cf6","#ec4899","#06b6d4","#f97316","#14b8a6","#a78bfa","#64748b","#84cc16"];
      const today = new Date(); const yest = new Date(Date.now() - 86400000);
      const isoOfDate = (d) => ymdLocal(d);
      const blankRow = (d) => ({ id: ++_rid, date: d, cat: null, shop: null, type: "normal", tags: [], amount: "" });

      const [mode, setMode] = useState("quick"); // quick | same | list
      const [batchOpen, setBatchOpen] = useState(false); // reveals the multi-entry mode switcher
      const [moreOpen, setMoreOpen] = useState(false); // reveals type + tags in quick mode
      const [amount, setAmount] = useState("");
      // A pre-set date from the Calendar day panel seeds quick-mode for same-day stacking.
      const [dates, setDates] = useState(() => presetDate ? [presetDate] : [isoOfDate(today)]);
      const [cat, setCat] = useState(null);
      const [shop, setShop] = useState(null);
      const [etype, setEtype] = useState("normal");
      const [etags, setEtags] = useState([]);
      const [rows, setRows] = useState([]);
      const [activeRow, setActiveRow] = useState(-1); // expanded review row (multi); -1 = none
      const [catSheetOpen, setCatSheetOpen] = useState(false);
      const [shopSheetOpen, setShopSheetOpen] = useState(false);
      const [calOpen, setCalOpen] = useState(false);
      const [padOpen, setPadOpen] = useState(false);
      const [tagsOpen, setTagsOpen] = useState(false);
      const [saving, setSaving] = useState(false);
      const [saved, setSaved] = useState(false);
      const [flash, setFlash] = useState(null);
      const [toast, setToast] = useState(null);
      const [newCatOpen, setNewCatOpen] = useState(false);
      const [newCat, setNewCat] = useState({ name: "", icon: "📦", color: "#8b5cf6" });
      const [newShopOpen, setNewShopOpen] = useState(false);
      const [newShop, setNewShop] = useState({ name: "", fav: false });
      const [dupDialog, setDupDialog] = useState(null); // { multi, queue: [{ record, existing, rowIdx }], idx, kept, view }
      const [removingRow, setRemovingRow] = useState(null); // row index fading out before removal

      // presetDate is consumed once (into `dates` above); clear it so a later
      // normal visit to the Add tab doesn't carry a stale preset date.
      useEffect(() => { if (presetDate) setPresetDate(null); }, []);

      const isDiff = mode === "list";
      const isSame = mode === "same";
      const isMulti = isDiff || isSame;
      const activeIdx = activeRow >= 0 && activeRow < rows.length ? activeRow : -1;
      const aRow = activeIdx >= 0 ? rows[activeIdx] : null;

      const curAmountStr = isMulti ? (aRow ? aRow.amount : "") : amount;
      const curCat = isDiff ? (aRow ? aRow.cat : null) : cat;
      const curShop = isDiff ? (aRow ? aRow.shop : null) : shop;
      const curType = isDiff ? (aRow ? aRow.type : "normal") : etype;
      const curTags = isDiff ? (aRow ? aRow.tags : []) : etags;

      const catObj = categories.find((c) => c.name === curCat);
      const accent = catObj ? catObj.color : theme.primary;
      const favSort = (a, b) => (b.is_favorite ? 1 : 0) - (a.is_favorite ? 1 : 0);
      const catShops = shops.filter((s) => s.category === curCat).sort(favSort);
      const amt = Number(curAmountStr) || 0;
      const valid = amt > 0 && curCat && curShop;

      const whenLabel = (s) => s === isoOfDate(today) ? "Today" : s === isoOfDate(yest) ? "Yesterday"
        : `${MONTHS_SHORT[Number(s.slice(5, 7))]} ${Number(s.slice(8, 10))}`;
      const dayCount = new Set(rows.map((r) => r.date)).size;
      const dateLabel = isMulti
        ? (rows.length === 0 ? "Select days" : `${dayCount} day${dayCount !== 1 ? "s" : ""} · ${rows.length} entr${rows.length !== 1 ? "ies" : "y"}`)
        : whenLabel(dates[0]);

      const updRow = (patch) => { if (activeIdx < 0) return; setRows((rs) => rs.map((r, i) => (i === activeIdx ? { ...r, ...patch } : r))); };
      const press = (key) => {
        vibrate(10);
        setSaved(false);
        const apply = (a) => key === "del" ? a.slice(0, -1) : key === "00" ? (a === "" ? "" : (a.length < 8 ? a + "00" : a)) : (a.length < 9 ? (a === "0" ? key : a + key) : a);
        if (isMulti) { if (activeIdx < 0) return; setRows((rs) => rs.map((r, i) => (i === activeIdx ? { ...r, amount: apply(r.amount) } : r))); } else setAmount((a) => apply(a));
      };
      const setCurCat = (name) => { if (isDiff) updRow({ cat: name, shop: null }); else { setCat(name); setShop(null); } };
      const setCurShop = (name) => { if (isDiff) updRow({ shop: name }); else setShop(name); };
      const setCurType = (t) => { if (isDiff) updRow({ type: t }); else setEtype(t); };
      const setCurTags = (list) => { if (isDiff) updRow({ tags: list }); else setEtags(list); };
      const pickCat = (c) => { setCurCat(c.name); setNewCatOpen(false); setNewShopOpen(false); setCatSheetOpen(false); setShopSheetOpen(true); };
      const pickShop = (name) => { setCurShop(name); setNewShopOpen(false); setShopSheetOpen(false); };

      // the multi-date selection drives the review list: one editable row per picked day,
      // keeping whatever was already entered for days that stay selected
      const applyDates = (counts) => {
        setRows((prev) => {
          const out = [];
          Object.keys(counts).sort().forEach((d) => {
            const existing = prev.filter((r) => r.date === d);
            for (let k = 0; k < counts[d]; k++) out.push(existing[k] || blankRow(d));
          });
          return out;
        });
        setActiveRow(-1);
      };
      const openCal = () => setCalOpen(true);
      const removeRow = (i) => {
        vibrate(10);
        setRemovingRow(i);
        setTimeout(() => {
          setRemovingRow(null);
          setRows((rs) => rs.filter((_, j) => j !== i));
          setActiveRow((a) => (a === i ? -1 : i < a ? a - 1 : a));
        }, 280);
      };
      const addDayRow = (d) => { vibrate(10); setRows((rs) => [...rs, blankRow(d)]); setActiveRow(rows.length); };

      const switchMode = (m) => {
        setMode(m); setCalOpen(false); setNewCatOpen(false); setNewShopOpen(false); setCatSheetOpen(false); setShopSheetOpen(false); setPadOpen(false); setActiveRow(-1); setDupDialog(null);
        if (m === "quick") setDates([isoOfDate(today)]); else setDates([]);
      };

      const showToast = (type, msg) => { setToast({ type, msg }); setTimeout(() => setToast(null), 3000); };
      const insertExpenses = async (records) => {
        setSaving(true);
        const { error } = await supabase.from("cost_management_expenses").insert(records.map((r) => ({ region: CUR.code, ...r })));
        setSaving(false);
        if (error) { showToast("error", error.message); return false; }
        await fetchData();
        return true;
      };

      // ── duplicate detection: same date + same shop + same amount already in the table ──
      const findDuplicate = (date, shopName, amountVal) =>
        allExpenses.find((e) => e.date === date && e.shop === shopName && Number(e.amount) === Number(amountVal)) || null;

      const quickDup = !isMulti && valid ? findDuplicate(dates[0], shop, amt) : null;

      const commitQuick = async (records) => {
        const ok = await insertExpenses(records);
        if (!ok) return;
        vibrate(10);
