        setSaved(true); setFlash(fmt(records.reduce((s, r) => s + r.amount, 0)));
        setTimeout(() => { setAmount(""); setShop(null); setCat(null); setEtags([]); setEtype("normal"); setTagsOpen(false); setSaved(false); }, 900);
        setTimeout(() => setFlash(null), 1700);
      };
      const save = () => {
        if (!valid || saving) return;
        const record = { date: dates[0], category: cat, shop, amount: amt, notes: "", expense_type: etype, tags: (etags || []).join(",") };
        const existing = findDuplicate(record.date, record.shop, record.amount);
        if (existing) { setDupDialog({ multi: false, queue: [{ record, existing }], idx: 0, kept: [], view: false }); return; }
        commitQuick([record]);
      };
      const rowCatOf = (r) => (isSame ? cat : r.cat);
      const rowShopOf = (r) => (isSame ? shop : r.shop);
      const isRowFilled = (r) => rowCatOf(r) && rowShopOf(r) && Number(r.amount) > 0;
      const rowDup = (r) => (isRowFilled(r) ? findDuplicate(r.date, rowShopOf(r), Number(r.amount)) : null);
      const buildRecord = (r) => ({ date: r.date, category: rowCatOf(r), shop: rowShopOf(r), amount: Number(r.amount), notes: "", expense_type: isSame ? etype : (r.type || "normal"), tags: ((isSame ? etags : r.tags) || []).join(",") });
      const filledEntries = rows.map((r, i) => ({ r, i })).filter(({ r }) => isRowFilled(r));
      const flaggedCount = filledEntries.filter(({ r }) => rowDup(r)).length;
      const rowsTotal = rows.reduce((s, r) => s + Number(r.amount || 0), 0);

      const commitMulti = async (entries) => { // entries: [{ record, rowIdx }] — saved rows leave the list, the rest stay editable
        if (!entries.length) return;
        const ok = await insertExpenses(entries.map((e) => e.record));
        if (!ok) return;
        vibrate(10);
        const savedIdx = new Set(entries.map((e) => e.rowIdx));
        const remaining = rows.filter((_, i) => !savedIdx.has(i));
        setSaved(true);
        setFlash(`${entries.length} item${entries.length > 1 ? "s" : ""} · ${fmt(entries.reduce((s, e) => s + e.record.amount, 0))}`);
        if (remaining.length) showToast("success", `${entries.length} saved · ${remaining.length} still in the list`);
        setTimeout(() => {
          setRows(remaining); setActiveRow(-1); setSaved(false);
          if (!remaining.length && isSame) { setShop(null); setCat(null); setEtags([]); setEtype("normal"); }
        }, 900);
        setTimeout(() => setFlash(null), 1700);
      };
      const saveMulti = () => {
        if (!filledEntries.length || saving) return;
        const flagged = [], clean = [];
        filledEntries.forEach(({ r, i }) => {
          const existing = rowDup(r);
          const entry = { record: buildRecord(r), existing, rowIdx: i };
          (existing ? flagged : clean).push(entry);
        });
        if (!flagged.length) { commitMulti(clean); return; }
        // confirm flagged rows one by one (Add anyway / Cancel per row, not per batch)
        setDupDialog({ multi: true, queue: flagged, idx: 0, kept: clean, view: false });
      };

      // Add-anyway / Cancel for the entry the duplicate dialog is showing;
      // when the queue is exhausted, insert whatever was kept
      const dupAdvance = (keep) => {
        const d = dupDialog; if (!d) return;
        const cur = d.queue[d.idx];
        const kept = keep ? [...d.kept, { record: cur.record, rowIdx: cur.rowIdx }] : d.kept;
        if (d.idx + 1 < d.queue.length) { setDupDialog({ ...d, kept, idx: d.idx + 1, view: false }); return; }
        setDupDialog(null);
        if (d.multi) commitMulti(kept);
        else if (kept.length) commitQuick(kept.map((k) => k.record));
      };

      const addCategory = async () => {
        const name = newCat.name.trim(); if (!name) return;
        const existing = categories.find((c) => c.name.toLowerCase() === name.toLowerCase());
        if (!existing) {
          const { error } = await supabase.from("cost_management_categories").insert({ name, icon: newCat.icon, color: newCat.color, sort_order: categories.length + 1 });
          if (error) { showToast("error", error.message.includes("duplicate") ? "Exists" : error.message); return; }
          await fetchData();
        }
        setNewCat({ name: "", icon: "📦", color: "#8b5cf6" });
        pickCat(existing || { name });
      };
      const addShop = async () => {
        const name = newShop.name.trim(); if (!name || !curCat) return;
        if (!shops.some((s) => s.name === name && s.category === curCat)) {
          const { error } = await supabase.from("cost_management_shops").insert({ region: CUR.code, name, category: curCat, is_favorite: newShop.fav });
          if (error) { showToast("error", error.message.includes("duplicate") ? "Shop exists" : error.message); return; }
          await fetchData();
        }
        setNewShop({ name: "", fav: false });
        pickShop(name);
      };
      const repeat = (e) => {
        vibrate(10);
        if (isDiff) updRow({ cat: e.category, shop: e.shop, amount: String(e.amount), type: e.expense_type || "normal" });
        else if (isSame) { setCat(e.category); setShop(e.shop); updRow({ amount: String(e.amount) }); }
        else { setCat(e.category); setShop(e.shop); setAmount(String(e.amount)); setEtype(e.expense_type || "normal"); }
      };

      // styles
      const chip = (active, color) => ({ padding: "9px 13px", borderRadius: 11, border: "none", cursor: "pointer", fontSize: 13, fontFamily: "inherit", whiteSpace: "nowrap", flexShrink: 0, transition: "all .15s", display: "flex", alignItems: "center", gap: 6, background: active ? `${color}26` : C.input, color: active ? "#fff" : C.muted, boxShadow: active ? `inset 0 0 0 1.5px ${color}` : `inset 0 0 0 1px ${C.border}` });
      const sLbl = { fontSize: 10.5, letterSpacing: 1.4, textTransform: "uppercase", color: C.dim, margin: "0 0 9px", fontWeight: 600 };
      const closeBtn = { border: "none", background: C.input, color: C.muted, width: 30, height: 30, borderRadius: 15, fontSize: 17, cursor: "pointer", boxShadow: `inset 0 0 0 1px ${C.border}`, flexShrink: 0 };
      const newChip = (on) => ({ padding: "8px 12px", borderRadius: 11, cursor: "pointer", fontSize: 13, fontFamily: "inherit", whiteSpace: "nowrap", flexShrink: 0, display: "flex", alignItems: "center", gap: 5, color: theme.primary, fontWeight: 600, background: on ? `${theme.primary}22` : "transparent", border: `1.5px dashed ${on ? theme.primary : theme.primary + "70"}` });
      const creatorCard = { marginTop: 12, background: C.card, borderRadius: 14, padding: 14, boxShadow: `inset 0 0 0 1px ${C.border}` };
      const fieldInput = { width: "100%", padding: "11px 13px", borderRadius: 11, border: "none", background: C.input, color: "#fff", fontSize: 14.5, fontFamily: "inherit", boxShadow: `inset 0 0 0 1px ${C.border}`, outline: "none" };
      const emojiBtn = (on) => ({ width: 34, height: 34, borderRadius: 9, border: "none", cursor: "pointer", fontSize: 16, background: on ? `${theme.primary}26` : C.input, boxShadow: on ? `inset 0 0 0 1.5px ${theme.primary}` : `inset 0 0 0 1px ${C.border}` });
      const swatch = (col, on) => ({ width: 28, height: 28, borderRadius: 8, border: on ? "2px solid #fff" : "none", background: col, cursor: "pointer", boxShadow: on ? "0 0 0 2px rgba(255,255,255,0.18)" : "none" });
      const ghostBtn = { flex: 1, height: 44, borderRadius: 12, border: "none", background: C.input, color: C.muted, fontSize: 13.5, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", boxShadow: `inset 0 0 0 1px ${C.border}` };
      const okBtn = (en) => ({ flex: 2, height: 44, borderRadius: 12, border: "none", color: en ? "#fff" : C.dim, fontSize: 13.5, fontWeight: 700, cursor: en ? "pointer" : "not-allowed", fontFamily: "inherit", background: en ? `linear-gradient(135deg, ${theme.primary}, ${theme.accent})` : C.input });
      const ctaStyle = (en) => ({ width: "100%", height: 54, borderRadius: 15, border: "none", fontFamily: "inherit", fontSize: 16, fontWeight: 700, cursor: en && !saving ? "pointer" : "not-allowed", transition: "all .2s", background: saved ? theme.success : en ? `linear-gradient(135deg, ${accent}, ${theme.accent})` : C.input, boxShadow: en && !saved ? `0 8px 24px ${accent}44` : "none", color: en || saved ? "#fff" : C.dim, opacity: saving ? 0.7 : 1 });

      // ── compact entry chips — the grid lives in the bottom sheets below ──
      const catChipsRow = (
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => { setShopSheetOpen(false); setCatSheetOpen(true); }} style={{ ...chip(!!curCat, accent), flex: 1, justifyContent: "center", minWidth: 0 }}>
            <span style={{ fontSize: 15 }}>{catObj ? catObj.icon : "📂"}</span>
            <span style={{ overflow: "hidden", textOverflow: "ellipsis" }}>{curCat || "Category"}</span>
          </button>
          <button onClick={() => { if (curCat) setShopSheetOpen(true); else setCatSheetOpen(true); }} style={{ ...chip(!!curShop, accent), flex: 1, justifyContent: "center", minWidth: 0 }}>
            <span style={{ fontSize: 15 }}>🏪</span>
            <span style={{ overflow: "hidden", textOverflow: "ellipsis" }}>{curShop || "Shop"}</span>
          </button>
        </div>
      );

      const typeRow = (
        <div style={{ display: "flex", gap: 8 }}>
          {Object.entries(EXPENSE_TYPES).map(([key, cfg]) => (
            <button key={key} onClick={() => setCurType(key)} style={{ ...chip(curType === key, cfg.color !== "transparent" ? cfg.color : theme.primary), flex: 1, justifyContent: "center", padding: "7px 8px", fontSize: 12 }}>{cfg.icon} {cfg.label}</button>
          ))}
        </div>
      );

      const tagsRow = (
        <div>
          <button onClick={() => setTagsOpen((o) => !o)} style={{ ...sLbl, marginBottom: tagsOpen ? 7 : 0, background: "none", border: "none", cursor: "pointer", padding: 0, display: "flex", alignItems: "center", gap: 6 }}>
            Tags {(curTags || []).length > 0 && <span style={{ color: accent }}>· {curTags.length}</span>} <span style={{ fontSize: 9 }}>{tagsOpen ? "▴" : "▾"}</span>
          </button>
          {tagsOpen && (
            <div className="cm-slide-in" style={{ marginTop: 4 }}>
              <TagSelector selectedTags={curTags || []} onChange={setCurTags} />
            </div>
          )}
        </div>
      );

      // ── category bottom sheet (full grid + new-category creator) ──
      const catSheet = catSheetOpen && (
        <Modal sheet onClose={() => { setCatSheetOpen(false); setNewCatOpen(false); }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <div style={{ ...sLbl, margin: 0 }}>Category</div>
            <button onClick={() => { setCatSheetOpen(false); setNewCatOpen(false); }} style={closeBtn}>×</button>
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {categories.map((c) => (
              <button key={c.id || c.name} onClick={() => pickCat(c)} style={chip(curCat === c.name, c.color)}>
                <span style={{ fontSize: 15 }}>{c.icon}</span>{c.name}
              </button>
            ))}
            <button onClick={() => { setNewCatOpen((o) => !o); setNewShopOpen(false); }} style={newChip(newCatOpen)}>＋ New</button>
          </div>
          {newCatOpen && (
            <div className="cm-slide-in" style={creatorCard}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
                <span style={{ width: 38, height: 38, borderRadius: 11, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 19, flexShrink: 0, background: `${newCat.color}22`, boxShadow: `inset 0 0 0 1.5px ${newCat.color}` }}>{newCat.icon}</span>
                <input value={newCat.name} onChange={(e) => setNewCat((n) => ({ ...n, name: e.target.value }))} placeholder="Category name" style={fieldInput} />
              </div>
              <div style={{ ...sLbl, marginBottom: 7 }}>Icon</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 13 }}>
                {ADD_EMOJI.map((em) => <button key={em} onClick={() => setNewCat((n) => ({ ...n, icon: em }))} style={emojiBtn(newCat.icon === em)}>{em}</button>)}
              </div>
              <div style={{ ...sLbl, marginBottom: 7 }}>Color</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginBottom: 15 }}>
                {ADD_COLOR.map((col) => <button key={col} onClick={() => setNewCat((n) => ({ ...n, color: col }))} style={swatch(col, newCat.color === col)} />)}
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => setNewCatOpen(false)} style={ghostBtn}>Cancel</button>
                <button onClick={addCategory} disabled={!newCat.name.trim()} style={okBtn(!!newCat.name.trim())}>Add category</button>
              </div>
            </div>
          )}
        </Modal>
      );

      // ── shop bottom sheet (filtered to the picked category + new-shop creator) ──
      const shopSheet = shopSheetOpen && (
        <Modal sheet onClose={() => { setShopSheetOpen(false); setNewShopOpen(false); }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <button onClick={() => { setShopSheetOpen(false); setNewShopOpen(false); setCatSheetOpen(true); }} style={{ border: "none", background: "none", color: C.muted, cursor: "pointer", fontSize: 12.5, fontWeight: 600, padding: 0, fontFamily: "inherit" }}>‹ Categories</button>
            <button onClick={() => { setShopSheetOpen(false); setNewShopOpen(false); }} style={closeBtn}>×</button>
          </div>
          <div style={sLbl}>{catObj ? `${catObj.icon} ${curCat} · shops` : "Pick a category first"}</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {catShops.map((s) => (
              <button key={s.id || s.name} onClick={() => pickShop(s.name)} style={chip(curShop === s.name, accent)}>{s.is_favorite ? "⭐ " : ""}{s.name}</button>
            ))}
            <button onClick={() => { setNewShopOpen((o) => !o); setNewCatOpen(false); }} style={newChip(newShopOpen)}>＋ New shop</button>
          </div>
          {newShopOpen && (
            <div className="cm-slide-in" style={creatorCard}>
              <input value={newShop.name} onChange={(e) => setNewShop((s) => ({ ...s, name: e.target.value }))} placeholder={`New shop in ${curCat}`} style={fieldInput} />
              <label style={{ display: "flex", alignItems: "center", gap: 9, margin: "13px 2px 15px", fontSize: 13.5, color: C.muted, cursor: "pointer" }}>
                <input type="checkbox" checked={newShop.fav} onChange={(e) => setNewShop((s) => ({ ...s, fav: e.target.checked }))} style={{ width: 17, height: 17, accentColor: accent }} />
                ⭐ Mark as favorite (shows first)
              </label>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => setNewShopOpen(false)} style={ghostBtn}>Cancel</button>
                <button onClick={addShop} disabled={!newShop.name.trim()} style={okBtn(!!newShop.name.trim())}>Add shop</button>
              </div>
            </div>
          )}
        </Modal>
      );

      // ── non-blocking duplicate warning: Add anyway / View / Cancel ──
      const dupModal = dupDialog && (() => {
        const cur = dupDialog.queue[dupDialog.idx];
        const ex = cur.existing;
        const exType = EXPENSE_TYPES[ex.expense_type || "normal"] || EXPENSE_TYPES.normal;
        const dlgBtn = { flex: 1, padding: "10px 6px", borderRadius: 9, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 600, fontFamily: "inherit" };
        return (
          <Modal onClose={() => dupAdvance(false)}>
            <h4 style={{ color: theme.warning, fontSize: 14, margin: "0 0 8px" }}>⚠ Possible duplicate{dupDialog.queue.length > 1 ? ` · ${dupDialog.idx + 1} of ${dupDialog.queue.length}` : ""}</h4>
            <p style={{ fontSize: 13, color: theme.text, margin: "0 0 12px", lineHeight: 1.55 }}>
              <b>{fmt(cur.record.amount)}</b> at <b>{cur.record.shop}</b> already logged on <b>{cur.record.date}</b>.
            </p>
            {dupDialog.view && (
              <div className="cm-slide-in" style={{ background: theme.inputBg, borderRadius: 10, padding: 12, marginBottom: 12 }}>
                <div style={{ fontSize: 10, fontWeight: 600, letterSpacing: 1, textTransform: "uppercase", color: theme.textDim, marginBottom: 8 }}>Existing entry</div>
                {[["Date", ex.date], ["Shop", ex.shop], ["Amount", fmt(ex.amount)], ["Type", `${exType.icon ? exType.icon + " " : ""}${exType.label}`], ["Notes", ex.notes || "—"]].map(([k, v]) => (
                  <div key={k} style={{ display: "flex", justifyContent: "space-between", gap: 10, fontSize: 12, padding: "3px 0" }}>
                    <span style={{ color: theme.textMuted }}>{k}</span>
                    <span style={{ color: "#fff", fontWeight: 500, textAlign: "right" }}>{v}</span>
                  </div>
                ))}
              </div>
            )}
            <div style={{ display: "flex", gap: 6 }}>
              <button onClick={() => dupAdvance(false)} style={{ ...dlgBtn, background: "transparent", color: theme.textMuted, boxShadow: `inset 0 0 0 1px ${theme.cardBorder}` }}>Cancel</button>
              <button onClick={() => setDupDialog((d) => ({ ...d, view: !d.view }))} style={{ ...dlgBtn, background: theme.inputBg, color: "#fff", boxShadow: `inset 0 0 0 1px ${theme.cardBorder}` }}>{dupDialog.view ? "Hide" : "View"}</button>
              <button onClick={() => dupAdvance(true)} style={{ ...dlgBtn, background: `linear-gradient(135deg, ${theme.primary}, ${theme.accent})`, color: "#fff" }}>Add anyway</button>
            </div>
          </Modal>
        );
      })();

      const keypad = (h) => (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 8 }}>
          {["7","8","9","4","5","6","1","2","3","00","0","del"].map((k) => (
            <button key={k} className="cm-chip" onClick={() => press(k)} style={{ height: h, borderRadius: 12, border: "none", cursor: "pointer", fontFamily: "inherit", fontSize: k === "del" ? 18 : 22, fontWeight: 600, color: k === "del" ? C.muted : "#fff", background: theme.inputBg, boxShadow: `inset 0 0 0 1px ${C.border}` }}>{k === "del" ? "⌫" : k}</button>
          ))}
        </div>
      );

      // ── per-entry editable review list (multi modes): tap a row to edit it inline ──
      const reviewList = (
        <div style={{ marginTop: 2, marginBottom: 16 }}>
          {isSame && (
            <div style={{ marginBottom: 16, display: "flex", flexDirection: "column", gap: 12 }}>
              <div style={{ ...sLbl, margin: 0 }}>Shop · applies to every day</div>
              {catChipsRow}
              {typeRow}
              {tagsRow}
            </div>
          )}
          <div style={sLbl}>Entries · {rows.length}{rowsTotal > 0 ? ` · ${fmt(rowsTotal)}` : ""}</div>
          {rows.length === 0 ? (
            <div style={{ padding: "18px 14px", borderRadius: 12, background: C.card, boxShadow: `inset 0 0 0 1px ${C.border}`, fontSize: 12.5, color: C.dim, textAlign: "center" }}>
              Pick days with the date control above — one editable entry per day shows up here.
            </div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {(() => {
                const groups = [];
                rows.forEach((r, i) => {
                  let g = groups.find((g) => g.date === r.date);
                  if (!g) { g = { date: r.date, items: [] }; groups.push(g); }
                  g.items.push({ r, i });
                });
                return groups.map((g) => (
                  <div key={g.date} style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "2px 2px 0" }}>
                      <span style={{ fontSize: 11, fontWeight: 700, color: C.muted }}>{whenLabel(g.date)}</span>
                      {g.items.length > 1 && <span style={{ fontSize: 10, fontWeight: 700, color: C.dim, background: C.input, borderRadius: 6, padding: "1px 6px" }}>{g.items.length} entries</span>}
                      <span style={{ flex: 1 }} />
                      <button onClick={() => addDayRow(g.date)} style={{ border: "none", background: "none", color: theme.primary, cursor: "pointer", fontSize: 11.5, fontWeight: 700, padding: "2px 4px" }}>＋ another</button>
                    </div>
                    {g.items.map(({ r, i }) => {
                      const rCat = rowCatOf(r), rShop = rowShopOf(r);
                      const rc = categories.find((c) => c.name === rCat);
                      const expanded = i === activeIdx;
                      const ringColor = rc ? rc.color : theme.primary;
                      const rType = isSame ? etype : (r.type || "normal");
                      const dup = rowDup(r);
                      return (
                        <div key={r.id} className={removingRow === i ? "cm-fade-out" : undefined} style={{ borderRadius: 12, background: expanded ? `${ringColor}14` : C.input, boxShadow: expanded ? `inset 0 0 0 1.5px ${ringColor}` : `inset 0 0 0 1px ${dup ? `${theme.warning}88` : C.border}` }}>
                          <div onClick={() => setActiveRow(expanded ? -1 : i)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", cursor: "pointer" }}>
                            <span style={{ fontSize: 10.5, fontWeight: 700, color: expanded ? "#fff" : C.muted, minWidth: 56 }}>{whenLabel(r.date)}</span>
                            <span style={{ width: 26, height: 26, borderRadius: 8, background: `${rc ? rc.color : "#888"}22`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, flexShrink: 0 }}>{rc ? rc.icon : "▫"}</span>
                            <span style={{ flex: 1, minWidth: 0, fontSize: 13, color: rShop ? C.text : C.dim, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{rShop || (isSame ? "set the shop above" : "tap to set shop")}</span>
                            {EXPENSE_TYPES[rType]?.icon && <span style={{ fontSize: 12 }}>{EXPENSE_TYPES[rType].icon}</span>}
                            {dup && <span title={`Possible duplicate — ${fmt(dup.amount)} at ${dup.shop} already logged on ${dup.date}`} style={{ fontSize: 13, color: theme.warning }}>⚠</span>}
                            <span style={{ fontSize: 13.5, fontWeight: 700, color: r.amount ? "#fff" : C.dim }}>{r.amount ? fmt(Number(r.amount)) : CUR.symbol + "–"}</span>
                            <button onClick={(e) => { e.stopPropagation(); removeRow(i); }} style={{ border: "none", background: "none", color: C.dim, cursor: "pointer", fontSize: 17, lineHeight: 1, padding: "0 2px" }}>×</button>
                          </div>
                          {expanded && (
                            <div className="cm-slide-in" style={{ padding: "2px 12px 12px", display: "flex", flexDirection: "column", gap: 10 }}>
                              <input type="date" value={r.date} onChange={(e) => e.target.value && updRow({ date: e.target.value })} style={{ ...fieldInput, colorScheme: "dark" }} />
                              {isDiff && catChipsRow}
                              {keypad(42)}
                              {isDiff && typeRow}
                              {isDiff && tagsRow}
                              {dup && (
                                <div style={{ fontSize: 11.5, fontWeight: 600, color: theme.warning }}>⚠ {fmt(dup.amount)} at {dup.shop} already logged on {dup.date}</div>
                              )}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                ));
              })()}
            </div>
          )}
          {rows.length > 0 && (
            <div style={{ marginTop: 12, fontSize: 11, color: C.dim, textAlign: "center" }}>{isSame ? "Tap a day to edit its amount or date" : "Tap a row to set its shop, amount, date & type"}</div>
          )}
        </div>
      );

      const recentBlock = recentEntries && recentEntries.length > 0 ? (
        <div style={{ marginTop: 22 }}>
          <div style={sLbl}>Recent · tap to repeat</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
            {recentEntries.slice(0, 5).map((e) => {
              const ec = categories.find((c) => c.name === e.category);
              return (
                <button key={e.id} onClick={() => repeat(e)} style={{ display: "flex", alignItems: "center", gap: 11, padding: "10px 4px", background: "none", border: "none", borderBottom: `1px solid ${C.border}`, cursor: "pointer", textAlign: "left", width: "100%" }}>
                  <span style={{ width: 30, height: 30, borderRadius: 9, background: `${ec ? ec.color : "#888"}22`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15, flexShrink: 0 }}>{ec ? ec.icon : "📦"}</span>
                  <span style={{ flex: 1, minWidth: 0 }}>
                    <span style={{ display: "block", fontSize: 13.5, color: C.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.shop}</span>
                    <span style={{ display: "block", fontSize: 10.5, color: C.dim }}>{e.category} · {whenLabel(e.date)}</span>
                  </span>
                  <span style={{ fontSize: 13.5, fontWeight: 700, color: "#fff" }}>{fmt(e.amount)}</span>
                  <span style={{ color: C.dim, fontSize: 15, marginLeft: 2 }}>↻</span>
                </button>
              );
            })}
          </div>
        </div>
      ) : null;
      return (
        <div style={{ maxWidth: 460, margin: "0 auto", position: "relative" }}>
          {toast && (
            <div className="cm-toast" style={{ position: "fixed", top: 16, left: "50%", transform: "translateX(-50%)", zIndex: 999, padding: "12px 20px", borderRadius: 10, fontSize: 13, fontWeight: 500, background: toast.type === "success" ? theme.success : theme.danger, color: "#fff" }}>
              {toast.type === "success" ? "✅" : "❌"} {toast.msg}
            </div>
          )}
          {flash && (
            <div className="cm-fade" style={{ position: "fixed", inset: 0, zIndex: 1000, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14, background: "rgba(8,11,22,0.8)", backdropFilter: "blur(6px)" }}>
              <div style={{ width: 76, height: 76, borderRadius: 38, background: theme.success, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <svg width="38" height="38" viewBox="0 0 38 38" fill="none"><path d="M10 20l6 6 12-13" stroke="#fff" strokeWidth="3.4" strokeLinecap="round" strokeLinejoin="round" /></svg>
              </div>
              <div style={{ fontSize: 20, fontWeight: 700, color: "#fff" }}>Added {flash}</div>
            </div>
          )}

          {/* batch toggle — the 3-mode switcher lives behind it */}
          <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 4 }}>
            <button onClick={() => { if (batchOpen && isMulti) switchMode("quick"); setBatchOpen((o) => !o); }} style={{ border: "none", background: "none", color: batchOpen ? theme.primary : C.muted, cursor: "pointer", fontFamily: "inherit", fontSize: 11.5, fontWeight: 600, padding: "2px 4px", whiteSpace: "nowrap", display: "inline-flex", alignItems: "center", gap: 4 }}>Batch add<Icon name="chevronDown" size={12} style={{ transform: batchOpen ? "rotate(180deg)" : "none", transition: "transform .15s" }}/></button>
          </div>
          {batchOpen && (
          <div className="cm-slide-in" style={{ display: "flex", gap: 3, padding: 3, background: theme.headerBg, borderRadius: 12, border: `1px solid ${C.border}`, marginTop: 2 }}>
            {[{ k: "quick", label: "Quick", sub: "one entry" }, { k: "same", label: "Same shop", sub: "many days" }, { k: "list", label: "Different", sub: "many shops" }].map((m) => (
              <button key={m.k} onClick={() => switchMode(m.k)} style={{ flex: 1, padding: "6px 4px", borderRadius: 9, border: "none", cursor: "pointer", fontFamily: "inherit", background: mode === m.k ? theme.primaryGlow : "transparent", boxShadow: mode === m.k ? `inset 0 0 0 1px ${theme.primary}` : "none" }}>
                <div style={{ fontSize: 12.5, fontWeight: 700, color: mode === m.k ? "#fff" : C.muted }}>{m.label}</div>
                <div style={{ fontSize: 8.5, color: mode === m.k ? "rgba(255,255,255,0.7)" : C.dim, marginTop: 1 }}>{m.sub}</div>
              </button>
            ))}
          </div>
          )}

          {/* date control — on top, all modes; single date for Quick, multi-date otherwise */}
          <div style={{ marginTop: 12 }}>
            <button onClick={() => (calOpen ? setCalOpen(false) : openCal())} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "11px 14px", borderRadius: 12, border: "none", cursor: "pointer", fontFamily: "inherit", background: C.input, boxShadow: `inset 0 0 0 1px ${C.border}` }}>
              <span style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13.5, fontWeight: 600, color: "#fff" }}><Icon name="calendar" size={15}/>{dateLabel}</span>
              <span style={{ color: C.muted, fontSize: 11, display: "inline-flex", alignItems: "center" }}><Icon name="chevronDown" size={14} style={{ transform: calOpen ? "rotate(180deg)" : "none", transition: "transform .15s" }}/></span>
            </button>
            {calOpen && (
              <div className="cm-slide-in" style={{ marginTop: 8 }}>
                <AddCalSheet dates={dates} setDates={setDates} today={today} yest={yest} C={C} chip={chip} theme={theme}
                  single={!isMulti} confirmLabel={isMulti ? "Use these days" : "Done"}
                  initialCounts={rows.reduce((m, r) => { m[r.date] = (m[r.date] || 0) + 1; return m; }, {})}
                  onConfirm={(counts) => applyDates(counts)}
                  onClose={() => setCalOpen(false)} />
              </div>
            )}
          </div>

          {/* amount hero — tap to open the keypad (quick only) */}
          {!isMulti && (
            <div onClick={() => setPadOpen((o) => !o)} style={{ padding: "14px 0 12px", textAlign: "center", cursor: "pointer" }}>
              <div style={{ fontSize: 50, fontWeight: 700, letterSpacing: -2, lineHeight: 1, color: amt > 0 ? "#fff" : C.dim, display: "inline-flex", alignItems: "center", gap: 8, padding: "2px 14px", borderRadius: 14, boxShadow: padOpen ? `inset 0 0 0 1.5px ${accent}66` : "none", transition: "box-shadow .15s" }}>{amt > 0 ? fmt(amt) : CUR.symbol + "0"}</div>
              <div style={{ fontSize: 12.5, color: C.muted, marginTop: 8, minHeight: 18 }}>
                {curCat && curShop ? <span><span style={{ color: catObj.color }}>{catObj.icon} {curCat}</span> · {curShop}{!padOpen && amt === 0 ? <span style={{ color: C.dim }}> · tap {CUR.symbol} to enter amount</span> : ""}</span>
                  : curCat ? <span style={{ color: catObj.color }}>{catObj.icon} {curCat} — pick a shop</span>
                  : "Tap " + CUR.symbol + " for the keypad · pick a category"}
              </div>
            </div>
          )}

          {/* live duplicate hint — date + shop + amount all match an existing entry */}
          {quickDup && (
            <div className="cm-fade" style={{ display: "flex", justifyContent: "center", marginBottom: 10 }}>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "5px 12px", borderRadius: 10, fontSize: 11.5, fontWeight: 600, color: theme.warning, background: `${theme.warning}1a`, boxShadow: `inset 0 0 0 1px ${theme.warning}55` }}>
                ⚠ possible duplicate — {fmt(quickDup.amount)} at {quickDup.shop} already logged
              </span>
            </div>
          )}

          {/* numpad — only when the amount is tapped */}
          {padOpen && !isMulti && (
            <div className="cm-sheet-in" style={{ padding: "0 0 12px" }}>{keypad(48)}</div>
          )}

          {/* entry body */}
          <div>
            {isMulti && reviewList}
            {mode === "quick" && (
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                {catChipsRow}
                <div>
                  <button onClick={() => setMoreOpen((o) => !o)} style={{ border: "none", background: "none", color: (etype !== "normal" || etags.length > 0) ? theme.primary : C.dim, cursor: "pointer", fontFamily: "inherit", fontSize: 11.5, fontWeight: 600, padding: 0, whiteSpace: "nowrap", display: "inline-flex", alignItems: "center", gap: 4 }}>More options{etype !== "normal" ? ` · ${EXPENSE_TYPES[etype].label}` : ""}{etags.length > 0 ? ` · ${etags.length} tag${etags.length > 1 ? "s" : ""}` : ""}<Icon name="chevronDown" size={12} style={{ transform: moreOpen ? "rotate(180deg)" : "none", transition: "transform .15s" }}/></button>
                  {moreOpen && (
                    <div className="cm-slide-in" style={{ display: "flex", flexDirection: "column", gap: 12, marginTop: 10 }}>
                      {typeRow}
                      {tagsRow}
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>

          {/* action bar */}
          <div style={{ padding: "6px 0 24px" }}>
            {!isMulti ? (
              <button onClick={save} disabled={!valid || saving} style={ctaStyle(valid)}>
                {saving ? "Saving…" : saved ? "✓ Saved" : valid ? `Add ${fmt(amt)} · ${dateLabel}` : "Enter amount, category & shop"}
              </button>
            ) : (
              <button onClick={saveMulti} disabled={!filledEntries.length || saving} style={ctaStyle(!!filledEntries.length)}>
                {saving ? "Saving…" : saved ? "✓ Saved" : filledEntries.length ? `Save all (${filledEntries.length}) · ${fmt(filledEntries.reduce((s, e) => s + Number(e.r.amount), 0))}${flaggedCount ? ` · ⚠${flaggedCount}` : ""}` : (isSame ? "Set a shop & amounts" : "Fill in shops & amounts")}
              </button>
            )}
          </div>

          {recentBlock}
          {catSheet}
          {shopSheet}
          {dupModal}
        </div>
      );
    }

    // compact multi-date picker sheet for the Add screen
    function AddCalSheet({ dates, setDates, today, yest, C, chip, theme, onClose, onConfirm = () => {}, initialCounts = {}, confirmLabel = "Done", single = false }) {
      const [view, setView] = useState({ y: today.getFullYear(), m: today.getMonth() });
      const [counts, setCounts] = useState(initialCounts);
      const dim = new Date(view.y, view.m + 1, 0).getDate();
      const fd = (new Date(view.y, view.m, 1).getDay() + 6) % 7;
      const isoOf = (day) => `${view.y}-${String(view.m + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const total = Object.values(counts).reduce((a, b) => a + b, 0);
      const fmtDay = (s) => `${MONTHS_SHORT[Number(s.slice(5, 7))]} ${Number(s.slice(8, 10))}`;
      const bump = (s, delta) => setCounts((c) => {
        const n = (c[s] || 0) + delta;
        const next = { ...c };
        if (n <= 0) delete next[s]; else next[s] = n;
        return next;
      });
      const toggle = (day) => {
        const s = isoOf(day);
        if (single) { setDates([s]); onClose(); return; }
        bump(s, +1);
      };
      const quick = (d) => { const s = ymdLocal(d); if (single) { setDates([s]); onClose(); return; } bump(s, +1); };
      const confirm = () => { if (!single) onConfirm(counts); onClose(); };
      const stepBtn = { width: 26, height: 26, borderRadius: 8, border: "none", background: C.input, color: "#fff", fontSize: 15, fontWeight: 700, cursor: "pointer", lineHeight: 1 };
      return (
        <div style={{ background: C.card, borderRadius: 16, padding: 14, boxShadow: `inset 0 0 0 1px ${C.border}` }}>
          <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
            <button onClick={() => quick(today)} style={{ ...chip(single ? (dates.length === 1 && dates[0] === ymdLocal(today)) : (counts[ymdLocal(today)] > 0), theme.primary), flex: 1, justifyContent: "center" }}>Today</button>
            <button onClick={() => quick(yest)} style={{ ...chip(single ? (dates.length === 1 && dates[0] === ymdLocal(yest)) : (counts[ymdLocal(yest)] > 0), theme.primary), flex: 1, justifyContent: "center" }}>Yesterday</button>
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
            <button onClick={() => setView((v) => v.m === 0 ? { y: v.y - 1, m: 11 } : { ...v, m: v.m - 1 })} style={{ background: C.input, border: "none", color: C.muted, width: 28, height: 28, borderRadius: 8, cursor: "pointer", display: "inline-flex", alignItems: "center", justifyContent: "center" }}><Icon name="chevronLeft" size={15}/></button>
            <span style={{ fontSize: 13, fontWeight: 600, color: "#fff" }}>{MONTHS_FULL[view.m]} {view.y}</span>
            <button onClick={() => setView((v) => v.m === 11 ? { y: v.y + 1, m: 0 } : { ...v, m: v.m + 1 })} style={{ background: C.input, border: "none", color: C.muted, width: 28, height: 28, borderRadius: 8, cursor: "pointer", display: "inline-flex", alignItems: "center", justifyContent: "center" }}><Icon name="chevronRight" size={15}/></button>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 3 }}>
            {["M","T","W","T","F","S","S"].map((d, i) => <div key={i} style={{ textAlign: "center", fontSize: 9, color: C.dim, padding: 2 }}>{d}</div>)}
            {Array.from({ length: fd }).map((_, i) => <div key={"e" + i} />)}
            {Array.from({ length: dim }).map((_, i) => {
              const day = i + 1; const s = isoOf(day);
              const cnt = single ? 0 : (counts[s] || 0);
              const sel = single ? dates.includes(s) : cnt > 0;
              return (
                <button key={day} onClick={() => toggle(day)} style={{ position: "relative", aspectRatio: "1", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 12, background: sel ? theme.primary : "transparent", color: sel ? "#fff" : C.text, fontWeight: sel ? 700 : 400 }}>
                  {day}
                  {cnt > 1 && <span style={{ position: "absolute", top: 1, right: 2, minWidth: 13, height: 13, borderRadius: 7, background: "#fff", color: theme.primary, fontSize: 8.5, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 2px" }}>{cnt}</span>}
                </button>
              );
            })}
          </div>
          {!single && total > 0 && (
            <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 12 }}>
              {Object.keys(counts).sort().map((s) => (
                <div key={s} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ flex: 1, fontSize: 12.5, color: C.text }}>{fmtDay(s)}</span>
                  <button onClick={() => bump(s, -1)} style={stepBtn}>−</button>
                  <span style={{ minWidth: 20, textAlign: "center", fontSize: 13.5, fontWeight: 700, color: "#fff" }}>{counts[s]}</span>
                  <button onClick={() => bump(s, 1)} style={stepBtn}>＋</button>
                </div>
              ))}
            </div>
          )}
          <button onClick={confirm} disabled={!single && total === 0} style={{ width: "100%", marginTop: 10, height: 38, borderRadius: 11, border: "none", background: (single ? dates.length : total) ? theme.primary : C.input, color: "#fff", fontSize: 13, fontWeight: 600, cursor: (!single && total === 0) ? "default" : "pointer", opacity: (!single && total === 0) ? 0.55 : 1, fontFamily: "inherit" }}>
            {confirmLabel}{single ? (dates.length > 1 ? ` · ${dates.length} days` : "") : (total > 0 ? ` · ${total} entr${total !== 1 ? "ies" : "y"}` : "")}
          </button>
        </div>
      );
    }

    // ═══════════════════════════════════════════
    //  SETTINGS VIEW (Categories + Tags + Recurring)
    // ═══════════════════════════════════════════
    function SettingsView({ allExpenses }) {
      const { theme, themeName, changeTheme, inputStyle, labelStyle, supabase, fetchData, categories, tags, shops, getCatIcon } = useTheme();
      const [activeTab, setActiveTab] = useState("categories");
      const [toast, setToast] = useState(null);

      // Category state
      const [editingCat, setEditingCat] = useState(null);
      const [newCat, setNewCat] = useState({ name: "", icon: "📦", color: "#8b5cf6" });
      const [showAddCat, setShowAddCat] = useState(false);

      // Tag state
      const [editingTag, setEditingTag] = useState(null);
      const [newTag, setNewTag] = useState({ name: "", icon: "🏷️", color: "#6b7280" });
      const [showAddTag, setShowAddTag] = useState(false);

      // Shop state
      const [selectedShopCategory, setSelectedShopCategory] = useState("");
      const [editingShop, setEditingShop] = useState(null);
      const [newShop, setNewShop] = useState({ name: "", category: "", is_favorite: false });
      const [showAddShop, setShowAddShop] = useState(false);

      const EMOJI_OPTIONS = ["🛒","🏪","🌏","🍜","📦","🧹","🍕","☕","🚗","💊","🎮","📚","👕","🏠","💡","🎬","✈️","🎁","💰","🏥","🍎","🍇","🚃","🏷️","👨‍👩‍👧","📄","🛍️"];
      const COLOR_OPTIONS = ["#2563eb","#f59e0b","#10b981","#ef4444","#8b5cf6","#ec4899","#06b6d4","#84cc16","#f97316","#6366f1","#64748b","#a855f7"];

      const getCategoryUsage = (n) => allExpenses.filter(e => e.category === n).length;
      const getTagUsage = (n) => allExpenses.filter(e => (e.tags||"").split(",").includes(n)).length;
      const getShopUsage = (n) => allExpenses.filter(e => e.shop === n).length;

      // Get shops for selected category
      const filteredShops = useMemo(() => {
        if (!selectedShopCategory) return shops;
        return shops.filter(s => s.category === selectedShopCategory);
      }, [shops, selectedShopCategory]);

      // Category handlers
      const handleAddCategory = async () => {
        if (!newCat.name.trim()) { showToast("error","Enter name"); return; }
        const { error } = await supabase.from("cost_management_categories").insert({ name: newCat.name.trim(), icon: newCat.icon, color: newCat.color, sort_order: categories.length + 1 });
        if (error) showToast("error", error.message.includes("duplicate") ? "Exists" : error.message);
        else { showToast("success","Added"); setNewCat({ name: "", icon: "📦", color: "#8b5cf6" }); setShowAddCat(false); fetchData(); }
      };
      const handleUpdateCategory = async () => {
        if (!editingCat?.name.trim()) return;
        const { error } = await supabase.from("cost_management_categories").update({ name: editingCat.name, icon: editingCat.icon, color: editingCat.color }).eq("id", editingCat.id);
        if (!error && editingCat.originalName !== editingCat.name) {
          await supabase.from("cost_management_expenses").update({ category: editingCat.name }).eq("category", editingCat.originalName);
          await supabase.from("cost_management_shops").update({ category: editingCat.name }).eq("category", editingCat.originalName);
        }
        if (error) showToast("error", error.message); else { showToast("success","Updated"); setEditingCat(null); fetchData(); }
      };

      // Tag handlers
      const handleAddTag = async () => {
        if (!newTag.name.trim()) { showToast("error","Enter name"); return; }
        const { error } = await supabase.from("cost_management_tags").insert({ name: newTag.name.trim(), icon: newTag.icon, color: newTag.color, sort_order: tags.length + 1 });
        if (error) showToast("error", error.message.includes("duplicate") ? "Exists" : error.message);
        else { showToast("success","Added"); setNewTag({ name: "", icon: "🏷️", color: "#6b7280" }); setShowAddTag(false); fetchData(); }
      };
      const handleUpdateTag = async () => {
        if (!editingTag?.name.trim()) return;
        const { error } = await supabase.from("cost_management_tags").update({ name: editingTag.name, icon: editingTag.icon, color: editingTag.color }).eq("id", editingTag.id);
        if (!error && editingTag.originalName !== editingTag.name) {
          const { data: expenses } = await supabase.from("cost_management_expenses").select("id, tags").like("tags", `%${editingTag.originalName}%`);
          for (const exp of (expenses || [])) {
            const newTags = (exp.tags || "").split(",").map(t => t === editingTag.originalName ? editingTag.name : t).join(",");
            await supabase.from("cost_management_expenses").update({ tags: newTags }).eq("id", exp.id);
          }
        }
        if (error) showToast("error", error.message); else { showToast("success","Updated"); setEditingTag(null); fetchData(); }
      };
      const handleDeleteTag = async (id) => {
        const { error } = await supabase.from("cost_management_tags").delete().eq("id", id);
        if (error) showToast("error", error.message); else { showToast("success","Deleted"); fetchData(); }
      };

      // Shop handlers
      const handleAddShop = async () => {
        if (!newShop.name.trim() || !newShop.category) { showToast("error","Enter name and category"); return; }
        const { error } = await supabase.from("cost_management_shops").insert({ 
          region: CUR.code, name: newShop.name.trim(), 
          category: newShop.category, 
          is_favorite: newShop.is_favorite 
        });
        if (error) showToast("error", error.message.includes("duplicate") ? "Shop exists" : error.message);
        else { showToast("success","Added"); setNewShop({ name: "", category: selectedShopCategory || "", is_favorite: false }); setShowAddShop(false); fetchData(); }
      };
      const handleUpdateShop = async () => {
        if (!editingShop?.name.trim()) return;
        const { error } = await supabase.from("cost_management_shops").update({ 
          name: editingShop.name, 
          category: editingShop.category,
          is_favorite: editingShop.is_favorite 
        }).eq("id", editingShop.id);
        // Update expenses if shop name changed
        if (!error && editingShop.originalName !== editingShop.name) {
          await supabase.from("cost_management_expenses").update({ shop: editingShop.name }).eq("shop", editingShop.originalName);
        }
        if (error) showToast("error", error.message); else { showToast("success","Updated"); setEditingShop(null); fetchData(); }
      };
      const handleDeleteShop = async (id) => {
        const { error } = await supabase.from("cost_management_shops").delete().eq("id", id);
        if (error) showToast("error", error.message); else { showToast("success","Deleted"); fetchData(); }
      };
      const handleToggleFavorite = async (shop) => {
        await supabase.from("cost_management_shops").update({ is_favorite: !shop.is_favorite }).eq("id", shop.id);
        fetchData();
      };

      const showToast = (type, msg) => { setToast({ type, msg }); setTimeout(() => setToast(null), 3000); };

      const tabStyle = (active) => ({
        padding:"8px 14px",fontSize:11,fontWeight:active?600:400,cursor:"pointer",
        background:active?theme.inputBg:"transparent",color:active?theme.text:theme.textMuted,
        border:"none",borderBottom:active?`2px solid ${theme.primary}`:"2px solid transparent",
      });

      return (
        <div style={{maxWidth:680,margin:"0 auto"}}>
          {toast && (
            <div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",zIndex:999,padding:"10px 20px",borderRadius:10,fontSize:12,fontWeight:500,background:toast.type==="success"?theme.success:theme.danger,color:"#fff"}}>
              {toast.type==="success"?"✅":"❌"} {toast.msg}
            </div>
          )}

          <div style={{display:"flex",alignItems:"center",gap:8,marginTop:10,flexWrap:"wrap"}}>
            <span style={{fontSize:11,fontWeight:600,color:theme.textMuted,textTransform:"uppercase",letterSpacing:0.5,marginRight:2}}>Theme</span>
            {THEME_KEYS.map(key => (
              <button key={key} onClick={() => changeTheme(key)} title={THEMES[key].name} style={{width:22,height:22,borderRadius:"50%",border:"none",cursor:"pointer",background:THEMES[key].primary,boxShadow:themeName===key?"0 0 0 2px #fff":`0 0 0 1px ${theme.cardBorder}`}}></button>
            ))}
          </div>
          <div style={{display:"flex",borderBottom:`1px solid ${theme.cardBorder}`,marginBottom:16,marginTop:8,overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
            <button onClick={() => setActiveTab("categories")} style={tabStyle(activeTab==="categories")}><span style={{display:"inline-flex",alignItems:"center",gap:6}}><Icon name="folder" size={14}/>Categories</span></button>
            <button onClick={() => setActiveTab("shops")} style={tabStyle(activeTab==="shops")}><span style={{display:"inline-flex",alignItems:"center",gap:6}}><Icon name="store" size={14}/>Shops</span></button>
            <button onClick={() => setActiveTab("tags")} style={tabStyle(activeTab==="tags")}><span style={{display:"inline-flex",alignItems:"center",gap:6}}><Icon name="tag" size={14}/>Tags</span></button>
            <button onClick={() => setActiveTab("rules")} style={tabStyle(activeTab==="rules")}><span style={{display:"inline-flex",alignItems:"center",gap:6}}><Icon name="repeat" size={14}/>Rules</span></button>
            <button onClick={() => setActiveTab("triggers")} style={tabStyle(activeTab==="triggers")}><span style={{display:"inline-flex",alignItems:"center",gap:6}}><Icon name="pin" size={14}/>Triggers</span></button>
          </div>

          {activeTab === "rules" && <RecurringView />}

          {activeTab === "triggers" && <LocationTriggersView />}

          {/* CATEGORIES TAB */}
          {activeTab === "categories" && (
            <div style={{background:theme.cardBg,border:`1px solid ${theme.cardBorder}`,borderRadius:14,padding:"16px"}}>
              {categories.map(cat => (
                <div key={cat.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 12px",background:theme.inputBg,borderRadius:8,marginBottom:8}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0,flex:1}}>
                    <span style={{fontSize:20}}>{cat.icon}</span>
                    <div style={{minWidth:0}}>
                      <div style={{color:theme.text,fontSize:13,fontWeight:500,display:"flex",alignItems:"center",gap:7}}>{cat.name}<span style={{width:9,height:9,borderRadius:3,background:cat.color,display:"inline-block",flexShrink:0}}/></div>

                    </div>
                    <div style={{width:0,height:0,display:"none"}}/>
                  </div>
                  <button onClick={() => setEditingCat({ ...cat, originalName: cat.name })} style={{background:"none",border:"none",cursor:"pointer",padding:"3px 5px",color:theme.textMuted,display:"inline-flex"}}><Icon name="pencil" size={15}/></button>

              {!showAddCat ? (

                <select value={selectedShopCategory} onChange={e => setSelectedShopCategory(e.target.value)}

            <div style={{background:theme.cardBg,border:`1px solid ${theme.cardBorder}`,borderRadius:14,padding:"16px"}}>
              <p style={{fontSize:11,color:theme.textDim,marginTop:0,marginBottom:12}}>Tags help categorize what expenses are for (Food, Transport, Travel, etc.)</p>

                <div key={tag.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 12px",background:theme.inputBg,borderRadius:8,marginBottom:8}}>

                    </div>
                    <div style={{width:0,height:0,display:"none"}}/>
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    <button onClick={() => setEditingTag({ ...tag, originalName: tag.name })} style={{background:"none",border:"none",cursor:"pointer",padding:"3px 5px",color:theme.textMuted,display:"inline-flex"}}><Icon name="pencil" size={15}/></button>
                    <button onClick={() => handleDeleteTag(tag.id)} style={{background:"none",border:"none",cursor:"pointer",padding:"3px 5px",color:theme.danger,display:"inline-flex"}}><Icon name="trash" size={15}/></button>
                  </div>
                </div>
              ))}
              {!showAddTag ? (
                <button onClick={() => setShowAddTag(true)} style={{width:"100%",padding:"10px",borderRadius:8,border:`2px dashed ${theme.warning}50`,background:"transparent",color:theme.warning,cursor:"pointer",fontSize:12}}>+ Add Tag</button>
              ) : (
                <ItemForm item={newTag} setItem={setNewTag} onSave={handleAddTag} onCancel={() => setShowAddTag(false)} emojis={EMOJI_OPTIONS} colors={COLOR_OPTIONS} saveLabel="Add" />
              )}
            </div>
          )}

          {/* Edit Category Modal */}
          {editingCat && (
            <Modal onClose={() => setEditingCat(null)}>
              <h5 style={{color:"#fff",margin:"0 0 12px 0",fontSize:14}}>Edit Category</h5>
              <ItemForm item={editingCat} setItem={setEditingCat} onSave={handleUpdateCategory} onCancel={() => setEditingCat(null)} emojis={EMOJI_OPTIONS} colors={COLOR_OPTIONS} saveLabel="Save" />
            </Modal>
          )}

          {/* Edit Tag Modal */}
          {editingTag && (
            <Modal onClose={() => setEditingTag(null)}>
              <h5 style={{color:"#fff",margin:"0 0 12px 0",fontSize:14}}>Edit Tag</h5>

    // ═══════════════════════════════════════════
    //  SHARED EXPENSE MUTATIONS HOOK (edit + delete)
    //  Single source of truth for editing/deleting an expense. Owns its own
    //  edit/delete modals + toast and pulls everything it needs from context,
    //  so any view (History, Calendar day panel) can reuse it by dropping
    //  {modals} into its render. onChange() fires after a successful write.
    // ═══════════════════════════════════════════
    function useExpenseMutations({ onChange }) {
      const { theme, inputStyle, supabase, categories, tags, getCatIcon } = useTheme();
      const [editingTx, setEditingTx] = useState(null);
      const [editForm, setEditForm] = useState({});
      const [deletingTx, setDeletingTx] = useState(null);
      const [toast, setToast] = useState(null);

      const openEdit = (tx) => { setEditForm({ ...tx, tagsArray: (tx.tags||"").split(",").filter(Boolean) }); setEditingTx(tx); };
      const requestDelete = (tx) => setDeletingTx(tx);

      // Canonical INSERT path for one-off entries (Fare Calc, Shop Capture) —
      // funnels every new-feature insert through this hook so there is exactly
      // one write path outside the recurring engine's dueAdd.
      const insertExpense = async (record) => {
        const { error } = await supabase.from("cost_management_expenses").insert(record);
        if (error) { setToast({ type: "error", msg: error.message }); setTimeout(() => setToast(null), 3000); return { ok: false }; }
        setToast({ type: "success", msg: "Added" }); setTimeout(() => setToast(null), 3000); onChange();
        return { ok: true };
      };

      const handleUpdate = async () => {
        const { error } = await supabase.from("cost_management_expenses")
          .update({ amount: Number(editForm.amount), date: editForm.date, category: editForm.category, shop: editForm.shop, notes: editForm.notes, expense_type: editForm.expense_type, tags: (editForm.tagsArray||[]).join(",") })
          .eq("id", editForm.id);
        if (error) { setToast({ type: "error", msg: error.message }); }
        else { setToast({ type: "success", msg: "Updated" }); setEditingTx(null); onChange(); }
        setTimeout(() => setToast(null), 3000);
      };

      const handleDelete = async () => {
        const { error } = await supabase.from("cost_management_expenses").delete().eq("id", deletingTx.id);
        if (error) { setToast({ type: "error", msg: error.message }); }
        else { setToast({ type: "success", msg: "Deleted" }); setDeletingTx(null); onChange(); }
        setTimeout(() => setToast(null), 3000);
      };

      const modals = (
        <>
          {toast && (
            <div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",zIndex:999,padding:"10px 20px",borderRadius:10,fontSize:12,fontWeight:500,background:toast.type==="success"?theme.success:theme.danger,color:"#fff"}}>
              {toast.type==="success"?"✅":"❌"} {toast.msg}

            <Modal onClose={() => setEditingTx(null)}>

              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                <input type="date" value={editForm.date} onChange={e => setEditForm({...editForm, date: e.target.value})} style={{...inputStyle,fontSize:11,colorScheme:"dark"}}/>
                <input type="number" value={editForm.amount} onChange={e => setEditForm({...editForm, amount: e.target.value})} style={{...inputStyle,fontSize:11}}/>
              </div>
              <select value={editForm.category} onChange={e => setEditForm({...editForm, category: e.target.value})} style={{...inputStyle,marginBottom:8,fontSize:11,cursor:"pointer"}}>
                {categories.map(c => <option key={c.name} value={c.name}>{c.icon} {c.name}</option>)}
              </select>
              <input type="text" value={editForm.shop} onChange={e => setEditForm({...editForm, shop: e.target.value})} style={{...inputStyle,marginBottom:8,fontSize:11}}/>
              <select value={editForm.expense_type||"normal"} onChange={e => setEditForm({...editForm, expense_type: e.target.value})} style={{...inputStyle,marginBottom:8,fontSize:11,cursor:"pointer"}}>
                <option value="normal">Normal</option>
                <option value="fixed">📌 Fixed</option>
                <option value="outlier">⚡ Outlier</option>
              </select>
              <div style={{marginBottom:8}}>
                <label style={{fontSize:10,color:theme.textMuted,marginBottom:4,display:"block"}}>TAGS</label>
                <TagSelector selectedTags={editForm.tagsArray||[]} onChange={t => setEditForm({...editForm, tagsArray: t})} />
              </div>
              <input type="text" value={editForm.notes||""} onChange={e => setEditForm({...editForm, notes: e.target.value})} placeholder="Notes" style={{...inputStyle,marginBottom:10,fontSize:11}}/>
              <div style={{display:"flex",gap:6}}>
                <button onClick={() => setEditingTx(null)} style={{flex:1,padding:"8px",borderRadius:6,border:`1px solid ${theme.cardBorder}`,background:"transparent",color:theme.textMuted,cursor:"pointer",fontSize:11}}>Cancel</button>
                <button onClick={handleUpdate} style={{flex:1,padding:"8px",borderRadius:6,border:"none",background:theme.primary,color:"#fff",cursor:"pointer",fontWeight:600,fontSize:11}}>Save</button>

          {/* Delete Modal */}
          {deletingTx && (
            <Modal onClose={() => setDeletingTx(null)}>

                  <span style={{color:theme.text,fontSize:12}}>{getCatIcon(deletingTx.category)} {deletingTx.shop}</span>
                  <span style={{color:"#fff",fontWeight:600,fontSize:12}}>{fmt(deletingTx.amount)}</span>

              <div style={{display:"flex",gap:6}}>
                <button onClick={() => setDeletingTx(null)} style={{flex:1,padding:"8px",borderRadius:6,border:`1px solid ${theme.cardBorder}`,background:"transparent",color:theme.textMuted,cursor:"pointer",fontSize:11}}>Cancel</button>
                <button onClick={handleDelete} style={{flex:1,padding:"8px",borderRadius:6,border:"none",background:theme.danger,color:"#fff",cursor:"pointer",fontWeight:600,fontSize:11}}>Delete</button>
              </div>
            </Modal>
          )}
        </>
      );

      return { openEdit, requestDelete, insertExpense, modals };
    }

    // ═══════════════════════════════════════════
    //  SMART ENTRY — Phase A: Fare Calc · Phase B: Quick Recurring · Phase C: Shop Capture
    // ═══════════════════════════════════════════
    // JR East revised fares systemwide on 2026-03-14: any cache row looked up
    // before this epoch is stale regardless of the 90-day freshness rule.
    const FARE_REVISION_EPOCH = "2026-03-14";
    const FARE_CACHE_DAYS = 90;
    const SEED_STATIONS = ["Shimosanakayama","Funabashi","Nishi-Funabashi","Motoyawata","Gotanda","Minami Urawa","Musashi Urawa","Shinjuku","Okubo"];

    // cache (90 days AND after revision epoch) → Edge Function → {error, reason}
    async function fareLookup(supabase, from, to) {
      const ageFloor = new Date(Date.now() - FARE_CACHE_DAYS * 86400000).toISOString();
      const revFloor = FARE_REVISION_EPOCH + "T00:00:00+09:00";
      const floor = ageFloor > revFloor ? ageFloor : revFloor; // ISO strings compare chronologically
      try {
        const { data: rows, error } = await supabase.from("cost_management_fare_lookup_cache").select("*")
          .eq("from_station", from).eq("to_station", to).gte("looked_up_at", floor)
          .order("looked_up_at", { ascending: false }).limit(1);
        if (!error && rows && rows.length) return { ...rows[0], source: "cache" };
      } catch (e) {} // table missing / offline → treat as cache miss
      let res = null, invokeErr = null;
      try { const r = await supabase.functions.invoke("fare-lookup", { body: { from_station: from, to_station: to } }); res = r.data; invokeErr = r.error; }
      catch (e) { invokeErr = e; }
      if (invokeErr || !res || res.error) return { error: true, reason: (res && res.reason) || (invokeErr && invokeErr.message) || "Lookup failed" };
      const row = { from_station: from, to_station: to, fare_ic: res.fare_ic, fare_ticket: res.fare_ticket ?? null, distance_km: res.distance_km ?? null, route_summary: res.route_summary || "", looked_up_at: new Date().toISOString() };
      try { await supabase.from("cost_management_fare_lookup_cache").insert(row); } catch (e) {}
      return { ...row, transfers: res.transfers, source: "live" };
    }

    // Period due date for the QUICK path: unlike computeDueDate this never
    // returns null for an active rule — before a monthly/weekly rule's day it
    // returns the UPCOMING occurrence, so "Add now" stamps last_added_date with
    // the same date the launch modal would use and bookkeeping cannot drift.
    function computePeriodDue(rec, today) {
      const d = computeDueDate(rec, today);
      if (d) return d;
      const pad = (n) => String(n).padStart(2, "0");
      const ymd = (x) => `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`;
      const y = today.getFullYear(), m = today.getMonth(), dom = today.getDate(), dow = today.getDay();
      if (rec.frequency === "monthly") { const dim = new Date(y, m + 1, 0).getDate(); return ymd(new Date(y, m, Math.min(rec.day_value, dim))); }
      if (rec.frequency === "weekly") return ymd(new Date(y, m, dom + ((rec.day_value - dow + 7) % 7)));
      return ymd(today); // daily · weekdays-on-weekend
    }

    // ── Category inference cascade (Phase C) — stop at first hit ──
    // Places type → my category names. Explicit hand-written table; a mapped
    // name that doesn't exist in MY categories falls through to the next step.
    const PLACE_TYPE_CATEGORY_MAP = {
      restaurant: "Food", cafe: "Food", coffee_shop: "Food", bakery: "Food", meal_takeaway: "Food", meal_delivery: "Food", bar: "Food", food: "Food",
      convenience_store: "Groceries", supermarket: "Groceries", grocery_store: "Groceries", grocery_or_supermarket: "Groceries", liquor_store: "Groceries",
      pharmacy: "Health", drugstore: "Health", hospital: "Health", doctor: "Health", dentist: "Health", gym: "Health",
      train_station: "Transportation", subway_station: "Transportation", transit_station: "Transportation", bus_station: "Transportation", taxi_stand: "Transportation", parking: "Transportation", gas_station: "Transportation",
      clothing_store: "Shopping", shoe_store: "Shopping", department_store: "Shopping", shopping_mall: "Shopping", electronics_store: "Shopping", home_goods_store: "Shopping", furniture_store: "Shopping", book_store: "Shopping", hardware_store: "Shopping",
      movie_theater: "Entertainment", amusement_park: "Entertainment", museum: "Entertainment", tourist_attraction: "Entertainment",
      hair_care: "Personal Care", beauty_salon: "Personal Care", spa: "Personal Care", laundry: "Utilities",
    };
    // Character n-grams (NOT word tokens — Japanese has no spaces).
    const charNgrams = (s, n = 2) => { s = (s || "").toLowerCase().replace(/\s+/g, ""); const g = new Set(); for (let i = 0; i <= s.length - n; i++) g.add(s.slice(i, i + n)); return g; };
    function ngramSim(a, b) { const A = charNgrams(a), B = charNgrams(b); if (!A.size || !B.size) return 0; let inter = 0; A.forEach((g) => { if (B.has(g)) inter++; }); return (2 * inter) / (A.size + B.size); }
    const CASCADE_LABELS = { 1: "matched from your history", 2: "inferred from place type", 3: "similar shop name", 4: "no match — pick a category" };
    function inferCategory(name, expenses, placeTypes, validCats) {
      const clean = (name || "").trim();
      if (!clean) return { category: "", step: 4 };
      // 1 · exact shop-name match → most frequent category for that shop
      const hist = {};
      expenses.forEach((e) => { if (e.shop === clean) hist[e.category] = (hist[e.category] || 0) + 1; });
      const top = Object.entries(hist).sort((a, b) => b[1] - a[1])[0];
      if (top) return { category: top[0], step: 1 };
      // 2 · Places type map (only if the mapped name exists in my categories)
      for (const t of placeTypes || []) { const c = PLACE_TYPE_CATEGORY_MAP[t]; if (c && validCats.includes(c)) return { category: c, step: 2 }; }
      // 3 · fuzzy n-gram match against known shop names (chain branches)
      const shopCat = {};
      expenses.forEach((e) => { const s = (shopCat[e.shop] = shopCat[e.shop] || {}); s[e.category] = (s[e.category] || 0) + 1; });
      let best = null, bestSim = 0;
      Object.keys(shopCat).forEach((s) => { const sim = ngramSim(clean, s); if (sim > bestSim) { bestSim = sim; best = s; } });
      if (best && bestSim >= 0.5) { const c = Object.entries(shopCat[best]).sort((a, b) => b[1] - a[1])[0][0]; return { category: c, step: 3, matchedShop: best, sim: Math.round(bestSim * 100) / 100 }; }
      // 4 · fallback: leave empty, user picks
      return { category: "", step: 4 };
    }

    // ═══ PHASE B — Quick Recurring Entry panel (inside Fare Calc tab) ═══
    function QuickRecurringPanel({ dueAdd }) {
      const { theme, inputStyle, recurring, getCatIcon, getCatColor } = useTheme();
      const [busyId, setBusyId] = useState(null);
      const [amtInputs, setAmtInputs] = useState({});
      const today = new Date();
      const active = recurring.filter((r) => r.is_active).sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0) || a.name.localeCompare(b.name));
      if (!active.length) return (
        <div style={{ background: theme.cardBg, border: `1px solid ${theme.cardBorder}`, borderRadius: 12, padding: "22px 16px", marginTop: 14, textAlign: "center" }}>
          <div style={{ display: "flex", justifyContent: "center", color: theme.textMuted, marginBottom: 8 }}><Icon name="repeat" size={22}/></div>
          <div style={{ fontSize: 13, fontWeight: 700, color: "#fff", marginBottom: 4 }}>No recurring rules yet</div>
          <div style={{ fontSize: 11.5, color: theme.textDim }}>Create them in Settings → Rules, then log known recurring costs here in one tap.</div>
        </div>
      );
      const doAdd = async (rec, periodDue, amountOverride) => {
        if (busyId) return;
        setBusyId(rec.id);
        // SAME dueAdd path as the launch modal — inserts, stamps last_added_date, refetches
        await dueAdd(rec, periodDue, amountOverride);
        setBusyId(null);
      };
      return (
        <div style={{ background: theme.cardBg, border: `1px solid ${theme.cardBorder}`, borderRadius: 12, padding: 16, marginTop: 14 }}>
          <div style={{ fontSize: 13.5, fontWeight: 700, color: "#fff", display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}><Icon name="repeat" size={15}/>Quick recurring entry</div>
          <div style={{ fontSize: 11, color: theme.textDim, marginBottom: 12 }}>Log a known recurring cost now, without waiting for its due prompt.</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {active.map((rec) => {
              const periodDue = computePeriodDue(rec, today);
              const alreadyAdded = rec.last_added_date != null && rec.last_added_date >= periodDue;
              const needsAmount = rec.amount == null;
              const rawAmt = amtInputs[rec.id];
              const amtNum = parseInt(rawAmt, 10);
              const amtValid = rawAmt != null && String(rawAmt).trim() !== "" && Number.isInteger(amtNum) && amtNum > 0;
              const busy = busyId === rec.id;
              const col = getCatColor(rec.category);
              return (
                <div key={rec.id} style={{ borderRadius: 11, background: theme.inputBg, boxShadow: `inset 0 0 0 1px ${theme.cardBorder}`, padding: "10px 12px", opacity: alreadyAdded ? 0.55 : busy ? 0.6 : 1 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <span style={{ width: 28, height: 28, borderRadius: 8, background: `${col}22`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15, flexShrink: 0 }}>{getCatIcon(rec.category)}</span>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 13, fontWeight: 600, color: "#fff", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{rec.name}</div>
                      <div style={{ fontSize: 10, color: theme.textDim }}>{freqSummary(rec)} · due {periodDue}{rec.last_added_date ? ` · last added ${rec.last_added_date}` : ""}</div>
                    </div>
                    <span style={{ fontSize: 13, fontWeight: 700, color: "#fff", whiteSpace: "nowrap" }}>{needsAmount ? "ask" : fmt(rec.amount)}</span>
                    {alreadyAdded ? (
                      <span style={{ fontSize: 10.5, fontWeight: 600, color: theme.textDim, whiteSpace: "nowrap" }}>already added {rec.last_added_date}</span>
                    ) : (
                      <button onClick={() => doAdd(rec, periodDue, needsAmount ? amtNum : undefined)} disabled={busy || (needsAmount && !amtValid)} style={{ border: "none", borderRadius: 8, padding: "7px 12px", fontSize: 11.5, fontWeight: 700, color: "#fff", fontFamily: "inherit", background: `linear-gradient(135deg,${theme.primary},${theme.accent})`, cursor: busy || (needsAmount && !amtValid) ? "not-allowed" : "pointer", opacity: needsAmount && !amtValid ? 0.5 : 1, whiteSpace: "nowrap" }}>Add now</button>
                    )}
                  </div>
                  {!alreadyAdded && needsAmount && (
                    <input type="number" inputMode="numeric" value={rawAmt ?? ""} onChange={(e) => setAmtInputs((p) => ({ ...p, [rec.id]: e.target.value }))} placeholder={CUR.symbol + " Enter amount"} disabled={busy} style={{ ...inputStyle, fontSize: 13, fontWeight: 600, marginTop: 8 }}/>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ═══ SMART TAB — Fare · Capture · Recurring unified under one segmented control ═══
